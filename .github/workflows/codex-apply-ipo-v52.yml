name: codex-apply-ipo-v52

on:
  push:
    branches:
      - codex/ipo-ai-heat-v52-rollback

permissions:
  contents: write

concurrency:
  group: codex-apply-ipo-v52
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/ipo-ai-heat-v52-rollback
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct and verify the reviewed patch
        shell: bash
        run: |
          cat .codex-patch/part-*.b64 > /tmp/codex-ipo-v52.patch.gz.b64
          base64 --decode /tmp/codex-ipo-v52.patch.gz.b64 | gzip --decompress > /tmp/codex-ipo-v52.patch
          echo "a055cd8e34b60b1563db4fb989e8257d8a7aea78f297be3f2f2f74b8a8e6f76f  /tmp/codex-ipo-v52.patch" | sha256sum --check --strict
          git apply --check /tmp/codex-ipo-v52.patch
          git apply /tmp/codex-ipo-v52.patch
          rm -rf .codex-patch
          rm .github/workflows/codex-apply-ipo-v52.yml
      - name: Install verification dependencies
        run: pip install anthropic typer pydantic pyyaml python-frontmatter numpy scipy pytest
      - name: Rebuild and replay-verify the V5.2 research candidate
        shell: bash
        run: |
          cd src
          python -m ai_fc scenario-v5-2-build --force
          python -m ai_fc scenario-v5-2-verify --replay
      - name: Run focused regression suite
        shell: bash
        run: |
          pytest src/tests/test_statistics_lab.py src/tests/test_dashboard_js_geometry.py src/tests/test_scenario_v5_2.py -q
          node --check src/ai_fc/dashboard_parts/dashboard.js
          git diff --check
      - name: Commit the reviewed implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: compare IPO heat and restore research inputs"
          git push origin HEAD:codex/ipo-ai-heat-v52-rollback
