name: codex-refresh-inventory

on:
  push:
    branches:
      - codex/ipo-ai-heat-v52-rollback

permissions:
  contents: write

concurrency:
  group: codex-refresh-inventory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/ipo-ai-heat-v52-rollback
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inventory dependencies
        run: pip install anthropic typer pydantic pyyaml python-frontmatter numpy scipy
      - name: Regenerate deterministic inventory
        run: |
          cd src
          python -m ai_fc inventory
      - name: Commit exact remote inventory and remove helper
        shell: bash
        run: |
          rm .github/workflows/codex-refresh-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/inventory.generated.md docs/generated/licenses.generated.md docs/generated/read_model_v2.schema.json .github/workflows/codex-refresh-inventory.yml
          git commit -m "chore: refresh generated inventory in CI"
          git push origin HEAD:codex/ipo-ai-heat-v52-rollback
