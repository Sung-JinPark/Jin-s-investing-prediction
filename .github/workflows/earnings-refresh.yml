name: earnings-transport-probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/earnings-transport-fix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare already declared collection dependencies
        run: pip install -e .
      - name: Verify bounded live backup watch without publishing
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from ai_fc.earnings_watch import watch_earnings
          root=Path.cwd()
          ledger=root/'data/calendar/event_consensus.jsonl'
          before=hashlib.sha256(ledger.read_bytes()).hexdigest()
          report=watch_earnings(root,output_dir='.tmp/transport-watch-probe',max_seconds=90,poll_seconds=30)
          manifest=json.loads((Path(report['bundle_path'])/'manifest.json').read_text(encoding='utf-8'))
          statuses=manifest['event_status']
          print(json.dumps({key:report.get(key) for key in ['status','changed_hint','watch_attempts','watch_seconds','watch_pending','watch_until','source_failures']},indent=2),flush=True)
          print(json.dumps({'event_status':statuses},indent=2),flush=True)
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==before,'probe mutated canonical ledger'
          assert report['changed_hint'] is False,'unexpected new actual: review the preserved bundle'
          assert report['watch_attempts']>=2,'a source failure terminated the healthy watch'
          assert report['watch_pending'] is True,'confirmed pending release lost its continuation'
          assert any(s['event_id']=='tsmc_2026_q3' and s['kind']=='nasdaq' and s['status']=='pending' for s in statuses),'Nasdaq did not provide a healthy pending receipt'
          print('BOUNDED_LIVE_WATCH_PASS: repeated healthy backup polling; canonical ledger unchanged',flush=True)
          PY
          git diff --exit-code -- data/calendar
