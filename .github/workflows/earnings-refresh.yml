name: earnings-transport-probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public issuer transports without writing any ledger
        run: |
          python - <<'PY'
          import concurrent.futures
          import hashlib
          import ssl
          import subprocess
          import urllib.request
          print(ssl.OPENSSL_VERSION, flush=True)
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
          urls = [
              'https://investor.tsmc.com/english/quarterly-results/2026/q3',
              'https://pr.tsmc.com/english',
              'https://pr.tsmc.com/english/news/3326',
              'https://live.euronext.com/en/listview/company-press-release/058805',
              'https://investor.cld.tsmc.com/english/quarterly-results/2026/q3',
              'https://pr.cld.tsmc.com/english/latest-news',
              'https://pr.cld.tsmc.com/english/news/3326',
              'https://pr.tsmc.com/english/latest-news',
          ]
          def probe(url):
              rows=[]
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      body=response.read(8_000_001)
                      rows.append(('urllib',response.status,len(body),hashlib.sha256(body).hexdigest()))
              except Exception as exc:
                  rows.append(('urllib',type(exc).__name__,str(exc)[:240]))
              for label, flags in [('curl-default',[]),('curl-ua',['--user-agent',ua]),('curl-http1-ua',['--http1.1','--user-agent',ua])]:
                  command=['curl','-sS','--location','--fail-with-body','--compressed','--max-time','15',*flags,'--write-out','\nPROBE_HTTP:%{http_code}',url]
                  try:
                      result=subprocess.run(command,capture_output=True,timeout=20,check=False)
                      body,_,status=result.stdout.rpartition(b'\nPROBE_HTTP:')
                      rows.append((label,result.returncode,status.decode('utf-8','replace'),len(body),result.stderr.decode('utf-8','replace')[:240]))
                  except Exception as exc:
                      rows.append((label,type(exc).__name__,str(exc)[:240]))
              return url, rows
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for url, rows in pool.map(probe,urls):
                  print(url,rows,flush=True)
          PY
