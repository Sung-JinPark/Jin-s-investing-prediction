name: earnings-refresh
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/daily6m-live-inputs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare the existing declared replay dependencies
        run: pip install -e ".[pit,timeseries]" "exchange-calendars>=4.6,<5"
      - name: Capture and replay real official inputs in a disposable research store
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          from ai_fc.daily6m_sources import capture_daily6m_sources, apply_daily6m_sources, load_verified_source_observations
          root=Path.cwd()
          disposable=root/'.tmp/collector-probe'
          (disposable/'data').mkdir(parents=True)
          (disposable/'data/timeseries').symlink_to(root/'data/timeseries',target_is_directory=True)
          report=capture_daily6m_sources(disposable,output_dir=disposable/'.tmp/capture')
          print('CAPTURE',json.dumps(report),flush=True)
          assert report['status']=='captured' and not report['source_failures'] and not report.get('source_pending')
          applied=apply_daily6m_sources(disposable,bundle_dir=disposable/'.tmp/capture')
          print('APPLY',json.dumps(applied),flush=True)
          assert applied['status']=='applied' and applied['changed'] is True
          rows=load_verified_source_observations(disposable,as_of=datetime.now(timezone.utc))
          assert {row['source_id'] for row in rows}=={'nasdaq_comp_official','cboe_vix_archive','us_treasury_yield_archive'}
          print('VERIFIED_ROWS',json.dumps([{k:r[k] for k in ['source_id','series_id','observation_time','value','available_at','raw_sha256']} for r in rows]),flush=True)
          replay=apply_daily6m_sources(disposable,bundle_dir=disposable/'.tmp/capture')
          assert replay['changed'] is False and replay['appended']==0
          print('REAL_OFFICIAL_CAPTURE_REPLAY_NOOP_PASS',flush=True)
          PY
          git diff --exit-code -- data
