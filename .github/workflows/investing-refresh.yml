name: investing-refresh

on:
  schedule:
    # 미국 금요일 장 마감 뒤 토요일 02:15 UTC (11:15 KST).
    - cron: "15 2 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke=키/모델 최소 검증, full=수집+due 예측"
        required: true
        default: "full"
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: write

concurrency:
  group: investing-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install forecast engine
        run: pip install -e "."
      - name: Rebuild the derived index from durable ledgers
        run: python -m ai_fc sync --rebuild

      - name: Refresh Yahoo and FRED quantitative base rates
        id: quant
        if: env.RUN_MODE == 'full'
        continue-on-error: true
        run: python -m ai_fc quant
      - name: Refresh Kalshi, Polymarket, CBOE and Yahoo market references
        id: market
        if: env.RUN_MODE == 'full'
        continue-on-error: true
        run: python -m ai_fc market
      - name: Refresh completed-market-day Nasdaq scenario
        id: scenario
        if: env.RUN_MODE == 'full'
        continue-on-error: true
        run: python -m ai_fc scenario
      - name: Refresh BTC, Nasdaq and Realty Income transmission map
        id: cross_asset
        if: env.RUN_MODE == 'full'
        continue-on-error: true
        run: python -m ai_fc cross-asset

      - name: Verify the owner-approved OpenAI producer
        env:
          AI_FC_OFFICIAL_LLM_PROVIDER: openai
          AI_FC_OPENAI_OFFICIAL_MODEL: gpt-5.6-terra
        run: python -m ai_fc provider-guard

      # C5-A4 (2026-09-11): 이 스텝에서 **공식 예측 생산을 뺐다**.
      #
      # T05 는 `openai:gpt-5.6-terra` + 축소 핀(검색 3~4회·리서치 6000토큰) 조합을
      # "게이트급 회차를 하나도 내지 못했다"(0/4 ok, Fisher p=0.029)로 은퇴시켰다.
      # 그런데 은퇴는 레지스트리의 `tier: lite` **라벨**에만 걸렸고 그 라벨을 실제로
      # 만들어 내던 이 스텝은 그대로 남아 있었다 — lite 가 standard 로 승격된 뒤에는
      # 같은 조합이 매주 `pipeline_tier: standard` 로 게이트 표본에 들어갔을 것이다.
      # 은퇴한 생산자를 라벨만 바꿔 계속 돌리는 것이 그냥 돌리는 것보다 나쁘다.
      #
      # 게이트 회차는 로컬 anthropic cli/api 경로 전용이다(실측 $2.303/회차, 5/5 ok).
      # 여기 남은 유료 호출은 키 생존 확인 smoke 하나(<$0.01)뿐이라 상한도 거기 맞춘다.
      # 되살리려면 이 run 과 위 두 상한을 **함께** 올려야 한다.
      #
      # 2026-09-11: 케이던스(주 3건)는 죽지 않았다 — 실행 주체만 옮겼다. 로컬 예약 작업
      # `weekly-forecast-3`(토 11:30 KST, 이 워크플로의 데이터 수집 직후)이 anthropic
      # 경로로 3건을 낸다. 여기를 되살리는 대신 그쪽을 쓴 이유는 DECISIONS.md 참조
      # (요지: 저장소 시크릿에 ANTHROPIC_API_KEY 가 없고, 있는 것은 은퇴한 openai 경로뿐).
      - name: Verify the OpenAI key still resolves (no official forecast is produced here)
        id: openai
        continue-on-error: true
        env:
          # The secret exists only in this billable step and is never written or printed.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_FC_OFFICIAL_LLM_PROVIDER: openai
          AI_FC_OPENAI_OFFICIAL_MODEL: gpt-5.6-terra
          AI_FC_OPENAI_REASONING_EFFORT: medium
          AI_FC_MONTHLY_BUDGET: "2.00"
          AI_FC_OPENAI_MONTHLY_BUDGET: "2.00"
        shell: bash
        run: python -m ai_fc openai-smoke

      - name: Rebuild and replay-verify V5.2 after every protected write
        if: env.RUN_MODE == 'full'
        run: |
          python -m ai_fc scenario-v5-2-build --force
          python -m ai_fc scenario-v5-2-verify --replay

      - name: Refresh generated inventory
        if: always()
        continue-on-error: true
        run: python -m ai_fc inventory

      - name: Commit durable updates
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/base_rates data/ml_history data/scenarios data/cross_asset forecasts \
            calibration/cost_log.csv docs/generated
          if git diff --cached --quiet; then
            echo "No investing data changes to commit."
            exit 0
          fi
          git commit -m "data: automated investing refresh $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report partial refresh failures after preserving completed work
        if: always()
        shell: bash
        run: |
          failed=0
          for outcome in \
            "quant:${{ steps.quant.outcome }}" \
            "market:${{ steps.market.outcome }}" \
            "scenario:${{ steps.scenario.outcome }}" \
            "cross_asset:${{ steps.cross_asset.outcome }}" \
            "openai:${{ steps.openai.outcome }}"; do
            name="${outcome%%:*}"
            state="${outcome#*:}"
            if [[ "$state" == "failure" ]]; then
              echo "::error title=${name} refresh failed::Inspect the preceding step log."
              failed=1
            fi
          done
          exit "$failed"
