name: ipo-edgar-watch

on:
  schedule:
    # 금요일 23:40 UTC. 현재 연도 IPO 판정을 먼저 반영한 뒤 statistics-refresh(00:20)가
    # 같은 기준을 읽어 사이트 통계를 재생성한다.
    - cron: "40 23 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investing-data-writer
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install statistics pipeline
        run: pip install -e "." pytest
      - name: Sweep EDGAR 424B4 and classify completed AI IPOs
        run: python -m ai_fc ipo-edgar-watch
      - name: Validate the watch contract
        run: pytest -q src/tests/test_ipo_edgar_watch.py
      - name: Commit the classification ledger and current-year projection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/statistics/ipo/edgar_candidates.json \
            data/statistics/ipo/classification_decisions.jsonl \
            data/statistics/ipo/ipo_comparison_v1.json
          unexpected="$(git diff --cached --name-only | grep -Ev '^data/statistics/ipo/(edgar_candidates\.json|classification_decisions\.jsonl|ipo_comparison_v1\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected or protected path staged by the EDGAR watch:"
            echo "$unexpected"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No new EDGAR candidates to commit."
            exit 0
          fi
          git commit -m "data: classify EDGAR AI IPOs $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report the review queue
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          queue = pathlib.Path("data/statistics/ipo/edgar_candidates.json")
          rows = json.loads(queue.read_text(encoding="utf-8"))
          print(f"## EDGAR 424B4 automatic classification — {rows['status']}")
          print(f"- window: `{rows['window_start']}` → `{rows['window_end']}`"
                f" (reviewed through `{rows['reviewed_through']}`)")
          print(f"- counts: `{rows['counts']}`")
          if rows["errors"]:
              print(f"- errors: `{rows['errors']}`")
          print("")
          print("| filed | company | decision | reason | filing |")
          print("| --- | --- | --- | --- | --- |")
          for row in rows["candidates"]:
              reasons = ", ".join(row.get("reason_codes", []))
              print(f"| {row['filed_at']} | {row['company']} | {row['review_status']} | {reasons} "
                    f"| [{row['accession']}]({row['filing_url']}) |")
          print("")
          print("Eligible current-year traditional IPOs are projected automatically. "
                "Every decision is preserved in the append-only classification ledger.")
          PY
