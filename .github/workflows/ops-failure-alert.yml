name: ops-failure-alert

# Deterministic failure surfacing for every scheduled data-writer pipeline:
# when a run fails, create or update one labeled issue so failures are visible
# without watching the Actions tab. No LLM, no new secrets.
#
# 2026-09-09: 감시 범위를 2개에서 데이터 라이터 전부로 넓혔다. 좁은 감시 탓에
# timeseries-v5-refresh 는 2026-08-25 부터 12일 연속 실패한 채로, timeseries-v13-vol-live
# 는 사흘 동안 라이브 전진 표본을 못 쌓은 채로 아무 신호 없이 지나갔다.

on:
  workflow_run:
    workflows:
      - timeseries-refresh
      - timeseries-v2-refresh
      - timeseries-v5-refresh
      - timeseries-v4-data-refresh
      - timeseries-v8-shadow
      - timeseries-v13-vol-live
      - scenario-refresh
      - ai-regime-refresh
      - statistics-refresh
      - source-monitoring
      - investing-refresh
      - ipo-edgar-watch
      - monthly-research-pack
      - ots-stamp
      - statistics-alert-email
    types: [completed]

permissions:
  issues: write
  actions: read

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the standing failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          title="ops: ${RUN_NAME} 실패 감시"
          body="- ${RUN_STARTED} [${RUN_EVENT}] 실패: ${RUN_URL}"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label ops-failure --state open \
            --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create ops-failure --repo "$GITHUB_REPOSITORY" \
              --description "refresh pipeline failure" --color B60205 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --label ops-failure --body "$body"
          fi
