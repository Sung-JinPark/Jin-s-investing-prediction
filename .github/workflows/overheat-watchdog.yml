name: overheat-watchdog

# 닷컴 대비 과열도 자동 감시 (2026-11-10 사용자 지시: "항상 잘 업데이트 되는지 자동 감시").
#
# statistics-refresh 안의 14종 감사는 같은 실행 안에서 돌아 예약 실행 자체가 멈추면 침묵하고, 자료 나이 상한
# (월간 75일·분기 180일)으로 보므로 원천의 새 발표를 놓쳐도 몇 달 뒤에야 잡는다. 이 워크플로는 별도 예약으로
# 원천(FRED) 최신 관측일 대조 · 마지막 성공 실행 · 배포 사이트 · IPO 원천 · 테마 상장 감시를 결정론으로 확인하고,
# 실패·경고를 라벨 이슈 하나로 올렸다가(본문 갱신) 모두 해소되면 스스로 닫는다. LLM 없음, 데이터 쓰기 없음.

on:
  schedule:
    - cron: "40 0 * * *"    # KST 09:40 — 아침 갱신(22:23·01:23 UTC) 뒤
    - cron: "40 12 * * *"   # KST 21:40 — 오후 갱신(06:20 UTC) 뒤, 하루 두 번
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: overheat-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "."
      - name: Last successful statistics-refresh
        id: last
        run: |
          last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow statistics-refresh.yml --branch main \
            --limit 40 --json conclusion,updatedAt \
            --jq '[.[] | select(.conclusion=="success")][0].updatedAt // ""')"
          echo "at=$last" >> "$GITHUB_OUTPUT"
      - name: Run the watchdog
        id: run
        run: |
          python -m ai_fc overheat-watchdog \
            --last-success "${{ steps.last.outputs.at }}" \
            --output "$RUNNER_TEMP/overheat-watchdog.json" \
            --markdown "$RUNNER_TEMP/overheat-watchdog.md" | tee -a "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          report = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "overheat-watchdog.json"), encoding="utf-8"))
          print(f"status={report['status']}")
          print(f"fail={report['counts']['fail']}")
          print(f"warn={report['counts']['warn']}")
          PY
      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: overheat-watchdog-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/overheat-watchdog.json
            ${{ runner.temp }}/overheat-watchdog.md
          if-no-files-found: warn
          retention-days: 30
      - name: Open, refresh, or close the standing watchdog issue
        env:
          STATUS: ${{ steps.run.outputs.status }}
          FAIL: ${{ steps.run.outputs.fail }}
          WARN: ${{ steps.run.outputs.warn }}
        run: |
          title="ops: 닷컴 대비 과열도 자동 감시"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label overheat-watchdog --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ "$STATUS" = "ok" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "모든 점검 정상 — 원천 대조·갱신 생존·배포 사이트·IPO·테마 상장 감시. 자동 종료합니다."
            fi
            echo "정상 — 열린 이슈 없음"
            exit 0
          fi
          {
            echo "자동 생성 — 이 본문은 감시 실행마다 갱신되며, 모든 점검이 정상이 되면 이슈가 자동으로 닫힙니다."
            echo
            echo "**실패 ${FAIL} · 경고 ${WARN}** — 실행: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat "$RUNNER_TEMP/overheat-watchdog.md"
            echo
            echo "확인: \`cd src && python -m ai_fc overheat-watchdog\` (FRED_API_KEY 필요)"
          } > "$RUNNER_TEMP/issue.md"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
            echo "이슈 #$number 본문 갱신"
          else
            gh label create overheat-watchdog --repo "$GITHUB_REPOSITORY" \
              --description "dotcom overheat update watchdog" --color D93F0B 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --label overheat-watchdog --body-file "$RUNNER_TEMP/issue.md"
          fi
