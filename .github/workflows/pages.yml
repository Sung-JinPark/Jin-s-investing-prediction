# 예측 흐름 대시보드 → GitHub Pages 정적 배포.
# 커밋된 불변 파일(forecasts·ledger·ml_history·registry)에서 DB를 재구축해 빌드 —
# LLM 호출 없음, 시크릿 0. 데이터는 이미 공개 repo에 존재하는 예측 기록.
# 쓰기는 러너 로컬뿐(파생 SQLite·V5.2 후보 재빌드) — repo에는 아무것도 커밋하지 않는다.
name: pages
on:
  push:
    branches: [main]
    paths:                     # 데이터·엔진 변경 시에만 재배포
      - "forecasts/**"
      - "calibration/**"
      - "data/**"
      - "questions/**"
      - "src/ai_fc/dashboard*"
      - "src/ai_fc/dashboard_parts/**"
      - "src/ai_fc/scenario_v5_2/**"
      - "src/ai_fc/statistics_lab.py"
      - "src/ai_fc/timeseries/**"
      - "src/ai_fc/timeseries_v5/**"
      - "src/ai_fc/multi_year_stress.py"
      - "data/contracts/statistics_lab_v1.yaml"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "30 1 * * 6"       # 주간 리프레시 커밋 이후 (토 KST 오전)
  workflow_dispatch:
  workflow_run:
    workflows: ["investing-refresh", "scenario-refresh", "ai-regime-refresh", "statistics-refresh", "timeseries-refresh", "timeseries-v5-refresh", "timeseries-v2-refresh", "timeseries-v8-shadow"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps (시크릿 불필요 — import 경로용)
        run: pip install anthropic typer pydantic pyyaml python-frontmatter numpy scipy "Pillow>=10"
      - name: 파생 인덱스 재구축 (불변 파일 → SQLite)
        run: cd src && python -m ai_fc sync --rebuild
      # V5.2 후보를 배포 시점 데이터로 재빌드한다 (시크릿 0 — 커밋된 데이터만 입력).
      # 어떤 워크플로/PR 머지가 보호 경로(data/cross_asset 등)를 움직였든, 여기서
      # protected_before가 현재 트리로 재봉인되어 런타임 게이트가 열린 채 배포된다.
      # 산출물은 러너 워킹트리에만 쓰이고 repo에는 커밋하지 않는다 — _site 입력 전용.
      # 실패해도 배포는 계속한다: #future는 게이트 사유를 표시하고(fail-closed 유지),
      # 나머지 대시보드 표면(통계·v8 등)의 갱신을 막지 않는다.
      - name: V5.2 후보 배포시점 재빌드 + replay 검증 (커밋 데이터만, repo 미기록)
        id: v52_rebuild
        continue-on-error: true
        run: |
          cd src
          python -m ai_fc scenario-v5-2-build --force
          python -m ai_fc scenario-v5-2-verify --replay
      - name: V5.2 재빌드 실패 고지 (배포는 계속 — 게이트 사유가 화면에 표시됨)
        if: ${{ steps.v52_rebuild.outcome == 'failure' }}
        run: echo "::warning::V5.2 candidate rebuild failed; deploying with the committed candidate (runtime gate will disclose the reason on #future)."
      - name: 대시보드 정적 빌드 (읽기 전용, API 키 불필요)
        run: cd src && python -m ai_fc dashboard --pages-out ../_site
      # Pages는 repo Settings→Pages→Source="GitHub Actions"로 1회 수동 활성화 필요
      # (토큰이 Pages를 생성할 권한이 없어 자동 활성화 불가 — 활성화 후 이 단계 정상)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
