name: scenario-refresh

on:
  schedule:
    # 미국 장 마감 후 화–토 01:30 UTC. 휴장일은 같은 as-of라 커밋하지 않는다.
    - cron: "30 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scenario-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight scenario dependencies
        run: pip install typer pydantic pyyaml python-frontmatter numpy scipy
      - name: Refresh NASDAQ scenario snapshot
        run: cd src && python -m ai_fc scenario
      - name: Commit a new completed-market-day snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scenarios
          if git diff --cached --quiet; then
            echo "No new completed market day; nothing to commit."
            exit 0
          fi
          asof="$(python -c "import json; print(json.load(open('data/scenarios/nasdaq_latest.json', encoding='utf-8'))['asof'])")"
          git commit -m "data: refresh Nasdaq scenario ${asof}"
          git push
