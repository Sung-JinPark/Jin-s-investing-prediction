name: statistics-refresh

on:
  schedule:
    # 매일 06:20 UTC (15:20 KST): 미국 전일 장 마감·원천 게시 뒤 확인.
    # 월·분기 계열은 새 발표만 반영하고 실제 관측일을 보존한다.
    - cron: "20 6 * * *"
    # Morning capture plus a retry for delayed official API releases.
    - cron: "23 22 * * 1-5"
    - cron: "23 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.ref != 'refs/heads/main' && format('statistics-skipped-{0}', github.run_id) || 'investing-data-writer' }}
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install statistics pipeline
        run: pip install -e "." pytest
      - name: Check academic IPO sources for current-era batch updates
        run: python -m ai_fc ipo-reference-batch
      - name: Refresh monthly IPO counts (Ritter confirmed + Nasdaq provisional)
        # Fail-soft by design: a failed fetch keeps the stored tables and records the reason.
        run: python -m ai_fc ipo-monthly-counts
      - name: Watch foreign theme listings after the census and auto-review them (theme_listing_auto_review_v3)
        # Fail-soft per venue and per listing: a failed exchange keeps its last listings and is marked stale;
        # a listing whose business description cannot be fetched stays pending and is retried next run.
        run: python -m ai_fc theme-listing-watch
      - name: Fetch authoritative sources and append the official observation ledger
        run: python -m ai_fc statistics-refresh
      - name: Export the cumulative Excel audit view
        run: python -m ai_fc official-data-workbook
      - name: Validate statistics database and dashboard contract
        run: >-
          pytest -q
          src/tests/test_authoritative_statistics.py
          src/tests/test_official_data_workbook.py
          src/tests/test_statistics_lab.py
          src/tests/test_statistics_quarter_alignment.py
          src/tests/test_statistics_native.py
          src/tests/test_wti_history.py
          src/tests/test_dotcom_overheat.py
          src/tests/test_statistics_freshness.py
          src/tests/test_statistics_refresh_workflow.py
          src/tests/test_theme_listing_watch.py
          src/tests/test_theme_listing_review.py
          src/tests/test_theme_listing_global.py
          src/tests/test_ipo_monthly_counts.py
          src/tests/test_dashboard.py
      - name: Refresh generated repository inventory
        run: cd src && python -m ai_fc inventory
      - name: Commit changed statistics snapshot
        id: commit
        shell: bash
        run: |
          echo "committed=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/statistics/dotcom_statistics_latest.json \
            data/statistics/archive \
            data/statistics/ipo/reference_batch_status.json \
            data/statistics/ipo/reference_batch_receipts \
            data/statistics/ipo/ritter_ipoall_monthly.json \
            data/statistics/ipo/nasdaq_calendar_monthly.json \
            data/statistics/ipo/monthly_counts_status.json \
            data/statistics/ipo/theme_listing_watch.json \
            data/statistics/ipo/theme_listing_additions.csv \
            data/statistics/ipo/theme_listing_reviews.csv \
            data/statistics/ipo/theme_listing_pipeline.csv \
            data/statistics/official_store/raw \
            data/statistics/official_store/ledgers \
            data/statistics/workbooks/official_data_latest.xlsx \
            docs/generated/inventory.generated.md
          unexpected="$(git diff --cached --name-only | grep -Ev '^(data/statistics/(dotcom_statistics_latest.json|archive/.*|ipo/(reference_batch_(status.json|receipts/.*)|ritter_ipoall_monthly.json|nasdaq_calendar_monthly.json|monthly_counts_status.json|theme_listing_(watch.json|additions.csv|reviews.csv|pipeline.csv))|official_store/(raw|ledgers)/.*|workbooks/official_data_latest.xlsx)|docs/generated/inventory.generated.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected or protected path staged by statistics refresh:"
            echo "$unexpected"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No statistics changes to commit."
            exit 0
          fi
          git commit -m "data: daily dotcom statistics refresh $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"
      - name: Publish verified changed statistics
        if: ${{ steps.commit.outcome == 'success' && steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Audit all 14 indicators after publishing verified partial updates
        if: ${{ always() }}
        shell: bash
        run: >-
          python -m ai_fc statistics-freshness
          --output "$RUNNER_TEMP/statistics-freshness.json" --strict
          | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve the per-indicator freshness audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: statistics-freshness-${{ github.run_id }}
          path: ${{ runner.temp }}/statistics-freshness.json
          if-no-files-found: warn
          retention-days: 30
