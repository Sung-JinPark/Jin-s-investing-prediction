name: statistics-refresh

on:
  schedule:
    # 매일 06:20 UTC (15:20 KST): 미국 전일 장 마감·원천 게시 뒤 확인.
    # 월·분기 계열은 새 발표만 반영하고 실제 관측일을 보존한다.
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investing-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install statistics pipeline
        run: pip install -e "." pytest
      - name: Check academic IPO sources for current-era batch updates
        run: python -m ai_fc ipo-reference-batch
      - name: Refresh monthly IPO counts (Ritter confirmed + Nasdaq provisional)
        # Fail-soft by design: a failed fetch keeps the stored tables and records the reason.
        run: python -m ai_fc ipo-monthly-counts
      - name: Fetch authoritative sources and append the official observation ledger
        run: python -m ai_fc statistics-refresh
      - name: Export the cumulative Excel audit view
        run: python -m ai_fc official-data-workbook
      - name: Validate statistics database and dashboard contract
        run: >-
          pytest -q
          src/tests/test_authoritative_statistics.py
          src/tests/test_official_data_workbook.py
          src/tests/test_statistics_lab.py
          src/tests/test_dotcom_overheat.py
          src/tests/test_dashboard.py
      - name: Refresh generated repository inventory
        run: cd src && python -m ai_fc inventory
      - name: Commit changed statistics snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/statistics/dotcom_statistics_latest.json \
            data/statistics/archive \
            data/statistics/ipo/reference_batch_status.json \
            data/statistics/ipo/reference_batch_receipts \
            data/statistics/ipo/ritter_ipoall_monthly.json \
            data/statistics/ipo/nasdaq_calendar_monthly.json \
            data/statistics/ipo/monthly_counts_status.json \
            data/statistics/official_store/raw \
            data/statistics/official_store/ledgers \
            data/statistics/workbooks/official_data_latest.xlsx \
            docs/generated/inventory.generated.md
          unexpected="$(git diff --cached --name-only | grep -Ev '^(data/statistics/(dotcom_statistics_latest.json|archive/.*|ipo/(reference_batch_(status.json|receipts/.*)|ritter_ipoall_monthly.json|nasdaq_calendar_monthly.json|monthly_counts_status.json)|official_store/(raw|ledgers)/.*|workbooks/official_data_latest.xlsx)|docs/generated/inventory.generated.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected or protected path staged by statistics refresh:"
            echo "$unexpected"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No statistics changes to commit."
            exit 0
          fi
          git commit -m "data: daily dotcom statistics refresh $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
