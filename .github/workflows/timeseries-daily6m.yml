name: timeseries-daily6m

# Run after the existing source collector completes. The later fallback also
# clears native ALFRED's conservative New York availability cutoff and allows
# delayed source checkpoints to reach main before the research run.
# New completed origins append explicit revisions within the same ISO week.
# An hourly retry also recovers a missed dispatch after sources were appended.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["timeseries-v2-refresh"]
    types: [completed]
  schedule:
    - cron: "20 9 * * 2-6"
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.head_branch != 'main') && format('daily6m-skipped-{0}', github.run_id) || 'investing-data-writer-daily6m' }}
  cancel-in-progress: false

jobs:
  research:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Use the already declared numerical dependencies
        run: pip install -e ".[pit,timeseries]" "exchange-calendars>=4.6,<5" pytest
      - name: Refresh the latest completed origin without rewriting prior forecasts
        run: python -m ai_fc timeseries-daily6m-forecast --refresh-latest
      - name: Score only completed and published daily outcomes
        run: python -m ai_fc timeseries-daily6m-resolve
      - name: Recheck preview gates and publish current HOLD or ready pointer
        run: python -m ai_fc timeseries-daily6m-latest
      - name: Verify the separate research chain and targeted contracts
        run: |
          python -m ai_fc timeseries-daily6m-verify
          pytest src/tests/test_timeseries_daily6m_model.py src/tests/test_timeseries_daily6m_pipeline.py src/tests/test_timeseries_daily6m_refresh.py -q
      - name: Preserve full simulated paths as research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily6m-paths-${{ github.run_id }}
          path: outputs/timeseries_daily6m/
          if-no-files-found: ignore
      - name: Commit only the new research ledger and derived pointer
        id: commit
        shell: bash
        run: |
          echo "committed=false" >> "$GITHUB_OUTPUT"
          if test -d data/timeseries_daily6m; then
            git add data/timeseries_daily6m
          fi
          unexpected="$(git diff --cached --name-only | grep -Ev '^data/timeseries_daily6m/' || true)"
          test -z "$unexpected" || { echo "unexpected daily6m paths: $unexpected"; exit 1; }
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: append six-month daily research forecast and outcomes"
            git pull --rebase origin main
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
      # The fast collector dispatches this workflow with GITHUB_TOKEN; use an
      # explicit deployment after the final pointer is committed to main.
      - name: Deploy committed research updates from an explicit trigger
        if: ${{ github.event_name == 'workflow_dispatch' && steps.commit.outcome == 'success' && steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
