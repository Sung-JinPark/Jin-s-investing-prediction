name: timeseries-v2-refresh

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/timeseries-v2-refresh.yml"
      - "data/contracts/multivariate_timeseries_v2.yaml"
      - "src/ai_fc/timeseries_v2/**"
      - "src/tests/test_multivariate_timeseries_v2.py"
      - "src/tests/test_ralph_timeseries.py"
      - "tools/ralph_timeseries.py"
      - "src/ai_fc/cli.py"
      - "src/ai_fc/dashboard.py"
      - "src/ai_fc/dashboard_parts/dashboard.js"
      - "src/ai_fc/read_model_contract.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/timeseries-v2-refresh.yml"
      - "data/contracts/multivariate_timeseries_v2.yaml"
      - "src/ai_fc/timeseries_v2/**"
  schedule:
    # Tue-Sat after the US close. Weekly/monthly work is selected inside the job.
    - cron: "35 1 * * 2-6"
  workflow_dispatch:
    inputs:
      run_backtest:
        description: "Run the one-time sealed V2 evaluation if none exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: timeseries-v2-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # pull_request normally checks out a detached merge ref, which cannot
          # receive the append-only data checkpoints generated by this job.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PIT and time-series dependencies
        run: pip install -e ".[pit,timeseries]" pytest
      - name: Append ALFRED native PIT macro vintages
        run: python -m ai_fc timeseries-refresh
      - name: Append official reconstructed market archives
        run: python -m ai_fc timeseries-v2-refresh
      - name: Checkpoint raw receipts and append-only observations before models
        run: |
          python -m ai_fc inventory
          git add data/timeseries data/timeseries_v2 docs/generated/inventory.generated.md
          unexpected="$(git diff --cached --name-only | grep -Ev '^(data/timeseries/.*|data/timeseries_v2/.*|docs/generated/inventory.generated.md)$' || true)"
          test -z "$unexpected" || { echo "unexpected checkpoint paths: $unexpected"; exit 1; }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git reset
            echo "PR validation is read-only; collected data stays ephemeral"
          elif ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: append V2 PIT and market archive observations"
            git push
          fi
      - name: Prepare origin-specific DFM caches on Saturday
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(format('{0}', github.event.schedule), '35 1') }}
        shell: bash
        run: |
          weekday="$(date -u +%u)"
          if [ "$weekday" = "6" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m ai_fc timeseries-v2-prepare
          else
            echo "Daily run: DFM cache unchanged"
          fi
      - name: Run one-time sealed evaluation when explicitly requested or absent on monthly Saturday
        shell: bash
        run: |
          weekday="$(date -u +%u)"
          day="$(date -u +%d)"
          requested="${{ inputs.run_backtest || false }}"
          bootstrap="${{ github.event_name == 'pull_request' || github.event_name == 'push' }}"
          if [ ! -f data/timeseries_v2/ledgers/sealed_evaluations.jsonl ] && { [ "$requested" = "true" ] || [ "$bootstrap" = "true" ] || { [ "$weekday" = "6" ] && [ "$day" -le 7 ]; }; }; then
          python -m ai_fc timeseries-v2-backtest --path-count 20000
          else
            echo "Sealed evaluation not requested, or already disclosed"
          fi
      - name: Re-evaluate the frozen winner on the first Saturday
        shell: bash
        run: |
          weekday="$(date -u +%u)"
          day="$(date -u +%d)"
          if [ "$weekday" = "6" ] && [ "$day" -le 7 ] && [ -f data/timeseries_v2/ledgers/sealed_evaluations.jsonl ]; then
          python -m ai_fc timeseries-v2-monitor-backtest --path-count 20000
          else
            echo "Monthly fixed-winner monitoring is not due"
          fi
      - name: Refit selected VARX on Saturday
        shell: bash
        run: |
          weekday="$(date -u +%u)"
          if [ "$weekday" = "6" ] && [ -f data/timeseries_v2/runs/backtest_latest.json ]; then
            python -m ai_fc timeseries-v2-fit
          fi
      - name: Append latest forecast and matured resolutions
        shell: bash
        run: |
          if [ -f data/timeseries_v2/runs/backtest_latest.json ]; then
            python -m ai_fc timeseries-v2-forecast
            python -m ai_fc timeseries-v2-resolve
          else
            echo "V2 remains validation pending until the one-time evaluation exists"
          fi
      - name: Regenerate monthly Excel audit export
        shell: bash
        run: |
          weekday="$(date -u +%u)"
          day="$(date -u +%d)"
          if [ "$weekday" = "6" ] && [ "$day" -le 7 ]; then
            python -m ai_fc timeseries-v2-workbook
          fi
      - name: Verify V2 and run focused regression tests
        run: |
          python -m ai_fc timeseries-v2-verify
          pytest src/tests/test_multivariate_timeseries_v2.py src/tests/test_ralph_timeseries.py -q
      - name: Commit V2 model, forecast, resolution, and review artifacts
        shell: bash
        run: |
          python -m ai_fc inventory
          git add data/timeseries_v2 docs/generated/inventory.generated.md
          unexpected="$(git diff --cached --name-only | grep -Ev '^(data/timeseries_v2/.*|docs/generated/inventory.generated.md)$' || true)"
          test -z "$unexpected" || { echo "unexpected model paths: $unexpected"; exit 1; }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git reset
            echo "PR validation is read-only; model artifacts stay ephemeral"
          elif ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh NASDAQ time-series V2 shadow"
            git push
          fi
