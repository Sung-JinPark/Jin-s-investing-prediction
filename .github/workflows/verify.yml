# v3.5 WS-T2 — 공개 검증 CI. API 키 불필요 검사만 (LLM 호출 없음, 시크릿 0).
name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: ["investing-refresh", "scenario-refresh", "ai-regime-refresh", "statistics-refresh", "timeseries-refresh", "timeseries-v5-refresh", "timeseries-v2-refresh", "timeseries-v8-shadow", "timeseries-v13-vol-live"]
    types: [completed]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 검증기의 git 불변성·시점 검사는 전체 이력 필요
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps (시크릿 불필요 — 프로젝트 + PIT·시계열 검증 의존성)
        run: pip install -e ".[pit,timeseries,timeseries-v5]" pytest
      - name: unit tests (src)
        run: python -m pytest src/tests -q
      - name: immutability drift check
        run: cd src && python -m ai_fc sync --check
      - name: generated inventory drift check
        run: cd src && python -m ai_fc inventory --check
      - name: registered ledger integrity check
        run: cd src && python -m ai_fc audit-ledgers --check
      - name: official LLM provider approval guard
        run: cd src && python -m ai_fc provider-guard
      - name: secret pattern scan
        run: cd src && python -m ai_fc security-check
      # 배포 빌드를 PR 에서 실제로 돌린다. 2026-09-15 에 data.json 예산 초과(905,556 B >
      # 900,000 B)로 Pages 가 깨졌는데, 그때까지 이 빌드는 pages.yml(=push to main)에서만
      # 돌아서 **머지된 뒤에야** 실패했다. 브랜치 CI 는 초록이었다 — 그 사이 main 이 데이터
      # 커밋으로 자랐고, 자란 main 과 합쳐진 결과를 아무도 빌드해 보지 않았기 때문이다.
      # 같은 명령을 여기서 돌리면 같은 실패를 머지 전에 본다. 시크릿 0 · 산출물은 폐기.
      - name: Pages 정적 빌드 리허설 (배포와 같은 명령 · 산출물 폐기)
        run: |
          cd src
          python -m ai_fc sync --rebuild
          python -m ai_fc dashboard --pages-out "$RUNNER_TEMP/_site_rehearsal"
      - name: track record verifier
        run: python tools/verify_track_record.py
      # T06 — 계약 stopping_rules.never 감지기. 게이트 SQL 변경 · 원장 행 삭제 ·
      # 사후 failed 태그 변경 · forecasts/ 수정을 잡는다. 기준선을 못 읽으면 **보류가 아니라 실패**다.
      - name: gate guard (금지 행위 감지)
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            # checkout 이 이미 fetch-depth: 0 으로 전체 이력을 받아 둔다.
            # `--depth=0` 은 git 이 거부하는 인자다("depth 0 is not a positive number") —
            # 얕은 클론이 아니므로 깊이 지정 없이 베이스 브랜치만 가져오면 된다.
            git fetch --no-tags origin "${{ github.base_ref }}"
            BASE=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          echo "baseline=$BASE"
          python tools/gate_review.py --guard-only --baseline "$BASE"
