schema_version: 1
policy_id: authoritative-statistics-sources-v1
description: >-
  Numeric statistics may be derived only from registered authoritative sources.
  Research reports, media, vendor dashboards, user material, and public market-data
  aggregators are insight-only and cannot populate the normalized observation ledger.
default_numeric_input: deny
raw_before_normalized: required
unknown_source_action: reject
authoritative_classes:
  - official_government
  - official_central_bank
  - official_regulator
  - official_sro
  - official_exchange
insight_only_classes:
  - academic_research
  - investment_research
  - media
  - market_data_aggregator
  - user_supplied
sources:
  - source_id: alfred
    display_name: ALFRED real-time economic data
    authority_class: official_central_bank
    owner: Federal Reserve Bank of St. Louis
    allowed_domains: [alfred.stlouisfed.org, api.stlouisfed.org]
    numeric_input_allowed: true
    insight_only: false
    usage_roles: [raw_observation, vintage_observation]
  - source_id: fred_market_signals
    display_name: FRED market and economic series
    authority_class: official_central_bank
    owner: Federal Reserve Bank of St. Louis
    allowed_domains: [fred.stlouisfed.org, api.stlouisfed.org]
    numeric_input_allowed: true
    insight_only: false
    usage_roles: [raw_observation, current_vintage_observation]
  - source_id: federal_reserve_board
    display_name: Federal Reserve Board data downloads
    authority_class: official_central_bank
    owner: Board of Governors of the Federal Reserve System
    allowed_domains: [federalreserve.gov, www.federalreserve.gov]
    numeric_input_allowed: true
    insight_only: false
    usage_roles: [raw_observation, vintage_observation]
  - source_id: bls
    display_name: BLS Public Data API
    authority_class: official_government
    owner: U.S. Bureau of Labor Statistics
    allowed_domains: [bls.gov, www.bls.gov, api.bls.gov]
