schema_version: 1
as_of: 2026-08-04
policy:
  probability_linkage: forbidden
  confirmed_definition: institution_or_issuer_published_date
  estimated_definition: prior_release_month_pattern_only
  correction_method: append_new_row_with_supersedes
sources:
  - id: federal_reserve_fomc
    authority: Board of Governors of the Federal Reserve System
    kinds: [fomc]
    url: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    official: true
    access: free
    cadence: annual_schedule
    note: 2027 meeting dates remain tentative until the preceding meeting confirms them.
  - id: bls_cpi
    authority: U.S. Bureau of Labor Statistics
    kinds: [cpi]
    url: https://www.bls.gov/schedule/news_release/cpi.htm
    official: true
    access: free
    cadence: monthly_schedule
  - id: bls_employment
    authority: U.S. Bureau of Labor Statistics
    kinds: [nfp]
    url: https://www.bls.gov/schedule/news_release/empsit.htm
    official: true
    access: free
    cadence: monthly_schedule
  - id: bea_gdp
    authority: U.S. Bureau of Economic Analysis
    kinds: [gdp]
    url: https://www.bea.gov/news/schedule
    official: true
    access: free
    cadence: release_schedule
  - id: bea_pce
    authority: U.S. Bureau of Economic Analysis
    kinds: [pce]
    url: https://www.bea.gov/news/schedule/ics/online-calendar-subscription.ics
    official: true
    access: free
    cadence: release_schedule_subscription
    note: Personal Income and Outlays includes headline and core PCE price indexes.
  - id: conference_board_consumer_confidence
    authority: The Conference Board
    kinds: [consumer_confidence]
    url: https://www.conference-board.org/topics/consumer-confidence/
    official: true
    access: free
    cadence: last_tuesday_monthly
    note: The latest release states the exact next release; later months remain estimates.
  - id: ism_pmi
    authority: Institute for Supply Management
    kinds: [manufacturing_pmi, services_pmi]
    url: https://www.ismworld.org/supply-management-news-and-reports/reports/rob-report-calendar/
    official: true
    access: free
    cadence: first_and_third_business_day_monthly
    confirmed_through: 2026-12-31
    note: The 2026 table is published; later dates use ISM cadence and NYSE closures until published.
  - id: nvidia_ir
    authority: NVIDIA Investor Relations
    kinds: [earnings]
    url: https://investor.nvidia.com/events-and-presentations/events-and-presentations/
    official: true
    access: free
    cadence: issuer_notice
  - id: issuer_ir
    authority: Issuer investor-relations pages
    kinds: [earnings]
    url: https://www.sec.gov/edgar/search/
    official: true
    access: free
    cadence: issuer_notice
