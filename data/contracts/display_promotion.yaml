schema_version: 1
contract_id: display_promotion_v1
status: active

definition:
  display_promotion: customer_default_route_selection_only
  model_promotion: official_or_champion_model_replacement
  equivalence: prohibited

requirements:
  - append_only_method_disclosure
  - persistent_unambiguous_banner
  - operator_approval_receipt
  - render_proof_for_desktop_and_mobile
  - candidate_runtime_gate_display_eligible
  - semantic_reference_match

semantic_reference_policy:
  validation_key: [candidate_id, model_version, rules_version]
  artifact_hash_role: informational_only
  append_changing_hash_as_identity: prohibited

active_decision:
  decision_id: display-promotion:future-v52:2026-08-12:r1
  route: "#future"
  explicit_research_route: "#future/research"
  champion_route_when_active: "#future/champion"
  candidate:
    candidate_id: scenario_v5_2_scenario_clustered_db_v4
    model_version: complete_separation_empirical_episode_databases_v6
    rules_version: weights-v3+complete-separation-v1
  method_disclosure_event_id: method:scenario-v5-2-display-promotion-contract:2026-08-12:r8
  persistent_banner_text: 연구 후보 · degraded · 적격 사건 1/60 · 보정되지 않음
  operator_approval_receipt_id: display-approval:future-v52:2026-08-12:r1
  operator_approval_status: approved
  render_proof_path: reports/reviews/current/scenario_v5_2/display_promotion_260812/evidence/render_proof.json
  explicit_research_route_available_while_pending: true

withdrawal:
  candidate_runtime_blocked: champion_default
  operator_approval_missing_or_revoked: champion_default
  banner_or_render_proof_missing: champion_default
  semantic_reference_mismatch: champion_default
  silent_fallback: prohibited

receipt_registry:
  path: data/display_promotions/approval_receipts.jsonl
  append_only: true
  required_fields:
    - receipt_id
    - decision_id
    - approved_at
    - approver_role
    - approval_text
    - semantic_reference
