schema_version: 1
contract_id: display_promotion_v2
status: active

definition:
  display_promotion: customer_default_route_selection_only
  model_promotion: official_or_champion_model_replacement
  equivalence: prohibited

requirements:
  - append_only_method_disclosure
  - operator_approval_receipt
  - render_proof_for_desktop_and_mobile
  - three_scenario_chart_visible
  - internal_gate_copy_absent
  - candidate_runtime_gate_display_eligible
  - semantic_reference_match

semantic_reference_policy:
  validation_key: [candidate_id, model_version, rules_version]
  artifact_hash_role: informational_only
  append_changing_hash_as_identity: prohibited

active_decision:
  decision_id: display-promotion:future-v52:2026-08-18:r2
  route: "#future"
  customer_default: three_scenario_v5_2
  legacy_champion_audit_route: "#future/champion"
  candidate:
    candidate_id: scenario_v5_2_scenario_clustered_db_v4
    model_version: complete_separation_empirical_episode_databases_v6
    rules_version: weights-v3+complete-separation-v1
  method_disclosure_event_id: method:future-three-scenario-customer-default:2026-08-18:r13
  operator_approval_receipt_id: display-approval:future-v52:2026-08-18:r2
  operator_approval_status: approved
  render_proof_path: reports/reviews/current/scenario_v5_2/customer_default_260818/evidence/render_proof.json
  internal_gate_copy: prohibited
  legacy_automatic_fallback: prohibited

withdrawal:
  candidate_runtime_blocked: unavailable_retry_surface
  operator_approval_missing_or_revoked: unavailable_retry_surface
  render_proof_missing: unavailable_retry_surface
  semantic_reference_mismatch: unavailable_retry_surface
  silent_fallback: prohibited
  legacy_champion_automatic_fallback: prohibited

receipt_registry:
  path: data/display_promotions/approval_receipts.jsonl
  append_only: true
  required_fields:
    - receipt_id
    - decision_id
    - approved_at
    - approver_role
    - approval_text
    - semantic_reference
