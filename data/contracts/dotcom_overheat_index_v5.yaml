  - id: bond_spread
    chart: corporate_bond_pressure
    dotcom_series: 닷컴 스프레드
    current_series: 현재 스프레드
    direction: lower_is_hotter
    why: 스프레드 축소 = 위험선호
  - id: ipo_count_operating_12m
    chart: ipo_count_operating_12m
    dotcom_series: 닷컴
    current_series: 현재            # 확정(Ritter net) 계열 — '현재 잠정' 계열은 읽지 않는다
    direction: higher_is_hotter
    why: 상장 창구 열기 — 운영기업 IPO 12개월 합
    definition: >-
      Jay Ritter IPOALL net 건수(미국 운영기업 전 업종: SPAC·폐쇄형 펀드·REIT·유닛·ADR·공모가 $5 미만·
      은행/S&L·LP·CRSP 미등재 제외) + 테마 기업 상장의 회사 단위 목록
      (data/statistics/ipo/theme_listing_additions.csv, 행마다 출처)의 최근 12개월 합. 월 단건은 잡음이 커서
      12개월 합을 쓴다. 미국 쪽은 전 업종, 가산 쪽은 테마만이라 혼합 척도다.
    theme_rule: >-
      테마는 상장 시점 주력 사업(투자설명서·거래소 프로필)으로 가른다. 닷컴: internet(ISP·포털·검색·
      전자상거래·온라인 서비스·인터넷 소프트웨어/인프라·웹호스팅)·semiconductor. 현재: ai(기반모델·AI가
      제품인 소프트웨어·AI 칩·자율주행 스택·GPU 클라우드/AI 데이터센터·AI로 사업을 규정한 휴머노이드/AI 로봇)·
      semiconductor. semiconductor 는 두 시대 공통으로 설계·메모리·파운드리·패키징/테스트·장비·소재/웨이퍼/
      포토마스크/타깃·EDA/IP 이며 수동부품·PCB·디스플레이·일반 전자는 아니다.
    size_rule: >-
      v5(2026-10-23 사용자 결정): 규모 하한 없음 — 중소형 테마 IPO 를 두 시대 모두 센다. 닷컴 거품기에
      중소 IPO 가 쏟아진 것이 붕괴의 징후였던 것처럼 지금의 중소 AI·반도체 IPO 홍수도 같은 신호로 본다.
      v4 의 대형 임계(닷컴 $2.5억·현재 $5억)는 폐지. 공모액은 아는 만큼 기록하되 판정에 쓰지 않는다.
    venue_rule: >-
      미국 밖 모든 주시장·성장시장(STAR·ChiNext·북경·홍콩 Main/GEM·도쿄 전 시장·JASDAQ·KOSPI/KOSDAQ·
      TWSE/TPEx·SGX·Bursa·NSE/BSE 본시장·LSE/AIM·Neuer Markt·Nouveau Marché·Nuovo Mercato·EASDAQ·
      Euronext·북유럽·TSX/TSX-V·ASX·TASE 등). 초소형 발행인 전용 시장(인도 SME/Emerge·KONEX·興櫃·
      新三板·OTC BB)은 두 시대 비교가 안 되어 제외 — 로더가 board 이름으로 거부한다. 미국은 ADR/ADS
      IPO(공모가 $5 이상)만 더한다 — 미국 보통주 상장은 Ritter net 이 이미 센다.
    event_rule: >-
      회사의 첫 상장(공모 동반)만. 2차·이중 상장(A+H 등)·시장 이전·공모 없는 직상장·de-SPAC·SPAC·
      우회상장·분할상장 무공모·재상장 제외. 한 회사는 시대마다 한 번(창 안의 첫 상장) — 로더가 중복을
      거부한다. 창: 닷컴 1994-02~1999-12, 현재 2022-02~ (첫 12개월 합 점의 앞 11개월 포함).
    theme_adr_rule: >-
      us_adr 은 Ritter 확정월에만 더한다(Ritter net 은 ADR 을 빼므로 중복 없음). 확정월 이후 잠정
      (Nasdaq 근사) 구간에는 더하지 않는다 — 근사 필터가 ADR 을 이미 센다. 같은 규칙을 두 시대에 건다.
    foreign_listing_rule: >-
      foreign_primary 는 Ritter 도 Nasdaq 캘린더도 세지 않으므로 확정월·잠정월 모두 더한다. 잠정 달이
      없으면 그 달 가산은 건너뛰고 공시한다.
    pipeline_rule: >-
      상장 대기(발표·신청 단계)는 data/statistics/ipo/theme_listing_pipeline.csv 에 출처·날짜와 함께 두고
      화면에 표시만 한다 — 상장하지 않은 회사를 건수에 넣으면 일어나지 않은 사건을 기록하게 된다.
      DeepSeek 은 decision=committed(2026-10-23 사용자 확정): 상장하는 달에 규모와 무관하게 additions 로
      옮겨 센다. 미국 보통주 상장 예정(Anthropic·OpenAI)은 상장 시 Ritter net·Nasdaq 잠정이 센다.
      상장된 회사가 대기 목록에 남아 있으면 로더가 거부한다.
    spac_rule: >-
      SPAC 은 계속 뺀다. Ritter Table 15b 의 SPAC IPO 는 1995~1999 년 2·4·1·0·0 건(소형 장외
      블랭크체크 유닛)이라 닷컴 쪽 비교 계열이 없다. 현재(2023~2025 31·57·144 건)만 더하면 두 시대
      비교가 기울고, 건수만으로 AI 관련 SPAC 을 가를 수도 없다.
    sources:
      index_input: ritter_ipoall_monthly            # 확정치 + 테마 상장 가산(규모 무관)
      provisional_display_only: nasdaq_ipo_calendar # 점선, 지수 제외
      cross_check_only: SEC_IPO_QUARTERLY           # Ritter gross 대 SEC 전체 건수 연간 대조
    nasdaq_user_agent_authorization:
      authorized_by: repository_owner
      authorized_on: 2026-10-06
      scope: api.nasdaq.com/api/ipo/calendar only (browser-like User-Agent)

