    - {id: C1, rule: retro composite at 2000-03-31 using official-period data is between 80 and 120, blindness: seen_after_v6_0}
    - {id: C2, rule: as-displayed composite on 2000-03-10 is reported and drawn on the gauge, blindness: seen_after_v6_0}
    - {id: C3, rule: as-displayed composite 1996-12-31 < 1998-12-31 < 1999-12-31 < 2000-03-10, blindness: seen_after_v6_0}
    - {id: C4, rule: composite changed on at least 45 of the last 60 sessions at 0.1 resolution, blindness: seen_after_v6_0}
    - {id: C5, rule: v5 versus v6 on one ledger snapshot with contributions listed for the latest date, blindness: seen_after_v6_0}
  falsifiable:
