supersedes: dotcom_overheat_index_v5      # v1~v5 와 v6(사전등록본, 탈락)은 역사 기록으로 그대로 둔다
amends: dotcom_overheat_index_v6          # 사후 개정 — 아래 revision 블록
status: shadow_parallel_display           # v5 가 대표값. 게이트 통과 시 '새 산식(검증 중)' 병행 표시
rules_fixed_at: "2026-11-11T04:41:43Z"   # v6.1 의 규칙을 v6.1 재현 실행 전에 고정했다
gate_as_of: "2026-11-09"                  # v6.0 판정과 같은 기준일·같은 입력(아래 지문)에서 판정한다
gate_input_sha256: 8516c2415b86be0909f16da243fcb1438b0a382bb1a231a34052815b39bb378e
