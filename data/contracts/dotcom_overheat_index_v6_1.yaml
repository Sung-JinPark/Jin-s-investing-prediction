known_limits:
  - 선언한 5개 부문 가운데 참여·레버리지에는 편입 시험을 통과한 지표가 없다(미측정). 그 예산 20 은 나머지 4개 부문에 비례 배분됐다.
  - 밸류에이션·IPO·실물 부문은 지표가 하나씩이다. 단일 지표 최대 가중과 NASDAQ 가격 항 가중을 화면에 공시한다.
  - 탈락 후보(기업가치÷세후이익, IPO 첫날 수익률, 증거금÷GDP, 가계 주식 배분)는 참고로만 본다. 다시 심사하려면 새 개정이 필요하다.
  - 범위 변형 가운데 본 사양과 값이 같은 것(빈 부문·탈락 지표에 걸린 변형)은 범위를 넓히지 않는다 — 유효 변형 수를 함께 적는다.
  - 닷컴형 주식 과열만 잰다. 2007년 정점(신용 주도)에서 시제품은 11~14 였다 — 낮다고 안전하다는 뜻이 아니다.
  - 정점 뒤에는 값이 빨리 내려간다. 그래서 최근 12개월 최고값을 함께 보인다.
  - 100 은 사후 자료 기준 2000년 3월 상태다. 당시 화면에 보였을 값(발표 지연 적용)은 별도로 공시한다.
  - 과거 구간은 최신 개정 자료 + 고정 발표 지연으로 소급 재계산한 것이지 실시간 기록이 아니다(basis retro_backfill).
  - IPO 부문은 Ritter 갱신이 연 1회 안팎이라 가장 늦다. 비상장 조달(AI)은 잡지 못한다.
  - 참여·레버리지 점수는 분모 선택에 민감하다(GDP 대 주식가치) — 범위 변형에 포함.

errata:                                   # 판정 뒤(2026-11-11) 독립 리뷰가 찾은 이 파일의 과장·오기 — 규칙은 고치지 않고 여기 적는다
  - >-
    the_one_change 는 가중 규칙만을 말하지만, gates.on_failure 문장도 다시 썼다(v6.0: 실패 지표를 참고로 옮기고 1회 재실행 →
    v6.1: 가중 규칙 추가 개정 없음). v6.0 이 등록한 '1회 재실행'은 같은 계약 안의 재실행이었고, 새 계약으로 고쳐 다시
    돌린 이 개정은 그 조항이 허락한 것이 아니라 next_versions 의 '새 계약 개정 + 게이트 전체 재실행' 경로다.
  - >-
    clarifications 머리말의 '판정 불변'은 v6.0 판정에만 맞다. V4_per_variant 는 v6.1 에서 결과에 영향이 있다 — 20~70 조건을
    모든 변형에 적용하면 zero_1995_mean 변형의 2021 최고가 16.0 이라 V4 도 실패다. 보고서는 두 독해를 모두 적는다.
    (v6.1 은 V8·V12·C3 로 이미 탈락이라 판정은 같다.)
  - >-
    clarifications.anchor_drift 는 정의가 아니라 변경이다. scale 블록에 남은 주석('기준값을 1% 넘게 움직이면')은 기준값 대비 1%
    로 읽히고, 코드와 이 조항은 (peak − zero) 폭 대비 1% 다. 운영 중 보류 조건에만 영향이 있고 편입·게이트와 무관하다.
  - >-
    clarifications.empty_family 의 화면 문구('편입 지표 없음(미측정)')는 구현된 동작이 아니라 표시할 때의 규칙이다. 판정이
    탈락이라 화면에 싣는 코드가 없다.
  - >-
    peak_knowledge_hyperparameters 는 '전부'가 아니다. 목록 밖에도 정점 지식이 들어간 선택이 있다 — 범위 변형의 자료 기반
    예산(weights_data_rule_a/b, 시제품의 정점 판별력에서 나옴), 소급 확인일 2000-03-31, C3 의 날짜 경로, peak_window_max 의
    구간 1995-01..1999-12, 그리고 시제품 값을 본 뒤 고른 후보 집합과 부문 예산(phase1_blindness: seen).
  - >-
    절차: v6.0 의 결과는 이 계약을 쓰기 전에 탐색 실행(메모리 안, 코드 감사 반영 전)에서 이미 봤다. 커밋된 v6.0 판정은 감사
    반영 뒤의 재실행이고 수치는 같다(편입·실패 게이트 동일, 일간 0 기준 표본 정정으로 val_nasdaq_m2 기준값이 폭의 0.3% 이동).
    v6.1 의 계산 경로(상한 없는 가중)는 이 계약 커밋 전에 모듈에 있었다. 'v6.1 을 실행 전에 고정했다'는 것은 커밋 순서와
    작업 기록에 근거한 진술이지 시각 기록만으로 증명되지 않는다. 저자는 심사단이 고르기 전에 P 안이 범위 폭 게이트를 넘지
    못할 것 같다고 암산으로 예상했고, 심사단에는 알리지 않았다.
  - >-
    frozen.construction_values.C5 의 v5 값이 null 인 것은 판정 당시 도구가 v5 결과의 키를 잘못 읽었기 때문이다(v5 = 54).
    두 계약 모두 같다. 보고서(docs/audit)는 고친 도구로 다시 만들었고 게이트 수치는 동일하다.

