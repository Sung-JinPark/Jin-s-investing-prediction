    - {id: V2, rule: "composite <= 25 at 2002-10-09, 2009-03-09 and 2022-12-28", blindness: seen_after_v6_0}
    - {id: V3, rule: composite at 2007-10-31 <= 30, blindness: seen_after_v6_0}
    - {id: V4, rule: maximum composite over 2021-01..2021-12 is between 20 and 70 and below the 2000-03-10 value in every variant, blindness: seen_after_v6_0}
    - {id: V5, rule: median month-end composite over 2003-01..2006-12 and over 2012-01..2016-12 <= 15, blindness: seen_after_v6_0}
    - {id: V6, rule: maximum month-end composite over 2010-01..2011-12 <= 40, blindness: seen_after_v6_0}
    - {id: V7, rule: every estimated indicator kept in the scored set passes A6, blindness: seen_after_v6_0}
    - {id: V8, rule: largest one-session composite change on an official-release day since 2023-01 <= 5, blindness: seen_after_v6_0}
    - {id: V9, rule: weight carrying no NASDAQ price term >= 30, blindness: seen_after_v6_0}
    - {id: V10, rule: a +10% and a -10% NASDAQ move change today's composite by <= 10 points, blindness: seen_after_v6_0}
    - {id: V11, rule: weight sitting on a clamp today <= 25, blindness: seen_after_v6_0}
    - {id: V12, rule: band width today <= 35 and every variant >= 75 at 2000-03-31 (retro), blindness: seen_after_v6_0}
  reported_not_gated: [daily R-squared of composite change on NASDAQ return, monthly R-squared, per-indicator A-test table]
  forward_only:                           # 결과를 아직 모른다 — 감시가 보고
