analysis_inputs:
  file: data/statistics/overheat/influence_inputs_v7.json   # 공식 FRED API 1회 수집본(1960~), sha256 은 파일 안
  plus: data/statistics/ipo/ritter_ipoall_monthly.json (+ 같은 raw 의 첫날 수익률 열)
  vintage: 수집 시점의 최신 개정본. 과거 시점은 아래 발표 지연을 적용해 재현한다(당시 발표본이 아니다)
  source_of_truth: 방향·점수·가중·기준값은 전부 이 고정 파일에서 계산한다. 매일의 지수는 원장에서 계산하고, 원장으로 다시 계산한 기준값이 어긋나면 보류한다
sessions: NASDAQCOM 값이 있는 날짜. 월말 세션 = 각 달력월의 마지막 세션
availability: >-
  기간 p 의 관측은 anchor(p) + lag(달력일) 이상인 첫 세션부터 보인다. anchor = 월 자료는 그 달 말일, 분기 자료는 분기 말일,
  주간·일간은 관측일. 식에 계열이 둘 이상이면 계열마다 그날 보이는 최신 값을 쓴다. 'k 기간 전' 은 그 계열에서 보이는 최신 기간의 k 기간 전 값.
series_lag_days: {NASDAQCOM: 0, T10Y3M: 1, T10Y2Y: 1, DCOILWTICO: 7, NFCI: 7, FEDFUNDS: 5, GS10: 5, UNRATE: 10, CPIAUCSL: 20,
  HQMCB10YR: 30, M2SL: 30, TOTALSL: 45, SPASTT01USM661N: 60, GDP: 35, Y034RC1Q027SBEA: 35, Y001RC1Q027SBEA: 35,
  W328RC1Q027SBEA: 90, NCBEILQ027S: 85, BOGZ1LM153064475Q: 85, BOGZ1LM893064105Q: 85, DABSHNO: 85, FL663067003: 85,
  FL103163005: 85, FA103163005: 85, BOGZ1FL010000346Q: 95, DRTSCILM: 45, GFDEBTN: 60, RITTER: 45}
lag_note: 발표 달력과 한 줄씩 대조하지는 못했다 [미검증]. 실제 발표보다 이르지 않도록 넉넉한 쪽으로 잡았다
staleness_limits_days: {daily: 10, weekly: 30, monthly: 120, quarterly: 230, ritter: 520}
outcome:
  DD: "DD_H(t) = max(0, 1 − min(N_u, u = t+1 .. t+H) / N_t). 세션 t+H 가 없으면 결측"
  horizons: {DD12: 252, DD24: 504}
sample:
  near_high: "월말 세션 t 가운데 N_t >= 0.90 * max(N over the trailing 252 sessions incl. t)"   # 과열 판단이 필요한 때 = 고점 부근
  why: 이미 폭락 중인 달을 넣으면 '스프레드 확대·금리 인하·200일선 아래 = 뜨겁다' 가 된다. 묻는 것은 고점 부근에서 이후 하락을 가르느냐다
windows:
  purge: 월말 t 는 t 와 t+H 세션이 모두 같은 구간 안에 있을 때만 그 구간의 표본이다(H 는 그 통계가 쓰는 결과 창)
  train: 1973-01 .. 2017-12, excluding 1997-01 .. 2002-12
  why_exclude_dotcom: 후보 목록과 척도(정점 = 100)가 닷컴을 보고 만든 것이다. 그 구간으로 점수까지 매기면 자기충족이 된다
  embargo: 2018-01 .. 2019-12              # 점수에 쓰지 않는다
  holdout: 2020-01 .. gate_as_of minus 12 months
  blocks: [1973-01..1982-09, 1982-10..2007-12 (excluding 1997-01..2002-12), 2008-01..2017-12]   # 통화정책 체제 경계
  standardisation: 1995-01 .. 2019-12 월말 세션(생산 원장으로 재현 가능한 구간)

