change_log:
  - date: 2026-11-12
    decided_by: user
    decision_record: docs/DECISIONS.md (2026-11-12 닷컴 대비 과열도 v7 — 영향도 점수제)
    owner_instruction: >-
      "54% 가 현실적으로 변할 수 있는 값을 줘라. 각 지표에 점수제를 하고 가중치를 다시 검증하라 — 단순 회사채보다 금리 인상
      지표가 증시에 더 강하게 작용할 수도 있다. 전수분석하고, 순위를 점수제로 매긴 다음 그 기준으로 가중치 영향도를 평가해 적용하라."
    what_changes_from_v6: >-
      v6 는 가중치를 선언했고 지표마다 '2000년 3월 = 100' 으로 쟀다. v7 은 (1) 후보마다 과거 자료에서 증시 하락과의 관계를 재어
      점수를 매기고 (2) 점수 비례로 가중하며 (3) '닷컴 정점 = 100' 은 합산값에 건다. (4) 금리 긴축은 열기가 아니라 압력이라
      약세장 바닥에서도 높게 남는다 — 그래서 '과열도'(열기)와 '긴축 압력'을 두 줄로 나눠 잰다.
    relation_to_v6_1_stop_rule: >-
      v6.1 의 정지 규칙은 '선언 가중 + 지표별 닷컴 척도' 설계에 대한 것이다. v7 은 소유자가 지시한 다른 설계다.
      같은 자료에 대한 세 번째 시도이므로 v7 이 실패하면 같은 자료로 점수 규칙을 다시 쓰지 않는다(on_failure).
    numeric_fit_exception: >-
      CLAUDE.md 원칙 5 의 명문화된 예외(결정론 수치 계산의 과거 자료 적합)다. LLM 은 계산에 개입하지 않는다. 회귀·최적화·학습은 없다.
      산출물은 참고 지표이며 캘리브레이션 표본이 아니다. 방향은 선언했고 가중은 표본 내 점수다 — 진짜 검증은 전진 구간이다.
    blind_review: >-
      초안을 어떤 수치도 계산하기 전에 독립 검토 4건(계량·금융·무결성·구현, 계약만 읽음)에 넘겼고 4건 모두 '고친 뒤 실행'이었다.
      받아들인 것 — 선언 방향, 고점 부근 표본, 블록 안 순위상관, 12·24개월 결과 병행, 결과 창 완충(purge), 위약 검정, 음성 대조군,
      걷기 전진(walk-forward)과 기준선, 하락장 규칙 수정, 발표 지연 기준일, 가중 상한의 순서, 열기·압력 분리.
      받아들이지 않은 것은 not_adopted 에 이유와 함께 적는다.

seen:                                     # 규칙을 쓰는 시점에 저자가 이미 본 것
  - v6 후보 9개의 오늘 점수와 1995~2026 이력(통화량 대비 NASDAQ ≈ 정점 수준, 장비 투자 ≈ 정점 이상, 2년 상승률 낮음, IPO 평상 이하)
  - v5 14개 지표의 오늘 값과 닷컴 구간 값, 오늘의 부문별 닮음이 크게 갈린다는 사실
  - 2022년 긴축과 그해 하락장을 안다(금리 후보는 그것을 아는 상태에서 넣었다 — holdout 은 후보 선택에 대해 맹검이 아니다)
  - 아래 규칙으로 계산한 어떤 점수·순위·가중치·합산값도 본 적이 없다. 금리 계열의 영향도 통계도 계산한 적이 없다

