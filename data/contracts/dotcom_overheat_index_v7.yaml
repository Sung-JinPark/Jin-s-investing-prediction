# ── 점수제 ──────────────────────────────────────────────────────────────
# 지표 i 의 원값 x_i(t) 와 결과 DD(t) 의 관계를 train 의 고점 부근 월말 표본에서 잰다. 선언 방향 d_i 를 곱한 hot_i = d_i * x_i.
scoring:
  scoreable: train 고점 부근 표본 120개월 이상(DD12 기준)
  rho: "pooled-within-block Spearman — 블록 안에서만 순위를 매겨(동순위는 평균 순위) 블록별 Spearman(hot_i, DD) 을 구하고 블록 표본 수로 가중 평균(표본 12개 미만 블록은 뺀다)"
  P1_rank_association:
    max: 35
    points: "35 * clip((rbar_i − 0.05) / 0.30, 0, 1),  rbar_i = (rho12_i + rho24_i) / 2 if both > 0 else 0"
  P2_tail_frequency:
    max: 25
    points: "25 * clip((delta_i − 0.05) / 0.25, 0, 1),  delta_i = P(DD12 >= 0.20 | hot_i 가 자기 블록 상위 20%) − P(DD12 >= 0.20 | 나머지)"
  P3_bear_episodes:
    max: 20
    episode_rule: >-
      NASDAQ 종가 전체에 상태기계를 한 번 돌린다. 상승 상태(시작): 기준 고점 M = 그때까지의 최고 종가(고점일 P). 종가 <= 0.75 * M 인
      첫 세션에 하락장 1건(P 기록) → 하락 상태(저점 L = 그 종가). 하락 상태: 종가 < L 이면 L 갱신, 종가 >= 1.30 * L 인 첫 세션에
      상승 상태로 돌아가 M = 그 종가, P = 그 세션. 센다 = P 가 train 월 범위 안인 건. 건 목록은 frozen 에 적는다.
    hit: "P 이하 마지막 월말의 hot_i 가, 그 월말 이전 240개월(최소 120개월)의 자기 월말 값 분포에서 70 백분위 이상"
    points: "20 * clip((hits / episodes_with_data − 0.30) / 0.70, 0, 1)"
    not_scored: price_term 지표(고점에서 높은 것이 정의상 당연하다)와 episodes_with_data < 4 인 지표는 0점이 아니라 '미채점'
  P4_block_stability:
    max: 20
    witness: 블록 안 고점 부근 표본 48개월 이상이고 |rho12_block| >= 0.10 인 블록
    points: 증언 블록이 2개 이상이고 전부 양(선언 방향)이면 20, 증언 블록 3개 중 하나만 음이면 8, 그 밖은 0
  total: "E_i = 100 * (채점된 항목 점수 합) / (채점된 항목 만점 합)"       # 발표 주기는 점수가 아니다(동점일 때만 빠른 쪽이 앞)
  placebo: >-
    자리 밀기 위약. train 고점 부근 표본을 시간순으로 이어 붙인 뒤 hot_i 를 결과에 대해 k = 24, 36, 48, … (12 간격, n−24 이하)개월 순환
    이동하고 같은 공식으로 E_core = 100 * (P1 + P2 + P4) / 80 을 잰다. 난수 없음. 지표의 실제 E_core 가 자기 위약 값들의 90 백분위를 넘어야 한다.
  redundancy: >-
    E_i 내림차순(동점은 발표 주기 빠른 쪽, 그다음 후보 목록 순서)으로 훑으며, 같은 group 에서 이미 통과한 지표와
    train 고점 부근 표본의 |Spearman(hot_i, hot_k)| 가 0.80 이상이면 '중복'(가중 0, 어느 지표와 겹쳤는지 표시).
  eligible: >-
    scoreable AND rbar_i > 0 (측정 부호 = 선언 부호) AND 실제 E_core > 위약 90 백분위 AND E_i >= 35 AND 중복 아님
    AND 생산 가능(standardisation 월말의 80% 이상과 2000-03-10 에 값이 있고 MAD > 0). 그 밖은 '참고'(가중 0, 사유 표시).
  chance_disclosure: 위약 문턱이 90 백분위이므로 영향이 전혀 없는 후보도 10개 중 1개꼴로 이 관문을 넘는다. 순위표 머리에 적는다
  minimum_eligible: {heat: 4, pressure: 3}   # 미달이면 그 줄을 만들지 않는다(상한 때문에 heat 는 3개 부문, pressure 는 2개 부문 이상이어야 한다)

weights:                                  # group 마다 따로. 합 = 100
  fill: "w_i = total * E_i / sum(E). cap 을 넘는 지표를 cap 에 고정하고 남은 total 을 나머지에 E 비례로 다시 나눈다(반복). count * cap < total 이면 불능"
  step_A: fill(적격 전체, 100, 지표 상한)
  step_B: 어느 부문의 합이 부문 상한을 넘으면 그 부문 지표를 같은 비율로 줄여 부문 상한에 맞추고 고정한 뒤, 남은 몫을 다른 부문 적격 지표에 fill 로 나눈다(부문 합이 큰 순서로 반복)
  step_C: (heat 만) price_term 합이 50 을 넘으면 price_term 지표를 같은 비율로 줄여 50 에 맞추고, 나머지 지표에 fill 로 50 을 나눈다
  infeasible: 어느 단계든 불능이면 그 줄을 만들지 않는다
  caps:
    heat: {indicator: 25, family: 40, price_term_total: 50}
    pressure: {indicator: 40, family: 60}     # 후보 부문이 rates·curve·inflation 셋뿐이다
  nothing_else_is_estimated: true

# ── 합산과 척도 ─────────────────────────────────────────────────────────
reading: "z_i(t) = d_i * (x_i(t) − median_i) / (1.4826 * MAD_i), median·MAD = standardisation 월말 세션에 보이는 x_i 의 중앙값·중앙절대편차. 합산에만 [−10, 10] 으로 자른다(이상값 방어)"
composite: "C(t) = sum(w_i * z_i(t)) / sum(w_i present). 한도보다 오래된 지표는 빼고 재정규화, 살아 있는 가중이 70 미만이면 보류"
heat_headline: "H(t) = 100 * (C_heat(t) − C0) / (Cpk − C0),  C0 = median of month-end C_heat over standardisation window,  Cpk = C_heat on 2000-03-10 (as displayed)"
heat_label: 닷컴 정점 = 100                 # 정수, % 기호 없음. 0 미만은 '평상 이하'
pressure_companion: "Q(t) = C_pressure(t) 의 standardisation 월말 분포 안 백분위(0~100). 닷컴 척도를 쓰지 않고 H 와 더하지 않는다"
pressure_label: 긴축 압력(1995~2019 대비 백분위)
frozen_numbers: 방향·점수·가중·median·MAD·C0·Cpk·백분위 눈금을 frozen 에 숫자로 적는다. 생산 계산은 그 숫자만 쓴다
drift_hold: 원장으로 다시 계산한 C0·Cpk 가 frozen 값에서 (Cpk − C0) 의 1% 넘게 어긋나면 H 를 내지 않고 보류한다

# ── 게이트 ──────────────────────────────────────────────────────────────
construction_checks:                      # 정의상 성립 — 구현 확인용이며 검증이라 부르지 않는다
  - {id: C1, rule: "H = 100 at 2000-03-10 and median month-end H over the standardisation window = 0"}
  - {id: C2, rule: "H changed on at least 45 of the last 60 sessions at 0.1 resolution"}
  - {id: C3, rule: "weights satisfy every cap"}
gates:                                    # heat 줄(대표값)의 게이트. 임계값은 여기서 고정한다
  - {id: G1, rule: "(Cpk − C0) >= 2.0 * 1.4826 * MAD of month-end C_heat over the standardisation window", why: 합산값의 닷컴 정점이 평상에서 충분히 멀다}
  - {id: G2, rule: "H <= 25 at 2002-10-09, 2009-03-09 and 2022-12-28", why: 약세장 바닥에서 뜨겁지 않다(v6 임계 그대로)}
  - {id: G3, rule: "max month-end H over 2003-01 .. gate_as_of minus 12 months among months with DD12 < 0.10 is <= 60", why: 거짓 과열 — 뜨거웠는데 하락이 뒤따르지 않은 달}
  - {id: G4, rule: "median month-end H over 2012-01 .. 2016-12 <= 15", why: 평온기(v6 임계 그대로)}
  - {id: G5, rule: "pooled-within-block Spearman(C_heat, DD12) on the train near-high sample exceeds the 95th percentile of its placebo distribution — DD12 를 표본 순서에서 k = 24, 36, … 개월 순환 이동한 자료마다 점수를 처음부터 다시 매기고, 실제 줄과 같은 개수의 점수 상위 후보(생산 가능한 것)를 점수 비례로 묶은 합산값의 상관", why: 같은 표본에서 고른 가중이라 표본 내 상관은 자동으로 나온다 — 우연 수준을 넘는지 본다}
  - {id: G6, rule: "neither negative control is eligible", why: 추세나 지속성만으로 점수를 받는 규칙이 아니다}
  - {id: G7, rule: "walk-forward — 접힘마다 fit 구간만으로 점수·적격·가중을 다시 구해 test 구간 고점 부근의 Spearman(C_heat, DD12) 를 잰다. 계산 가능한 접힘이 3개 이상이고 표본 수 가중 평균이 0.10 이상이며 nasdaq_only 기준선(speed_d200 하나)보다 0.05 넘게 낮지 않다", folds: ["fit 1973-01..1988-12 → test 1990-01..1996-12", "fit 1973-01..1996-12 → test 2003-01..2009-12", "fit 1973-01..2009-12 (excl. 1997-01..2002-12) → test 2010-01..2017-12", "fit train → test holdout"], note: 표준화 구간(1995~2019)은 접힘마다 다시 잡지 않는다 — 척도에만 쓰이는 약한 누수로 공시}
  - {id: G8, rule: "largest one-session change of H on a day when any monthly/quarterly/ritter input period changes, since 2023-01, <= 5"}
  - {id: G9, rule: "a +10% and a −10% NASDAQ close move change today's H by <= 10, with and without the clamp"}
  - {id: G10, rule: "weight sitting on the clamp today <= 25"}
  - {id: G11, rule: "squared correlation of monthly H changes with same-month NASDAQ log returns over 2010-01 .. gate_as_of <= 0.70, and max − min of month-end H over the last 36 months >= 10", why: NASDAQ 의 재표기가 아니고 실제로 움직인다}
  - {id: G12, rule: "measurement band width today <= 35", why: 점수 규칙의 합리적 대안들 사이에서 값이 크게 갈리지 않는다}
pressure_gates:                           # 긴축 압력 줄을 실으려면
  - {id: Q1, rule: "eligible pressure indicators >= 3 and weights feasible"}
  - {id: Q2, rule: "same placebo test as G5 on C_pressure at the 90th percentile"}
measurement_band:                         # G12 — 변형마다 점수·적격·가중·C0·Cpk 를 처음부터 다시 계산한 H 의 최소~최대
  variants:
    - {id: dd12_only, change: P1 uses rho12 only}
    - {id: dd24_only, change: P1 uses rho24 only}
    - {id: all_months, change: score on all train month-ends (no near-high filter)}
    - {id: train_from_1985, change: train starts 1985-01}
    - {id: include_dotcom, change: train includes 1997-01..2002-12}
    - {id: equal_weights, change: equal weight across eligible indicators (caps still apply)}
    - {id: no_placebo_gate, change: eligibility without the placebo condition}
    - {id: threshold_25, change: E_i >= 25}
    - {id: threshold_45, change: E_i >= 45}
    - {id: no_redundancy, change: skip the redundancy rule}
    - {id: cap_20, change: cap per indicator 20}
    - {id: drop_top, change: leave out the top-weighted indicator of the base specification and rescore}
    - {id: no_clamp, change: readings unclamped}
  uncomputable: 적격 미달·가중 불능인 변형은 값을 만들지 않고 이름을 적는다. 2개 이상이면 G12 실패
family_band:                              # 게이트가 아니다 — 화면에 항상 함께 싣는다
  rule: 적격 지표가 있는 부문마다 그 부문을 뺀 H(가중·C0·Cpk 재계산)의 최소~최대
  disclosure: >-
    v6 는 이 범위의 폭(35 이하)을 게이트로 썼고 두 번 실패했다. 오늘의 닮음이 부문마다 갈려 있어 생기는 폭이라 지표를 바꿔도 좁아지지 않는다.
    소유자가 '움직이는 대표값'을 지시했으므로 v7 은 이 폭을 숨기지 않고 대표값 옆에 싣되 게이트로 쓰지 않는다. 검토자 한 명은 이 변경에 반대했다(not_adopted).
reported_not_gated:
  - 전 후보 순위표(P1~P4, rho12·rho24, 블록별 rho, 위약 90 백분위, 하락장 적중, 사유) — 게이트 결과와 무관하게 공개한다
  - 부문별 영향도(부문 최고점·적격 평균·가중) — '금리 인상 대 회사채' 의 직접 답
  - 순위 차이의 구분 가능성 — 두 지표의 E 차이가 두 위약 분포 폭(90 백분위 − 중앙값)의 평균보다 작으면 '구분 불가' 로 적는다
  - 표본 내 Spearman(C, DD12), holdout Spearman, 동일 가중 합산값과의 비교, H at 2007-10-31 · 2020-02-19 · 2021-11-19
on_failure: v5 가 대표값으로 남는다(지표별 닮음 프로필도 그대로). 순위표는 공개한다. 같은 자료로 점수 규칙을 다시 쓰지 않는다
on_pass: >-
  소유자 지시(2026-11-12 "적용")에 따라 H 를 과열도 카드와 홈 카드의 대표값으로 싣고 v5 는 '이전 산식' 한 줄로 남긴다.
  라벨 '가중은 과거 자료 기준 · 전진 검증 중' 과 부문 제외 범위를 항상 함께 싣는다. 검토자 한 명은 병행 표시에 그치라고 했다(not_adopted).
forward_only: [다음 25% 이상 NASDAQ 하락 앞에서의 H, 매년 다시 재는 holdout 상관, Z.1·GDP 발표일의 계단]

pre_run_amendments:                       # 규칙 고정 뒤·실제 자료 실행 전에, 독립 코드 감사(수치 열람 금지)가 찾은 모순·빈칸을 메운 것
  why_allowed: 감사자는 실제 자료로 채점하지 않았고 보고에 실제 수치가 없다. 저자도 이 시점까지 실제 점수를 하나도 보지 않았다
  changes:
    - 가중 상한을 줄마다 둔다(weights.caps). 고정본의 상한 25/40 은 긴축 압력 줄(부문 3개)에서 거의 언제나 불능이었다 — 계약 내부 모순
    - minimum_eligible.pressure 2 → 3, Q1 도 같이(상한 40 아래에서 2개로는 100 을 채울 수 없다)
    - G5·Q2 의 위약 — 자격 문턱을 그대로 쓰면 위약 대부분에서 줄이 생기지 않아 게이트가 '상관 > 0' 으로 퇴화한다. 위약에서는 실제 줄과 같은 개수의 점수 상위 후보로 줄을 만든다(선택 효과를 같은 조건으로 맞춘다). 하락장 적중(P3)은 날짜를 밀 수 없어 위약에서 채점하지 않는다
clarifications:                           # 고정본이 비워 둔 읽기 — 실행 전에 정한다
  lookback: "'k 기간 전' 은 달력 기간이다. 그 달·분기의 관측이 없으면(예: 발표되지 않은 2025-10 CPI) 값을 만들지 않는다(행 위치로 대신하지 않는다)"
  staleness: 나이는 관측이 보이기 시작한 날(anchor + lag)부터 센다
  production_uses_lags: 매일의 값도 게이트·이력과 같은 발표 지연 기준으로 계산한다(원장에 먼저 들어와 있어도 지연이 지나야 쓴다)
  purge_segments: purge 의 '구간' 은 train 의 이어진 조각(1973-01..1996-12, 2003-01..2017-12)과 holdout 이다. 블록은 t 의 날짜로만 나눈다
  negative_controls: 대조군도 P3 를 포함해 같은 규칙으로 채점한다
  thresholds: 문턱 비교는 반올림 전 값으로 한다. 백분위는 선형 보간(type 7)
  small_blocks: 표본 12개 미만 블록은 순위상관에서, 5개 미만 블록은 상위 20% 판정에서 뺀다
  redundancy_overlap: 두 지표의 공통 표본이 60개월 미만이면 중복으로 보지 않는다. 생산 불가 지표는 다른 지표를 중복으로 만들지 않는다
  oil: DCOILWTICO(252 sessions earlier) 는 252 세션 전 그날 보이던 유가다
  bond_change: corp_bonds_gdp(12 quarters earlier) 는 두 계열 각각의 12분기 전 값으로 만든 비율이다
  loan_standards: DRTSCILM 도 분기 말 + 45일 뒤에 보이는 것으로 둔다(실제 발표보다 늦다 — 이른 쪽으로는 새지 않는다)
  one_official_run: 측정 도구는 frozen 이 비어 있으면 --write-frozen 과 함께만 돈다(판정을 먼저 적고 보고서를 쓴다). frozen 이 있으면 재현·대조만 한다

not_adopted:                              # 독립 검토의 제안 가운데 받아들이지 않은 것 — 이유를 남긴다
  - 병행 표시만 하고 대표값은 v5 로 둘 것 — 소유자가 대표값 교체를 지시했다. 대신 라벨과 범위를 항상 싣고, 실패하면 v5 로 남는다
  - 부문 제외 범위를 게이트로 유지할 것 — family_band.disclosure 참조
  - 겹치지 않는 연간 표본 12벌 — 블록 안 순위와 고점 부근 표본을 함께 쓰면 벌마다 표본이 너무 작다. 표본 의존성은 자리 밀기 위약으로 다룬다
  - 접힘마다 표준화 구간 재계산 — 생산 원장이 1995년부터라 재현할 수 없다. 약한 누수로 공시
  - 발표 달력 대조표 — 하지 못했다. 지연을 넉넉하게 잡고 [미검증] 으로 적는다

peak_knowledge_hyperparameters:
  - 정점일 2000-03-10 · 제외 구간 1997~2002 · 표준화 구간 1995~2019 · 약세장 저점일 3개
  - clamp [−10, 10] · 고점 부근 0.90 · 하락장 25% · 회복 30% · 상위 20% · 70 백분위 · P 임계(0.05/0.30, 0.05/0.25, 0.30)
  - 적격 35 · 위약 90/95 백분위 · 중복 0.80 · 상한 25/40/50 · 최소 적격 4/2 · 게이트 임계 전부
known_limits:
  - 가계 원리금 상환 부담(BOGZ1FL010000346Q)은 계약 지연 95일보다 실제로 더 늦게 나온다(2026-11-12 수집본에 2026Q2 가 없다 — 135일 이상).
    Ritter IPO 는 연 1회 안팎 갱신되는데 재현은 월말 + 45일로 다룬다. 두 지표의 과거 재현은 실제 화면보다 앞서 본다 — 측정된 사실이다.
  - 유가(DCOILWTICO)는 고정 입력 파일에 원장보다 620일치 관측일이 적다(같은 날의 값은 같다). 유가 지표의 일부 날짜가 두 자료에서 다르게 읽힌다.
  - 가중은 1973~2017 자료(닷컴 구간 제외)에 맞춘 표본 내 점수다. 그 구간의 큰 하락장은 손에 꼽는다 — 순위 차이의 상당수는 오차 범위 안이다.
  - 후보 35개를 한꺼번에 잰다. 위약 문턱을 넘은 지표 가운데 일부는 우연이다(10개 중 1개꼴).
  - 과거 구간은 최신 개정 자료에 고정 발표 지연을 적용한 재현이지 당시 발표본이 아니다. 발표 지연은 달력과 대조하지 못했다.
  - 100 은 2000-03-10 화면에 보였을 합산값이다. 사례 하나의 기준이지 '100 이면 붕괴'가 아니다.
  - 선형 합산은 '과열 × 긴축' 같은 상호작용을 표현하지 못한다. 그래서 두 줄을 따로 보인다.
  - 긴축 지표는 약세장 바닥에서도 높게 남는다(2022-12). 압력이 높다는 것과 과열이라는 것은 다르다.
  - 확률이 아니다. 하락에 앞서 높았다는 것과 하락을 예측한다는 것은 다르다.

