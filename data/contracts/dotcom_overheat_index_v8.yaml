owner_instruction: >-
  "중복되는 지표들은 영향도를 낮게 평균값 메겨서 점수 차등주고, 닷컴때 중소 ipo많아질때 무너졌으니 뭐 예를들면 그부분이
  영향도 높은거랑 뭐 이런식으로 점수 차등 준다음에 지표별 가중치를 메긴다음에 최종 평균치로 점수 메기면 되는거 아니야?"
rules_fixed_at: 2026-11-12T03:09:36Z      # 이 시각 이전에는 가중 평균을 한 번도 계산하지 않았다

disclosures:
  - >-
    가중치는 판단값이다. 과거 자료로 검증한 값이 아니다. v6.0·v6.1·v7 은 스스로 건 검증 기준을 넘지 못했고 그 기록은
    그대로 남는다. v8 은 그 기준을 통과했다고 주장하지 않는다 — 기준을 요구하지 않는 다른 종류의 값이다.
  - >-
    규칙을 고정한 시점에 작성자는 오늘의 지표별 값(카드에 실린 14개 값과 프로필 값)을 이미 본 상태였다. 그래서 판단이
    들어가는 항목 A 는 오늘 값을 보지 않은 5인 패널의 중앙값으로 정하고, B·C 는 이미 기록된 숫자에서 기계적으로 읽는다.
    묶음(중복) 규칙과 A 의 소유자 지정(IPO)은 작성자·소유자의 판단이다. 패널은 사람이 아니라 같은 언어모델의 에이전트
    5개다 — 닷컴이 어떻게 끝났는지 아는 모델의 사후 판단이며, 그것이 이 항목의 뜻이다(예측력 검증이 아니다).
  - >-
    v7 계약의 '같은 자료로 같은 채점표를 다시 지정하지 않는다'는 측정 채점표에 대한 약속이다. v8 은 측정이 아니라 선언이다.
    v7 이 잰 점수를 근거 한 항목(B)으로 읽을 뿐 다시 채점하지 않는다.
  - >-
    두 척도가 섞여 있다. 카드 14개 지표는 v5 의 값(1995~1999 범위에서의 위치, 100 = 그 범위의 정점 쪽 끝)이고 상승 속도
    2종은 프로필의 값(0 = 제자리, 100 = 2000-03-10)이다. 둘 다 '100 = 닷컴 정점'으로 읽지만 0 의 뜻은 다르다.

readings:
  card_indicators: dotcom_overheat_index_v5 의 지표별 pct 를 그대로 읽는다(v5 계산은 바꾸지 않는다)
  speed_indicators: dotcom_overheat_profile_v1 의 speed 2종 score_raw 를 그대로 읽는다(매일 움직이는 값)
  clamp: [-50, 150]                       # 평균에 넣을 때만 자른다 — 한 지표가 평균을 끌고 가지 못하게. 행에는 원값을 보인다

points:
  total: A + B + C                        # 0~10
  A:
    name: 닷컴 경로 직접성
    range: [0, 5]
    how: 오늘 값을 보지 않은 5인 패널이 지표마다 0~5 정수를 매기고 중앙값을 쓴다
    anchors:
      5: 닷컴 버블의 형성·붕괴에서 직접 경로이자 핵심 증상
      4: 버블의 크기 자체를 직접 재는 값
      3: 버블을 키운 자금·레버리지 경로
      2: 당시 함께 나타난 여건
      1: 배경 거시 지표
      0: 닷컴 경로와 무관
    owner_override:
      ipo_count_operating_12m: 5          # 소유자 지정 — "닷컴 때 중소 IPO 많아질 때 무너졌으니 그 부분이 영향도 높다". 패널 중앙값은 공개만 한다
  B:
    name: 과거 표본 근거
    range: [0, 3]
    how: dotcom_overheat_index_v7 frozen 의 판정을 대응 후보에서 읽는다(다시 재지 않는다)
    map: {eligible: 3, duplicate: 2, weak: 1, chance: 1, opposite: 0, none: 0, unscored: 1}
  C:
    name: 정점 때 실제 방향
    range: [0, 2]
    how: >-
      닷컴 참조 구간의 마지막 관측(1999년 말)이 자기 범위의 어디였는가. 카드 지표는 v5 의 범위 위치, 속도 지표는
      프로필 척도의 1999-12-31 점수. 67 이상 2 · 33 이상 1 · 그 미만 0.
    thresholds: {two: 67, one: 33}

groups:
  rule: >-
    같은 것을 재는 지표는 한 묶음이 되어 한 번만 센다. 묶음 점수 = 구성 지표 점수의 평균, 묶음 값 = 구성 지표 값(자른 값)의
    평균. 묶음 가중 = 묶음 점수 ÷ 전체 묶음 점수 합. 지표 가중 = 묶음 가중 ÷ 구성 지표 수.
  basis: >-
    분자가 같은 주가 지수인 비율(주가 ÷ 돈), 같은 NASDAQ 가격에서 나온 속도 2종, 금융여건지수와 그 구성 요소(스프레드·
    대출 심사), 가계 차입 2종을 각각 한 묶음으로 둔다. v7 측정에서 통화량 대비 NASDAQ 과 가계 현금 대비 NASDAQ 은
    |ρ| ≥ 0.80 중복으로 기록됐다. v7 은 증거금 신용 ÷ GDP 도 통화량 대비 NASDAQ 의 중복으로 기록했다 — 그래도 증거금을
    따로 둔 것은 작성자 판단이다(빌린 돈으로 사는 경로는 가격 수준과 다른 것을 잰다고 보았다). 묶음은 측정된 상관이 아니라
    '무엇을 재는가'로 나눴다. 증거금을 주가 ÷ 돈 묶음에 넣으면 2026-11-10 값은 58.3 이 아니라 60.6 이다.
  labels:
    speed: 상승 속도
    price_vs_money: 주가 ÷ 돈
    valuation: 밸류에이션
    ipo: IPO 창구
    leverage: 증거금 레버리지
    real_investment: 설비 투자
    corporate_debt: 기업 빚
    household_debt: 가계 빚
    conditions: 금융 여건
    economy: 경기

missing:
  rule: 값이 없는 지표는 빼고 같은 규칙으로 가중을 다시 나눈다(묶음 안 먼저, 그다음 묶음 사이)
  hold_below_live_weight: 0.70            # 살아 있는 가중이 이보다 적으면 값을 내지 않고 이전 산식(v5)만 보인다

variants:                                 # 가정 범위 — 확률 구간이 아니다. 가중을 달리 잡으면 값이 어디까지 달라지는지
  declared: 위 규칙(점수 가중, 묶음은 한 번)
