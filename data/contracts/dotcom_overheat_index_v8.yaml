mapping_notes:
  - margin_credit 는 v5 에서 증거금 신용 수준(사이클 시작 = 100)이고 v7 의 가장 가까운 후보는 증거금 신용 ÷ GDP 다(근사 대응).
  - investment_share_gdp 는 v5 에서 장비+지식재산 투자 ÷ GDP 이고 v7 의 같은 정의 후보(equipment_ip_gdp)에 대응한다.
  - >-
    dotcom_end_position 은 2026-11-12 원장 기준으로 읽은 값이다. 닷컴 구간도 분기 자료는 개정될 수 있다 — 감시
    (overheat-watchdog)가 원장에서 다시 읽어 점수 칸(33·67)이 바뀌면 경고하고, 그때는 계약 새 판을 낸다(자동으로 고치지 않는다).
  - >-
    ipo_count_operating_12m 은 v5 에서 Ritter 순 미국 IPO 에 테마 기업 상장(ADR·해외, 규모 무관)을 더한 값이고, v7 이 잰
    후보(ipo_count_12m)는 미국 IPO 건수만이다. B 점수는 정의가 조금 다른 후보의 판정을 읽은 것이다(근사 대응).

