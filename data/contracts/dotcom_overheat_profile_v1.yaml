version: 2026-11-11.v1
contract_id: dotcom_overheat_profile_v1
status: display_reference                # 지수가 아니다 — 지표별 닮음을 합치지 않고 나란히 보인다
scope: dotcom_ai_comparison_display_only
probability_space: reference_only
model_use: false
official_forecast_input: false
combine_with_official_forecasts: false
combine_with_scenario: false
trading_signal: false

decided_by: user
decided_at: 2026-11-11
decision_record: docs/DECISIONS.md (2026-11-11 닷컴 대비 과열도 프로필)
owner_decision: >-
  "프로필로 싣기" — 단일 지수 대신, 편입 시험을 통과한 지표를 합치지 않고 과열도 카드에 나란히 보인다.
  대표값은 v5 그대로 둔다.

why: >-
  과열도 v6 는 단일 지수로는 자체 게이트를 넘지 못했다(v6.0: V9·V10·V12, v6.1: V8·V12·C3). 그 가운데 V12(가중 가정에
  따른 범위 폭)만 합산 고유의 실패다. V8(발표일 계단)은 정보처리 장비 투자÷GDP 한 지표가 발표 때 크게 뛰는 데서 왔고
  (2025~2026 발표일에 22~36점 — 합산은 이를 가중만큼 줄였을 뿐이다), C3 는 IPO 건수가 1996년에 이미 142 였던 데서 왔다.
  즉 지표 자체의 성질이다. 프로필은 이 성질을 없애지 않는다 — 합치지 않아 가중 가정이 필요 없을 뿐이고, 발표 계단은
  직전 기간 점수를 함께 실어 숨기지 않는다.

source_contract: dotcom_overheat_index_v6_1
source_admission_sha256: 97738eaa9bf9de50a2bf915a6cfd19ed80bbedb7ff10b3499e3fae6f03aa46b6          # 편입 지표 + 기준값의 지문. 원천 계약의 동결 블록이 바뀌면 프로필은 닫힌다

rules:
  indicators: 원천 계약 frozen.members 의 편입 지표 전부(탈락 후보는 싣지 않는다)
  score: "100 * (x - zero) / (peak - zero), 원천 계약의 동결 기준값, 제한 없이 정수로 표시"
  zero_meaning:
    level_type: 1995-01..2019-12 중앙값 (점수 0 = 평상)
    return_type: 상승률 0 (점수 0 은 평상이 아니다 — 1995~2019 중앙값의 점수를 median_1995_2019 로 함께 싣는다)
  no_composite: true                      # 합·평균·가중·순위·종합 등급·색 신호등을 만들지 않는다
  current_value: 원장에 실제 들어온 최신 자료(고정 지연 없음)
  change_4w: 일간 지표만 — 오늘 점수 − 20거래일 전 점수(과거 시점은 고정 발표 지연 적용)
  high_12m: 일간 지표만 — 오늘 포함 최근 252거래일 최고 점수와 날짜
  non_daily: 월·분기 지표는 변화 대신 자료 기간과 직전 기간의 점수를 보인다(다음 발표까지 그대로이고, 발표 때 뛴다)
  unmeasured_family: 편입 지표가 없는 부문은 '미측정'으로 적는다(0 이 아니다)
  hold:
    - NASDAQ 원장이 원천 계약의 일간 한도보다 오래되면 프로필 전체를 닫는다
    - 다시 계산한 기준값이 폭의 1% 넘게 움직였거나 자료가 원천 계약 한도보다 오래된 지표는 점수를 싣지 않는다
    - 산출물은 자기가 선 동결 지문을 적는다. 지금의 동결 지문·계약 판과 다르면 싣지 않는다
    - 빌드와 화면 모두 산출물의 기준일이 일간 한도보다 오래되면 점수를 싣지 않는다
  fail_soft: 계산이 실패하면 닫힌 산출물을 쓰고 정상 종료한다(공식 원장 갱신을 막지 않는다). 감시가 알린다

display:
  where: 통계 화면 '닷컴 대비 과열도' 카드의 맨 아래 — v5 대표값·분해·주석 뒤, 구분선 아래
  headline_stays: dotcom_overheat_index_v5
  headline_since_2026_11_12: >-
    dotcom_overheat_index_v8(판단 가중 평균, 소유자 지시)이 대표값이 됐다. 프로필 자신은 여전히 합치지 않는다 — v8 이
    상승 속도 2종의 점수를 읽어 갈 뿐이다. 그래서 화면 주석은 v8 이 열려 있으면 '대표값 내역 아님' 대신 '상승 속도 N종만
    대표값에 반영'(N = v8 이 실제로 읽은 속도 지표 수)으로 바뀐다. v8 이 닫히면 위 headline_stays 로 돌아간다.
  never: [composite_number, average, weighted_sum, rank, traffic_light]
  required_labels: [합산 지수 아님, 대표값 내역 아님, 다른 척도, 참고 의견, 기준일]

known_limits:
  - 100 은 사후 자료 기준 2000년 3월 상태다. 사례가 하나라 "100 이면 붕괴"를 뜻하지 않는다.
  - v5 대표값(54%)과 척도가 다르다. v5 는 1995~1999 범위 안의 위치이고 일부 지표는 시대 시작 이후 상승률이다 — 같은 카드의
    'M2 한 단위 대비 NASDAQ'(v5, 시대 시작 재기준)과 '통화량 대비 NASDAQ 수준'(프로필, 수준)은 같은 비율의 다른 정의라 값이 다르다.
    IPO 도 v5 는 테마 상장 가산 포함, 프로필은 Ritter 미국 운영기업만이다.
  - 다섯 지표 가운데 셋(NASDAQ 2년 상승률·200일 이격·통화량 대비 수준)은 같은 NASDAQ 종가에서 나온다 — 서로 독립이 아니다.
  - 상승 속도 두 지표의 0 은 평상이 아니라 상승률 0 이다. 1995~2019 중앙값은 2년 상승률 23, 200일 이격 11 안팎이고,
    2년 상승률은 2011년 2월(금융위기 저점 대비)에 60 을 넘었다.
  - 정보처리 장비 투자÷GDP 는 발표 한 번에 크게 움직인다(2025~2026 발표일에 22~36점). 편입 시험의 변동 한도(p95 25)는
    2001-07..2022-12 표본에서 잰 것이고 그 뒤 구간은 이를 넘었다.
  - IPO 건수는 Ritter 자료가 연 1회 안팎 갱신된다. 비상장 조달(AI)은 잡지 못한다. 이 지표는 1996년에 이미 142 였다(닷컴 IPO
    건수의 정점은 2000년이 아니라 1996년).
  - 참여·레버리지 부문은 편입 시험을 통과한 지표가 없어 미측정이다. 탈락 후보(증거금÷GDP, 가계 주식 배분 등)는 싣지 않는다.
  - 닷컴형 주식 과열만 잰다. 2007년처럼 신용이 이끈 정점은 낮게 나온다 — 낮다고 안전하다는 뜻이 아니다.
  - 편입 시험은 v6.0 계약에 먼저 고정했지만 후보와 임계는 시제품 값을 본 뒤 정했다(원천 계약 errata).
