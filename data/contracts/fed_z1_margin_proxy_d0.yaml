schema:
  required_series:
    - FL663067003
  expected_units: millions_of_us_dollars
  seasonal_adjustment: not_seasonally_adjusted
  frequency: quarterly_end_of_period

point_in_time:
  observation_period: calendar_quarter_end
  available_at: Federal Reserve Z.1 public release timestamp, generally 12:00 America/New_York; never the quarter end
  revision_vintage: native_release_capture_after_activation
  historical_use: Current-release history is reconstructed and must not be represented as native PIT history.

license:
  status: public_domain_with_attribution
  terms_url: https://www.federalreserve.gov/disclaimer.htm
  redistribution: permitted_for_board_produced_information
  database_creation: permitted
  automated_access: permitted_subject_to_reasonable_rate_limits
  predictive_analytics_use: permitted_for_board_produced_information
  attribution: Source Board of Governors of the Federal Reserve System, Financial Accounts of the United States Z.1; no Board endorsement implied.
  caveat: Non-Board third-party material, photos, graphics, trademarks, and separately marked content are excluded.

replacement_policy:
  role: proxy_not_finra_margin_debt
  resolution: If FINRA grants written permission covering retrieval, storage, redistribution, and predictive use, replace this proxy with the FINRA series after a separately approved contract migration.
  comparability_warning: Quarterly broker-dealer customer receivables include margin loans and other receivables and must never be labelled as FINRA monthly margin debt.

activation_gate:
  - Fourteen calendar days of successful endpoint, schema, code-map, and release-timing monitoring through 2026-08-18.
  - Confirm FL663067003 coverage through the dot-com comparison window and record revisions as reconstructed vintages.
  - Contract review and source-registry registration in a separately approved S1 change.
  - Collector, archive, receipt, PIT, attribution, and proxy-label tests must ship together; model use remains off until then.
fallback: Preserve the last activated release with a stale flag; never interpolate the quarterly series into a synthetic monthly FINRA value.
