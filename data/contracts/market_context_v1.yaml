schema_version: 1
contract_id: market_context_v1
model_id: research.nasdaq_market_context_v1
model_version: 1
probability_unit: fraction
status: independent_research_preview
model:
  family: decaying_ridge_residual_log_return_over_unchanged_gbm
  axes: [growth, inflation, policy_rates, energy, ai_demand, semiconductor, risk_financial]
  half_lives: [5, 21, 63]
  horizon_sessions: 252
  path_count: 20000
  seed: 42
  lookback_sessions: 252
  maximum_adjustment_sessions: 63
  train_horizons: [5, 21, 63]
  horizon_weights: [0.25, 0.5, 0.25]
  primary_horizon: 21
  minimum_training_sessions: 756
  minimum_events_per_family: 30
  ridge_candidates: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  inner_purge_sessions: 63
  inner_embargo_sessions: 5
  fit_intercept: false
  center_features: false
  bootstrap_count: 200
  bootstrap_block_sessions: 63
  coefficient_cadence: monthly
  unsupported_family_numeric_effect: 0
  additional_daily_residual_noise: false
input:
  minimum_history_sessions: 253
  maximum_captured_observations_per_series: 3000
  horizon_sessions: 252
  market_max_age_sessions: 0
  active_daily_max_age_sessions: 1
  active_oil_max_age_sessions: 3
  active_release_max_age_days: 62
  exchange: XNAS
  native_store_read_only: true
  current_csv_historical_pit_training: false
  available_and_retrieved_lte_as_of: true
  no_secret_access: true
  no_market_price_carry: true
  non_session_index_observation: reject_row_with_raw_link_and_reason
  dates_only_vintage_available_time: '23:59:59 America/New_York'
  expectation_kinds_are_separate_mappings: true
  missing_is_not_zero: true
representative:
  selection: equal_weight_five_empirical_rank_distance_to_median
  statistics: [terminal_log_return, maximum_drawdown, daily_volatility, negative_session_share, sign_change_share]
  eligible_percentile_ranges: [[0.4, 0.6], [0.25, 0.75], [0.25, 0.75], [0.1, 0.9], [0.1, 0.9]]
  ties: lowest_original_path_id
  relaxation: prohibited
  daily_points_including_anchor: 253
  smoothing: prohibited
