    series_id: NASDAQCOM
    source_class: captured_market
    family: nasdaq_price
    axis: risk_financial
    kind: market_observation
    storage: raw_receipt_and_observations
    display: derived_statistics_and_source_link
    historical_validation: captured_forward_only
  - id: fred_vix
    enabled: true
    url: https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS
