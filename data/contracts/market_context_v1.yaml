    max_items: 30
    max_age_days: 90
    topic_terms: [memory, DRAM, NAND, HBM, China, Wuxi, Dalian, capacity, supply]
  - id: samsung_memory
    enabled: true
    url: https://news.samsung.com/global/category/products/semiconductors/feed
    format: rss
    source_class: official
    family: samsung_memory_disclosure
    axis: semiconductor
    kind: issuer_disclosure
    max_items: 30
    max_age_days: 90
    topic_terms: [memory, DRAM, NAND, HBM, China, capacity, supply]
  - id: cxmt_memory
    enabled: false
    url: https://www.cxmt.com/en/news.html
    format: html_links
    source_class: official
    family: cxmt_memory_disclosure
    axis: semiconductor
    kind: issuer_disclosure
    license_status: review_required
    reason: issuer_terms_require_permission_for_content_use
news_policy:
  raw_first: true
  aggregate_headline_sentiment_numeric_use: false
  unverified_or_unmapped_numeric_effect: 0
  primary_sources_only: true
  republished_incident_additional_shock: 0
  storage: source_receipts_and_minimum_evidence
  public_display: title_link_and_derived_facts_only
  unknown_publication_time: null_reference_only_with_first_capture_availability
publication:
  tier: independent_research_preview
  predictive_validation: not_established
  official_ledger_write: false
  automatic_promotion: false
  schedule_utc: '20 5 * * *'
  schedule_timezone: Asia/Seoul
  expected_start_kst: '14:20'
  as_of: freeze_after_collection_before_calculation
  pointwise_bands_are_not_simultaneous: true
  historical_vintages_immutable: true
evaluation:
  primary: crps_21
  minimum_matured_pit_origins: 252
  minimum_nonoverlapping_21_session_blocks: 12
  minimum_nonoverlapping_63_session_blocks: 8
  minimum_relative_crps_improvement: 0.02
  one_sided_confidence: 0.95
  secondary_maximum_relative_deterioration: 0.02
  inherited_sealed_performance: false
  choose_model_using_representative_error: false
  comparisons: [baseline, market_only, event_only, combined, fhs]
