schema_version: 1
contract_id: multi_year_bubble_stress_v1
status: active_reference_only
probability_space: reference_only
model_use: prohibited
official_forecast_input: false

purpose: Display a hypothetical multi-year AI-bubble stress without presenting it as an event probability, calibrated forecast, or target price.

layers:
  selected_history:
    episodes: [great_depression, world_war_ii_initial_decline, oil_shock, dotcom]
    selection_is_exhaustive_base_rate: false
    universal_year_2_or_3_rule: false
    source: NYU_Stern_Damodaran_SP500_total_returns
    composite_horizon_years: 5
    composite_method: pointwise_log_index_median_with_linear_q25_q75
    observations_by_horizon: [4, 4, 4, 4, 4, 4]
  observed_dotcom_assets:
    date_window: 1999-12_to_2004-12
    assets: [NASDAQ_Composite_price, Realty_Income_price, Realty_Income_adjusted_close_total_return_proxy]
    bitcoin: unavailable_launched_2009
    normalization: 1999-12_equals_100
  ai_bust_counterfactual:
    reference: four_selected_US_equity_episode_log_space_composite
    transform: positive_power_transport_of_composite_index
    beta_source: latest_cross_asset_downside_beta_5y
    cases: [historical_q25_q75_band, 10th_percentile_beta, center_beta, 90th_percentile_beta]
    output_semantics: sensitivity_only_not_observed_not_probability_not_forecast
  bitcoin_liquidity_rotation_assumption:
    transfer_share: 0.35
    transfer_share_sensitivity: [0.15, 0.50]
    absorption_elasticity: 1.60
    transform: 100_times_exp_transfer_share_times_elasticity_times_running_max_equity_log_loss
    output_semantics: user_directed_assumption_not_observed_not_estimated_not_probability_not_forecast

separation_guards:
  - historical returns must not be counted as independent probability observations
  - observed Realty Income history must remain separate from current-beta transport
  - Bitcoin counterfactual must never be labeled observed
  - Bitcoin liquidity-rotation line must remain visibly labeled as a user-directed assumption
  - stress paths must not feed Scenario V5.2, official snapshot, calibration, or ledger
  - no silent claim that year two or three is always worse
  - US-equity episode reference and NASDAQ-estimated beta basis mismatch must remain disclosed
  - presentation must summarize the four selected episodes as a log-space median and interquartile band instead of four overlapping lines
  - presentation must separate historical evidence from the Bitcoin liquidity-rotation assumption in two adjacent panels
  - both presentation panels must use the same log-scale value domain
  - Realty Income observations and sensitivity must remain in the audit payload but stay out of the multi-year stress chart

condition_breakers:
  realty_income: [long_rate, credit_spread, refinancing_cost, occupancy, dividend_policy]
  bitcoin: [liquidity, leverage, regulation, nonlinear_beta]

lineage:
  implementation: src/ai_fc/multi_year_stress.py
  cross_asset_input: data/cross_asset/cross_asset_latest.json
  archive_inheritance: cross_asset_snapshot_id_and_response_hashes
