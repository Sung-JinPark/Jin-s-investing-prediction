# MDE 규약 차 — 상류 두 산출물이 서로 다른 승수를 쓴다. 계량해 공시하고, 유리한 쪽을
# 골라 쓰는 것을 금지한다.
mde_convention:
  diagnostic_multiplier: 리터럴 1.645 (S2-1·S2-2 진단의 mde50)
  gate_multiplier: 정규분위 정확값 z(0.95) (S2-3 gate_arithmetic 의 mde_1645se)
  worked_example_h21_reflection_2phi:
    bootstrap_se: 0.002838162
    diagnostic_mde50: 0.004668776
    gate_mde_1645se: 0.004668361
    absolute_difference: 4.15e-07
    implied_gate_multiplier: 1.6448536
  effect_on_verdicts: 차이는 소수 6째 자리이며 이 계약의 어떤 판정도 바꾸지 않는다. 게이트 문턱은 gate_arithmetic 규약을 따르고, 진단 표는 mde50 을 그대로 싣는다 — 두 규약을 섞어 유리한 쪽을 고르는 것은 금지.

# 게이트 — 산술까지 사전등록하되 armed=false. 어떤 후보도 이 게이트로 평가된 적이 없다.
# 문턱은 전부 S2 실측에서 유도된 값이며 임의 상수는 없다.
gates:
  armed: false
  armed_reason: S3-2 부정 결과 — 채택 후보 0. 무장 조건은 reopen_protocol 참조.
  evaluated_candidates: 0
  unit_of_judgement: 셀 = (후보, 지평). 지평·후보 간 합산 채택 금지 (등록부 no_pooling).
  G0_crps_no_damage:
    rule: V8 봉인 해시·원장 해시가 baseline 과 일치하고 V8 store 쓰기 0.
    hard: true
    failure_action: 계약 아래 모든 평가 무효
  G1_skill_vs_climatology:
    rule: 두 지평 모두 후보 vs 기후 쌍대 손실차의 CI90 하한 > 0.
    strict_inequality: true
    both_horizons_required: true
    companion_obligation: expanding climatology 대비 값을 병기한다 (eligible_n 차이 공시).
  G2_skill_vs_reflection:
    rule: 두 지평 모두 후보 vs 구속 기준선(reflection_bgk) 쌍대 손실차의 CI90 하한 > 0.
    binding_baseline: reflection_bgk
    companion_baseline: reflection_2phi (병기 의무 — 판정에는 쓰지 않는다)
    point_estimate_form: BS_후보 ≤ BS_기준선 − 1.645·se (S2-2 규약)
    rationale: S2-2 가 확인한 사실 — V8 first_touch 는 자유 파라미터 0 개의 반사원리 공식을 이기지 못한다. 기후 대비 개선만으로는 '쓸모'를 주장할 수 없다.
    thresholds:
      h21:
        climatology_brier: 0.064708
        vs_reflection_2phi:
          baseline_brier: 0.060135
          mde_1645se: 0.004668
          required_candidate_brier_max: 0.055466
          required_brier_skill_vs_climatology_min: 0.142819
        vs_reflection_bgk:
          baseline_brier: 0.05814
          mde_1645se: 0.0071
          required_candidate_brier_max: 0.051041
          required_brier_skill_vs_climatology_min: 0.211214
      h63:
        climatology_brier: 0.159424
        vs_reflection_2phi:
          baseline_brier: 0.149889
          mde_1645se: 0.006689
          required_candidate_brier_max: 0.1432
          required_brier_skill_vs_climatology_min: 0.101762
        vs_reflection_bgk:
          baseline_brier: 0.145938
          mde_1645se: 0.010548
          required_candidate_brier_max: 0.13539
          required_brier_skill_vs_climatology_min: 0.150754
  G3_bidirectional_transfer:
    rule: 가설 H, 지평 h 의 셀이 채택되려면 early_to_late 와 late_to_early 두 방향 **모두** Δ 의 CI90 하한 > 0.
    source: 설계도 §2 원문 — '채택 = 양방향 모두 CI90 하한 > 0'
    frozen: §2 원문 불변. 완화·재해석 금지 (K-baseline).
    directions:
    - early_to_late
    - late_to_early
    fit_objective: 학습창 Brier 최소화 (평가창 정보 일절 미사용).
    frozen_nuisance: τ(분위 문턱)·b(터치율)·λ·w 는 전부 학습창 값이며 평가창에서 재계산하지 않는다. 재계산은 전이 검정을 in-sample 로 되돌리는 행위이므로 금지.
    test_statistic: Δ = mean_i[ (p_i − y_i)² − (p′_i − y_i)² ] (평가창). 양수 = 개선. 쌍대(paired) 손실차 d_i = (p_i−y_i)² − (p′_i−y_i)² 의 표본평균과 동일.
    uncertainty:
      bootstrap: stationary block bootstrap (감싸기)
      block_length: 13
      replicates: 2000
      seed: 20260902
      interval: percentile [5, 95] = CI90
  G4_reliability:
    rule: 후보의 Murphy reliability 가 두 binning 모두에서 V8 실측값보다 작고, 상위분위 과신 gap(예측 − 관측)의 CI90 하한이 두 지평 모두 0 이하로 내려간다.
    subject_of_gap: 표적 구조 — 반사 기준선 기준(S2-3 R2). 주체 선택은 사용자 결정 V12-D2.
    current_v8_reliability:
      h21:
        quantile_bins: 0.003331
        fixed_bins: 0.009613
      h63:
        quantile_bins: 0.010418
        fixed_bins: 0.011683
    current_gap_ci90_lower_must_fall_below_zero:
      h21: 0.007792
      h63: 0.065441
    note: reliability 는 binning 의존량이다. 한 binning 만 인용해 통과를 주장하는 것 금지.
  G5_reporting_obligations:
    mde: 모든 셀에 MDE = 1.645 × bootstrap_se 를 병기한다. |Δ| < MDE 인 셀은 부호와 무관하게 '결정적 증거 없음' 으로 라벨하고, 개선 주장에 인용할 수 없다.
    concentration: 모든 셀에 (a) 상위 5% |d_i| 가 |d| 총합에서 차지하는 비중, (b) 그 상위 5% 를 제거한 뒤의 Δ 부호를 보고한다. 부호가 뒤집히는 셀은 '집중도 취약' 라벨을 달고, 라벨이 달린 셀은 채택되더라도 그 사실을 판정문에 병기해야 한다.
    no_cell_dropping: 모든 셀·방향을 미달·퇴화 포함 전수 보고한다.
    negative_control_required: T5 류 음성 대조를 동반하지 않은 채택 주장은 무효.
    multiplicity: family 수준의 증거 주장은 P(k ≥ k_obs) ≤ 0.05 일 때만. 초과 시 개별 셀이 채택돼도 'family 수준에서는 다중검정으로 설명 가능' 을 판정문에 병기.
  current_status_of_v8_raw_probability:
    h21:
      G1_vs_climatology: 미달
      G1_ci90_lower: -0.011884
      G2_vs_reflection_2phi: 미달
      G2_2phi_ci90_lower: -0.006668
      G2_vs_reflection_bgk: 미달
      G2_bgk_ci90_lower: -0.011147
      G4_overconfidence_still_significant: true
      G4_top_quintile_gap_ci90_lower: 0.007792
    h63:
      G1_vs_climatology: 미달
      G1_ci90_lower: -0.022054
      G2_vs_reflection_2phi: 미달
      G2_2phi_ci90_lower: -0.001855
      G2_vs_reflection_bgk: 미달
      G2_bgk_ci90_lower: -0.010022
      G4_overconfidence_still_significant: true
      G4_top_quintile_gap_ci90_lower: 0.065441
  current_status_note: 이 줄은 '오늘의 V8 원값이 게이트 앞에 어떻게 서 있는가' 의 기록이지 후보 평가가 아니다. 게이트는 armed=false 다.

# 게이트 도달 가능성 산술 — 재보정만으로 구속 기준선을 넘을 수 있는가.
# 상한 = 완전 재보정(REL=0) 가상 후보의 BSS. 상한 < 요구치면 '재보정 경로로는 도달 불가' 다.
gate_feasibility_arithmetic:
  definition: 문턱 BSS = 1 − (BS_기준선 − 1.645·se)/BS_기후 — se 를 후보 모델에서도 같다고 본 근사(S2-2 규약). 상한 BSS = 1 − (BS_V8 − REL)/BS_기후, REL 은 in-sample 추정이라 상한 자체가 낙관 편의.
  by_horizon:
    h21:
      recalibration_ceiling_bss:
        fixed_bins: 0.198368
        quantile_bins: 0.101276
        max: 0.198368
      verdict_by_baseline:
        reflection_2phi:
          required_brier_skill_vs_climatology_min: 0.142819
          reachable_under_fixed_bin_ceiling: true
          reachable_under_quantile_bin_ceiling: false
          reachable_under_any_binning: true
          headroom_vs_max_ceiling: 0.055549
        reflection_bgk:
          required_brier_skill_vs_climatology_min: 0.211214
          reachable_under_fixed_bin_ceiling: false
          reachable_under_quantile_bin_ceiling: false
          reachable_under_any_binning: false
          headroom_vs_max_ceiling: -0.012847
    h63:
      recalibration_ceiling_bss:
        fixed_bins: 0.163928
        quantile_bins: 0.15599
        max: 0.163928
      verdict_by_baseline:
        reflection_2phi:
          required_brier_skill_vs_climatology_min: 0.101762
          reachable_under_fixed_bin_ceiling: true
          reachable_under_quantile_bin_ceiling: true
          reachable_under_any_binning: true
          headroom_vs_max_ceiling: 0.062166
        reflection_bgk:
          required_brier_skill_vs_climatology_min: 0.150754
          reachable_under_fixed_bin_ceiling: true
          reachable_under_quantile_bin_ceiling: true
          reachable_under_any_binning: true
          headroom_vs_max_ceiling: 0.013174
  reading: h21 은 구속 기준선(BGK) 요구치가 재보정 상한을 넘어선다 — 상단 수축류 재보정만으로는 도달할 수 없다는 뜻이며, S3 의 부정 결과와 같은 방향을 가리킨다. h63 은 상한 안에 들어오지만 여유가 좁다.
  caveat: 상한은 REL 이 in-sample 추정이라 그 자체로 낙관 편의를 안는다. 따라서 '도달 가능' 은 가능성 진술이지 예측이 아니다.
  does_not_lower_thresholds: 이 산술은 문턱을 조정하는 근거가 아니다 (C-gate-arith).

# 정지점 2 — V9/V10 헌법 승계. 자동 소모 경로는 코드에 존재하지 않는다.
stopping_points:
  count: 2
  holdout:
    window:
    - '2015-01-01'
    - '2018-12-31'
    requires_explicit_user_approval: true
    consumption: finalist 당 1회, 자동 소모 금지
    execution_path: absent_by_construction — 이 단계의 CLI·하네스에 해당 verb 부재
    current_state: 미소모 — V12 는 홀드아웃을 열지 않았다 (C-holdout)
  sealed:
    window:
    - '2019-01-01'
    - latest
    maximum_disclosures_per_model_version: 1
    requires_explicit_user_signoff: true
    separate_session_required: true
    retune_after_failure: prohibited
    current_state: 미실행 — V12 루프의 봉인 실행 0회
  loop_execution_record:
    backtest_runs: 0
    holdout_runs: 0
    sealed_runs: 0
    refresh_runs: 0
    push: 0

# 개발 규율 — 트랙이 열리지 않았으므로 예산은 0 이다. 열릴 때 적용될 규약만 등록한다.
development_protocol:
  track_open: false
  evaluations_spent: 0
  maximum_development_evaluations: 24
  design_window_only_for_iteration: true
  holdout_maximum_finalists: 3
  experiment_ledger: data/timeseries_v12/ledgers/development_experiments.jsonl
  ledger_append_only: true
  ledger_exists: false
  preregistered_hypotheses_exhausted:
  - T1
  - T2
  - T3
  - T4
  - T5
  exhausted_meaning: T1~T4 는 이 표본에서 소진됐다. 같은 표본에 다섯 번째 맵을 사후에 만들어 다시 재는 것은 등록부 no_post_hoc_hypotheses 위반이다.

# 재개 프로토콜 — 이 부정 결과를 뒤집는 유일한 경로. 되살리기가 아니라 새 검정이다.
reopen_protocol:
  only_path: 다른 데이터 (사용자 결정 V12-D4)
  why: 부정된 것은 이 표본·이 창·이 분할에서의 네 맵과 이 검정 기계다. 같은 표본에서 다섯 번째 맵을 만드는 것도, 귀무를 갈아끼우는 것도 금지돼 있다.
  preconditions_all_required:
  - P1 사용자 결정 V12-D1(트랙 개시) 및 V12-D4(다른 데이터) 승인.
  - P2 검정 기계 수리 — T5 실패(pooled 0.254)의 원인을 규명하고, 수리된 기계가 새 음성 대조를 통과함을 결과 보기 전에 보인다.
  - P3 새 사전등록 — 가설·문턱·귀무·분할을 결과 보기 전 커밋. 기존 등록부의 재사용이 아니라 새 등록이다.
  - P4 새 데이터의 PIT·영수증 등급이 data_policy 를 만족한다.
  - P5 V8/V2 봉인 해시 무변경.
  prohibited_shortcuts:
  - 같은 표본에서 T5 이후 가설 추가 (no_post_hoc_hypotheses).
  - 결과를 본 뒤 귀무 교체로 판정 되살리기 (C-null-redesign).
  - 구속 기준선을 완화해 문턱 낮추기 (C-gate-arith).
  - S2-3 분할창 대비를 채택 근거로 인용 (C-split-contrast).
  - 홀드아웃 조기 개봉으로 표본 늘리기 (C-holdout).
  compliance_wall: 설계도 §0 — 옵션 표면·일중 데이터는 CBOE 허가 미발송·합법 일중 소스 부재로 현재 루프 밖이다. V12-D4 는 그 벽을 여는 결정이기도 하다.

# 금지 — V8·V10 계약 금지 키의 합집합을 전부 승계하고 V12 고유 조항을 얹는다.
# true = 금지된 행위. 승계 누락은 검증기가 잡는다.
prohibitions:
  inherited_from_v8_and_v10:
    automatic_holdout_consumption: true
    automatic_main_self_modification_in_production: true
    automatic_sealed_disclosure: true
    deep_learning_or_learned_weights: true
    dev_gate_threshold_relaxation: true
    direct_index_level_training: true
    exogenous_feature_additions: true
    forced_endpoint: true
    future_actual_exogenous: true
    mutate_v2: true
    mutate_v8: true
    official_ledger_write: true
    retune_v2: true
    retune_v8: true
    scenario_v5_2_mutation: true
    sealed_2019_access_during_development: true
    secret_loading_in_loops: true
    silent_feature_drop: true
    silent_normalization: true
    v2_store_write: true
    v8_store_write: true
  v12_specific:
    crps_gate_threshold_relaxation: true
    gate_threshold_relaxation: true
    binding_baseline_swap_after_results: true
    post_hoc_hypotheses_on_same_sample: true
    null_redesign_after_results: true
    revive_negative_result_as_conditional_pass: true
    split_contrast_as_adoption_evidence: true
    backtest_of_llm_questions: true
    forecasts_directory_write: true
    publication_without_p3_gate: true
  inheritance_rule: 'V8·V10 금지 키는 하나도 빠지지 않는다. 파생층이 구조적으로 저촉될 수 없는 항목(예: 분포 학습 관련)도 완화하지 않고 그대로 싣는다.'

# 한계 — 이 계약이 안고 있는 미검증. 숨기지 않고 계약 본문에 싣는다.
known_limits:
- N1 귀무가 T1 류 상단 수축 맵의 적법한 귀무인지 [미검증] — 대안 귀무 미계산.
- 귀무 통과율의 지평 간 격차(T1 h21 0.503 vs h63 0.005) 기전 [미검증].
- T4 두 셀의 비독립성을 family 8셀 산술이 무시한다 [미검증].
- 국면(GFC/calm) 층화 CI 미산출 — S2 규약 승계.
- h1·h5 지평 미평가 — 터치 기저율이 판정 불가 수준.
- 2015+ 봉인창 미계산 — 의도적 홀드아웃 보존.
- 공통 창(2007–14) 전반부가 GFC 로 지배돼 '전반→후반 전이' 가 곧 '위기→평온 전이' 다 (설계도 §0 인정 사항).
- 재보정 상한의 REL 이 in-sample 추정이라 상한 자체가 낙관 편의를 안는다.
- G4 의 gap 주체 선택(R2 = 표적 구조)이 옳은 독해인지는 사용자 판단 V12-D2.
- 상류 두 산출물의 MDE 승수 규약이 다르다 (mde_convention) — 판정 무영향이나 미정리.
- measured_state 의 h21 v8_gap_ci90_lower 는 0 을 포함한다 — 과신 구조의 주체를 V8 로 잡으면(S2-3 R1) 두 지평 재현이 성립하지 않는다. 이 계약은 R2 를 쓰며 그 선택은 V12-D2.

# 사용자 결정 대기 — 이 계약은 어느 것도 대신 결정하지 않는다.
decisions_pending:
  V12-D1: 트랙 개시 여부 — S3 부정 결과를 받고도 열 것인가.
  V12-D2: 게이트 임계와 gap 주체(R2 vs R1) 선택.
  V12-D3: 파생층 배포 — 라이브 카드에 이벤트 확률 표시 여부 (현 계약은 not_published).
  V12-D4: 다른 데이터 — CBOE 허가 요청 발송 여부. reopen_protocol 의 유일 경로.
