# 기준선 — 게이트가 이길 것을 요구하는 상대. 기후는 하한, 반사원리는 실질 상대다.
# 판정이 일간 종가 기준이므로 이산 모니터링 보정판(BGK)이 정합 기준선이고, 연속식 2Φ 는
# 구조적으로 터치를 과대추정한다 — 그래서 BGK 가 더 엄격한 쪽이며 구속 기준선으로 등록한다.
baselines:
  climatology_insample:
    definition: 표본 기저율 상수 예측 (in-sample)
    role: 하한 기준선 — 이기지 못하면 skill 주장 불가
    caveat: in-sample 이라 낙관 편의. 병기 기준선은 expanding_climatology.
  climatology_expanding:
    definition: 만기 도래 원점만 · Jeffreys 평활 · 달력 근사 만기
    role: 표본외 기후 — 병기 의무
  reflection_2phi:
    formula: p_reflect = 2·Φ(−ln(S/K)/(σ√T)) = 2·Φ(ln(0.90)/(σ√T))
    sigma: EWMA λ=0.97 일간 변동성 — V8 _ewma_variance_series 재귀·같은 학습 슬라이스
    barrier_k_over_s: 0.9
    free_parameters: 0
    assumptions:
    - 드리프트 0
    - 상수 변동성
    - 연속 모니터링
    - 정규 증분
    known_biases:
    - 연속 모니터링 가정 — 실제 판정은 일간 종가 최소값이므로 구조적 과대추정 (variants.discrete_monitoring_bgk 로 계량)
    - 드리프트 0 — 표본 기간 나스닥 μ̂>0 이면 하방 터치 과대추정 (variants.drift_mu_hat)
    - 정규 증분 — 실수익률 첨도로 짧은 지평 과소·긴 지평 과대 방향 불명확 [미검증]
    role: 보조 기준선 (연속 모니터링 가정)
  reflection_bgk:
    definition: 일간 종가 모니터링 보정 — 연속식은 구조적으로 터치를 과대추정한다
    beta: 0.582597
    beta_note: β 는 지평에 의존하지 않는 보정 상수다 — h21·h63 이 같은 값인 것은 복제 오류가 아니라 정의상 그렇다.
    beta_identical_across_horizons: true
    free_parameters: 0
    role: 구속 기준선 — 판정 규약(일간 종가)과 정합하며 2Φ 보다 엄격하다
    binding: true
  baseline_swap_prohibited: 결과를 본 뒤 구속 기준선을 2Φ 로 바꿔 문턱을 낮추는 것은 C-gate-arith 위반이다.

