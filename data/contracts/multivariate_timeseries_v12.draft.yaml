negative_result:
  decision: 전이 불가 (부정 결과 확정)
  decision_code: NEGATIVE_RESULT
  adopted_cells: []
  adopted_count: 0
  k_obs: 0
  family_cells: 8
  directions_evaluated: 16
  directions_with_ci90_lower_gt_0: 0
  failure_modes:
    ci90_lower_below_zero: 10
    ci90_lower_equal_zero_map_inert: 6
  negative_control_T5:
    failed: true
    pass_rate_pooled: 0.254
    threshold: 0.1
    meaning: 귀무로 섞은 p 로도 채택 요건이 pooled 25.4% 확률로 충족된다 — 이 검정 기계가 낸 '통과' 는 증거로 쓸 수 없었다.
    interpretation_limit: 통과율 ≤ 10% 는 '검정에 결함이 없다' 가 아니라 '이 음성 대조가 결함을 잡아내지 못했다' 는 뜻이다.
  permutation_null:
    replicates: 1000
    k_mean_under_null: 2.764
    p_k_ge_kobs: 1.0
    family_claim_supported: false
  governing_branch: T5_fail
  branches_fired:
  - T5_fail
  - adopted_0
  branch_precedence: T5_fail > adopted_0 (등록부 pre_committed_interpretation.T5_fail 원문)
  s4_contract_mandate: T5 통과율 > 10% → 채택 전부 무효 + 부정 결과 계약. 이 경로가 adopted_0 보다 우선한다.
  s4_contract_source: prereg.pre_committed_interpretation.T5_fail
  established:
  - 이 표본·이 창·이 분할에서 사전등록된 네 파생층 맵(T1~T4) 중 어느 것도 두 방향 모두에서 Brier 개선의 CI90 하한을 0 위로 올리지 못했다.
  - T3(반사 앵커 혼합)은 전→후 두 지평에서 CI90 상한이 0 미만 — 미달을 넘어 악화다.
  - T4(지평 단조 제약)는 이 표본에서 위반 0 건이라 무비용이자 무효과다.
  - 음성 대조 T5 가 실패했다 — 검정 기계 결함의 증거다.
  not_established:
  - '''V8 first_touch 가 잘 보정돼 있다'' 가 아니다 — S2-1 과신 구조는 그대로다.'
  - '''어떤 재보정도 불가능하다'' 가 아니다 — 부정된 것은 등록된 네 맵과 이 검정 절차다.'
  - '''V8 이 반사원리 기준선을 이긴다/진다'' 를 새로 말하지 않는다 — 풀표본 판정(S2-2)이 정본.'
  - 2015+ 봉인창에 대한 어떤 주장도 아니다 — 홀드아웃 미계산.
  carryover_clauses_from_s3:
    C-S4-contract: 이 계약을 '조건부 통과' 로 되살리는 서술 금지.
    C-null-redesign: 결과를 본 뒤 귀무를 갈아끼워 판정을 되살리는 것 금지.
    C-gate-arith: 기준선을 바꿔 문턱을 낮추는 것은 근거 명문화 없이 금지.
    C-split-contrast: S2-3 분할창 대비를 S3/S4 근거로 인용 금지.
    C-holdout: 2015+ 봉인창 미계산 유지 — 부정 결과가 홀드아웃을 여는 근거가 되지 않는다.

