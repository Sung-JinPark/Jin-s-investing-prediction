  holdout_fail_cells: [vix25_h5, vix25_h63, vix30_h5, vix30_h21, vix30_h63, rv_h63]   # 표시 계층이 이 셀의 숫자를 내린다
  holdout_pass_cells: [vix25_h21, rv_h5, rv_h21]
  holdout_family_p: 0.008361                             # P(k>=3 | n=9, p=0.05) — 다중비교 후에도 유의
  wiring_eligible_cells: [rv_h5, rv_h21]                 # PASS ∧ 설계창 국면 가드 통과. vix25_h21 은 PASS 이나 설계창 late 국면 4개라 배선 불가(degeneracy_guard.consequences.wiring)
  t3_without_holdout_requires_bold_caveat: true          # 사용자 결정(2026-09-08): T3 는 홀드아웃 전 — caveat lead 에 '홀드아웃 미검증' 굵게 상시

# 라이브 전진 게이트 — 결과 축적 전 사전등록 (표시 설계서 §5·§8-3). vol_live.jsonl 의 원점이 성숙하면 셀별 자동 강등.
live_forward_gate:
  registered: '2026-09-08'                               # 라이브 원장 1행 시점 — 어떤 원점도 성숙하기 전
  scoring: 셀별 Brier — 라이브 포인터 p 와 실현 라벨(VIX>=K / RV21>theta, h 영업일 내 터치) · 기후 대비 쌍대 손실차
  maturity: 원점 + h 영업일이 아카이브에 들어온 뒤에만 채점 (미성숙 원점은 표에서 제외)
  minimum_matured_origins_per_cell: 60                   # 그 전에는 '표본 부족' 표시만, 판정 없음
  uncertainty: stationary block ℓ=13 · B=2000 · seed 20260907 · CI90 (설계 게이트와 동일)
  demotion_rule: 셀별 기후 대비 쌍대 Brier 손실차 CI90 하한 <= 0 이면 그 셀 표시 hold (holdout_fail_cells 와 같은 경로) — 자동 재무장 없음, 재개는 사용자 결정
  negative_control: y-block(ℓ=13) 순열 통과율 <= 0.10 (판정 무효화 규칙 승계)
  execution_path: named_verb_guarded                     # [P1 2026-09-09] timeseries-v13-vol-resolve — 규칙(위)은 원점 성숙 전에 고정됐고 verb 는 그 규칙을 실행만 한다
  verb: timeseries-v13-vol-resolve — 성숙 원점만 채점·append. 강등 판정은 하지 않는다(표본 부족 표시까지)
  outcomes_written_to: data/timeseries_v13/ledgers/vol_live_resolutions.jsonl (append-only) — forecasts/·calibration/ 무접촉

# 개정 적용 기록 — 이 계약 draft 에 사후 반영된 사용자 결정 (V12 amendments_applied 선례)
# ── P5 rung-5: 형상(shape) 파생 블록 — 사전등록 2026-09-10 ─────────────────────
# P4 에서 봉인 아카이브의 '수준형' 무료 정보집합이 소진됐다(27검정 채택 0).
# 남은 것은 같은 아카이브에서 만드는 '형상' 파생 — 수익률 분포의 비대칭과 내재−실현 격차.
# 신규 데이터 적재 0 · 신규 라이선스 노출 0 (봉인 V2 read-only 파생).
#
# 취득 경로 이력: FRED 경유 외부 변동성 지수(VXNCLS 등) 수집을 2026-09-10 에 시도했다가
# DECISIONS 12-6(fredgraph.csv 스크랩 = 약관 위반)·12-5(CBOE→FRED 이전은 AI/ML 금지·캐시
# 금지가 추가되어 "더 나쁨")에 걸려 커밋 80105ba8 로 전량 철회했다. 그 갈래는 사용자 결정
# 대기이며, 이 rung 은 그 결정과 **무관하게** 진행 가능한 갈래다.
rung5_shape_blocks:
  registered: "2026-09-10"
  prereg_commit: c9709f0e
  design_doc: docs/design/mts_p5_user_decision_options_260910.md
  orthogonality_evidence: data/timeseries_v13/prereg/rung5_feature_orthogonality.json
  data_sources: sealed_v2_read_only     # VIX · NASDAQCOM(ndx) 만. 신규 취득 없음
  new_ingestion: false
  license_exposure: none
  window_role: design
  window: ["2007-01-01", "2014-12-31"]
  split: "2011-01-01"
  backtest_windows_opened: 0
  evaluation_index: 5                   # 예산 4/8 → 5/8
  holdout_slot_consumed: 0              # 홀드아웃 2/3 잔여 유지
  auto_reject_rule: |
    블록 열의 |corr| 이 champion 피처(VIX_t 또는 RV21_t)에 대해 0.85 를 넘으면 등록하지 않는다.
    이 규칙으로 교차쌍 수준형(vix 셀에 RV21_t · rv 셀에 VIX_t)은 사전 기각됐다 —
    corr(VIX_t, RV21_t) = 0.9090 실측. 원시 rolling skew/kurt 도 등록하지 않는다
    (n=21 표본왜도의 SE ≈ 0.53 으로 신호 대비 잡음 과잉).
  blocks:
    G1_signed_jump:
      definition: "21영업일 창의 부호별 실현분산 차 — sum_{r>0} r^2 − sum_{r<0} r^2, r_t = log(ndx_t / ndx_{t-1})"
      lag_sessions: 0
      pit_grade: derived_from_sealed
      theory: "좋은/나쁜 변동성 분해. 하방 실현분산이 상방보다 미래 변동성을 강하게 예측한다는 가설."
      measured_abs_corr: {vs_vix: 0.4176, vs_rv21: 0.3819}
      window_start_loss: 21
    G2_semivariance_ratio:
      definition: "21영업일 창의 하방 실현분산 비율 — sum_{r<0} r^2 / sum r^2"
      lag_sessions: 0
      pit_grade: derived_from_sealed
      theory: "G1 과 같은 가설의 스케일 제거 형태. 변동성 수준과 분리된 비대칭만 남긴다."
      measured_abs_corr: {vs_vix: 0.2897, vs_rv21: 0.2950}
      window_start_loss: 21
    G3_vrp_log:
      definition: "log((VIX_t / 100) / RV21_t) — 내재 대비 실현 변동성 로그비(변동성 위험 프리미엄)"
      lag_sessions: 0
      pit_grade: derived_from_sealed
      theory: "내재−실현 격차는 전향적 기대를 담아 champion 의 순수 후향 상태와 성격이 다르다."
      measured_abs_corr: {vs_vix: 0.1513, vs_rv21: 0.4973}
      window_start_loss: 0
  rv_nan_handling: "champion 과 동일하게 frozen median 0.1694207105468098 로 채운 RV21 을 쓴다."
  cells: "9셀 전부. 홀드아웃 결과로 셀을 고르지 않는다 — 좁히면 남은 홀드아웃 슬롯이 오염된다."
  candidate_form: "logit[PB 피처 + β·블록열] — 피처당 파라미터 1개 추가. 상호작용·비선형 없음."
  gate: "셀별 쌍대 Brier(PB − 후보) 양방향 CI90 하한 > 0 ∧ 증분 y-block(ℓ=13) 귀무 ≤ 0.10"
  family:
    representative: "binomial P(k >= k_obs | n = 27, p = 0.05)"
    diagnostic_only: "종속조정(가우시안 코퓰러) 값을 병기하되 **판정 다리가 아니다**. 대표값은 위 이항값으로 지금 확정한다."
  degeneracy_guard: "계약 degeneracy_guard 를 실행 시점에 적용. 미달 셀은 untestable 로 기록하고 채점 제외."
  stopping: |
    ① 설계창 밖 데이터를 읽어야 하는 상황이 생기면 즉시 중단.
    ② 블록 정의를 바꿔야 결과가 나오는 상황이면 중단하고 부정 결과로 기록.
    ③ 채택 셀이 나와도 홀드아웃은 이 rung 만으로 소모하지 않는다 — 별도 사용자 승인 사항.
  negative_result_protocol: |
    채택 0 이면 "봉인 아카이브에서 만들 수 있는 형상 정보도 당일 수준(PB)에 흡수된다"로 기록한다.
    그 경우 남은 갈래는 외부·유료 데이터뿐이며, 그 진입은 라이선스 결정(V13-D7~D9)에 종속된다.
  prohibitions:
    - 결과 후 블록 추가·정의 변경 금지
    - 홀드아웃(2015-2018)·봉인(2019+) 창 열람 금지
    - 표적(K·θ·h) 추가·변경 금지
    - p-순열 귀무 사용 금지

# ── P6 rung-6: PIT VXN 교차지수 스프레드 — 사전등록 2026-09-10 ──────────────────
# 왜 이것이 중복이 아닌가: V9 가 이미 VXN 을 시험했으나(V9_E6, 채택 실패) 그 데이터는 CBOE 직행
# VXN_History.csv 로 설계창 early 329 / late 1006 의 **심한 불균형** 표본이었다(V9 계약
# eligibility: subwindow_2010_2014). ALFRED 빈티지 경로는 early 1008 / late 1006 으로
# **균형 잡힌 양방향 검정이 처음 가능**하다. 같은 실험의 반복이 아니라 처음 하는 검정이다.
#
# 취득: 공식 API api.stlouisfed.org + FRED_API_KEY (DECISIONS 12-6 준수). fredgraph.csv 미사용.
# 키는 영수증에 남기지 않는다 — 공개형 URL 만 기록.
rung6_vxn_pit_spread:
  registered: "2026-09-10"
  prereg_commit: f72895ba
  orthogonality_evidence: data/timeseries_v13/prereg/rung6_vxn_orthogonality.json
  vintage_audit: data/timeseries_v13/exog/vxn_vintage_vs_current_audit.json
  data_source:
    series: VXNCLS
    store: data/timeseries_v13/exog/vxn_vintage_observations.jsonl
    endpoint: https://api.stlouisfed.org/fred/series/observations
    sealed_archive_written: false
  pit:
    alfred_first_vintage: "2014-04-17"
    grade_by_segment:
      "<= 2014-04-16": earliest_available_vintage
      ">= 2014-04-17": initial_release
    limitation: |
      설계창 전반부(2007-2010)에는 **동시대 빈티지가 존재하지 않는다** — ALFRED 최초 빈티지가
      2014-04-17 이다. 그 구간은 최초 가용 빈티지의 값을 쓰며 archive_verified 가 아니다.
      2014-04-17 빈티지와 현재본을 설계창 2,014일 전수 비교한 결과 불일치는 **2일**이다
      (2009-11-27 25.40→25.41, 2010-04-27 21.30→17.81). 검정에는 PIT 열을 쓴다.
      잔여 위험: 원 발표(2007-2010)와 2014-04-17 빈티지 사이의 개정은 관측 불가다.
  window_role: design
  window: ["2007-01-01", "2014-12-31"]
  split: "2011-01-01"
  backtest_windows_opened: 0
  evaluation_index: 6                   # 예산 5/8 → 6/8
  holdout_slot_consumed: 0              # 홀드아웃 2/3 잔여 유지
  auto_reject_applied:
    rule: "champion 피처(VIX_t · RV21_t) 대비 |corr| > 0.85 이면 등록하지 않는다 (rung-5 에서 사전등록한 규칙)"
    H1_vxn_level: "**기각** — |corr| VIX 0.9880 · RV21 0.9179. 수준형은 champion 에 흡수된다."
    note: "V9 도 원시 Δlog VXN 을 ρ=0.918 로 자동 기각했다. 같은 결론이 독립적으로 재현됐다."
  blocks:
    H2_vxn_vix_spread:
      definition: "x_t = VXN_t − VIX_t — 나스닥 초과 내재변동성(교차지수 스프레드, 기간구조 아님)"
      lag_sessions: 0
      pit_grade: mixed_earliest_vintage_and_initial_release
      theory: |
        표적이 NASDAQ 사건(NASDAQCOM 실현변동성 · VIX 터치)인데 champion 피처는 S&P500 의 VIX 다.
        VXN−VIX 는 '나스닥이 시장 전체보다 얼마나 더 불안한가'를 담으며, VIX 수준만으로는
        보이지 않는 섹터 특이 위험을 잰다. 이것이 champion 에 없는 유일한 정보 축이다.
      measured_abs_corr: {vs_vix: 0.3382, vs_rv21: 0.1868}
      design_window_rows: 2014
      early_rows: 1008
      late_rows: 1006
  cells: "9셀 전부. 홀드아웃 결과로 셀을 고르지 않는다."
  candidate_form: "logit[PB 피처 + β·H2] — 파라미터 1개 추가. 상호작용·비선형 없음."
  gate: "셀별 쌍대 Brier(PB − 후보) 양방향 CI90 하한 > 0 ∧ 증분 y-block(ℓ=13) 귀무 ≤ 0.10"
  family:
    representative: "binomial P(k >= k_obs | n = 9, p = 0.05)"
    diagnostic_only: "종속조정은 병기 진단이며 판정 다리가 아니다."
  degeneracy_guard: "계약 degeneracy_guard 를 실행 시점에 적용. 미달 셀은 untestable 로 기록하고 채점 제외."
  stopping: |
    ① 설계창 밖 데이터를 읽어야 하면 즉시 중단.
    ② 블록 정의를 바꿔야 결과가 나오면 중단하고 부정 결과로 기록.
    ③ 채택 셀이 나와도 홀드아웃은 이 rung 만으로 소모하지 않는다 — 별도 사용자 승인 사항.
  negative_result_protocol: |
    채택 0 이면 "나스닥 초과 내재변동성도 당일 수준에 흡수된다"로 기록한다. 그 경우 V13 설계창에서
    시험 가능한 정보집합은 사실상 소진이며, 남는 것은 라이브 전진 표본 축적(C1)뿐이다.
  prohibitions:
    - 결과 후 블록 추가·정의 변경 금지
    - 홀드아웃(2015-2018)·봉인(2019+) 창 열람 금지
    - 표적(K·θ·h) 추가·변경 금지
    - p-순열 귀무 사용 금지

