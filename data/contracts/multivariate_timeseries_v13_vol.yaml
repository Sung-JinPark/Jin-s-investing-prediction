schema_version: 1
contract_id: timeseries_v13_vol
model_id: event_probability.volatility_v13
model_version: 13
status: live_reference        # 2026-09-07 draft_prereg(결과 전 커밋) → 2026-09-08 rung-3 champion 확정·계수 동결·T3 라이브 카드(참고 의견). 홀드아웃 미소모
track: volatility_event_probability
drafted: '2026-09-07'
drafted_on_branch: claude/v13-next
supersedes: none — V8~V12 와 독립. CRPS 게이트·V8 봉인과 무관한 별도 트랙(파생층 아님).

character: |
  CLAUDE.md 1차 목표(이벤트 확률화)에 직결하는 변동성 이벤트 확률 트랙. V12 부정결과 이후
  포스트모템 T-C. 가치는 EXIT 트리거 base rate 공급이지 가격 방향 예측이 아니다.
  결정론 수치 모델의 과거 적합·워크포워드(dualdb §8·CLAUDE.md 5원칙 예외) — 산출물은 base rate
  참조이지 LLM 캘리브레이션 표본이 아니며, 하이퍼파라미터(문턱·창)가 정점지식을 간접 내포할 수
  있다는 caveat 를 유지한다.

# 표적 — 결과 보기 전 고정
targets:
  vix_touch:
    definition: P(VIX_close >= K at any business day within horizon h) — 조건 시점 이후 h영업일 내 종가 터치
    K: [25, 30]
    horizons: [5, 21, 63]
  rv_exceedance:
    definition: P(future RV21_ann > theta at any point within horizon h)
    rv: NASDAQCOM log-return 21일 표본표준편차 × sqrt(252)
    theta: 0.1694        # design 창(2007-2014) RV21 중앙값 — 사전등록 고정값
    horizons: [5, 21, 63]

# 데이터 — 읽기 전용, PIT 안전
data_policy:
  source: ai_fc.timeseries_v2.market_archive.read_market_observations  # 봉인 모듈 read-only(무수정)
  series: [VIX, NASDAQCOM]
  pit: available_at <= origin (captured_forward). first/single vintage per date.
  design_window: ['2007-01-01', '2014-12-31']   # VIX 2014거래일 · NDX 2014거래일
  no_write_to_sealed: true
  no_fred_key_in_loop: true    # 이미 아카이브된 관측만 사용, refresh 0

# 기후 기저율 (참조 null — 스킬 아님, setup 단계 산출)
climatology_base_rates:
  vix_touch: {K25_h5: 0.3076, K25_h21: 0.4195, K25_h63: 0.6079, K30_h5: 0.1782, K30_h21: 0.2519, K30_h63: 0.4070}
  rv_exceedance: {h5: 0.5523, h21: 0.6760, h63: 0.8751}
  note: design 창이 GFC(2008-09) 포함이라 기저율이 높다. 기후 = 학습창 무조건 빈도(walk-forward).

# 모형 사다리 — 전부 기후 내포(climatology=제약 특수형)
model_ladder:
  - climatology          # 학습창 무조건 이벤트 빈도. 기후=EWMA(λ→0)·HAR(계수 0) 특수형
  - ewma_logit           # 현재 상태(VIX 레벨·EWMA vol)의 로지스틱 — λ 사전등록 격자
  - har_logistic         # Corsi 2009 HAR-RV(1/5/22일) 로지스틱
  - garch_t_sim          # GARCH(1,1)-t 시뮬레이션 터치확률

# 게이트 — 결과 보기 전 형(form) 고정. 임계 magnitude 아닌 CI 형태.
gate:
  primary: 각 rung(≠기후)이 기후 대비 쌍대 Brier 손실차 CI90 하한 > 0 (엄격부등호)
  bidirectional_transfer: early(2007-2010) <-> late(2011-2014) 두 방향 모두 CI90 하한 > 0
  reliability: Murphy 신뢰도 분해(rel/res/unc) + 신뢰도 곡선 보고 의무(판정 다리 아님)
  scoring: [brier, log_score]
  uncertainty:
    bootstrap: stationary_block
    block_length: 13
    replicates: 2000
    seed: 20260907
    interval: [5, 95]
  mde: 모든 셀에 MDE=1.645·bootstrap_se 병기. |Δ|<MDE 는 '결정적 증거 없음'.
  negative_control:
    # T-A 교훈: p-순열 귀무는 누수. 사건 라벨(y) 블록순열 = 건전 귀무를 쓴다.
    null: y-block-permutation (ℓ=13) — 이벤트 라벨을 블록 순열해 스킬 통과율 측정
    threshold: 통과율 <= 0.10. 초과 시 그 rung 의 채택 무효.
  multiplicity: family P(k>=k_obs) <= 0.05 병기.

split:
  early: ['2007-01-01', '2010-12-31']
  late: ['2011-01-01', '2014-12-31']

development_protocol:
  track_open: true             # V13-D1 사용자 승인(2026-09-07)
  maximum_development_evaluations: 8
  evaluations_spent: 5         # rung-1 ewma_logit · rung-2 har_logistic · rung-3 persistence_pb · rung-4 macro_blocks · rung-5 shape_blocks — 원장 5행 대사
  experiment_ledger: data/timeseries_v13/ledgers/vol_experiments.jsonl
  ledger_append_only: true
  preregistered_before_results: true
  five_role_inheritance: true  # base_rate·outside_view·premortem·devils_advocate·resolution 승계
  pit_inheritance: true
  # [V13-D2′ A4] 홀드아웃 finalist 예산·경로 — V9/V10 development_protocol 승계 (외부 검토 §C-2 ④ '3슬롯 중 1')
  holdout_maximum_finalists: 3
  holdout_finalists_preregistered: [V13VOL_champion]   # 지금 소모 가능한 finalist 는 이것 하나. 추가는 결과 전 개정으로만.
  holdout_single_scoring_per_finalist: true
  holdout_requires_explicit_user_approval: true
  holdout_execution_path: named_verb_guarded            # [V13-D3 2026-09-09] 승인 원문 수신 후 개정 — verb: timeseries-v13-vol-holdout (영수증 없이는 데이터 읽기 전 거부)
  holdout_ledger: data/timeseries_v13/ledgers/holdout_scorings.jsonl
  approvals_ledger: data/timeseries_v13/ledgers/approvals.jsonl

stopping_points:
  holdout:
    window: ['2015-01-01', '2018-12-31']
    requires_explicit_user_approval: true
    execution_path: named_verb_guarded    # [V13-D3 2026-09-09] 개정 — 게이트 산술·창·finalist 는 무변경
    consumption: champion 당 1회, 자동 소모 금지
    # [V13-D2′ A3] 절차·게이트 사전등록 (외부 검토 D-1) — 홀드아웃 열람 전 커밋. 아래는 전부 구체화·강화, 완화 0.
    procedure: 사전등록 커밋 → 사용자 승인 원문(literal 'V13-D3' + 승인 + 정확한 finalist_id) → approvals.jsonl receipt → 계약 execution_path 개정 커밋 → verb 1회 실행 → 결과 무관 holdout_scorings.jsonl append → DECISIONS. 자동화(cron·루프) 밖.
    finalist: gates.champion.finalist_id — HOLD 셀 제외 champion 표 1개
    model_source: frozen_coefficients artifact(설계창 2007-2014 전체 1회 적합, sha256 핀) — verb 는 재적합하지 않는다
    origins: 2015-01-01 <= origin <= 2018-12-31 AND label-complete(origin + h 영업일 <= 2018-12-31). 패널 observation_time <= 2018-12-31 절단 — 봉인창(2019+) 바이트 미열람.
    probabilities_scored: 파생층 그대로 — h5/h21 raw, h63 = reliability.cross_fit_isotonic_h63.fallback 적용 결과(iso 또는 raw)
    climatology: climatology_base_rates 고정값(설계창)
    gate:
      G1_vs_climatology: 쌍대 Brier(clim − champ) CI90 하한 > 0 (엄격)
      G2_not_inferior_to_pb: 쌍대 Brier(PB − champ) CI90 상단 >= 0 — '유의 열위 아님'. champion=persistence_pb 셀은 항등 통과. PB 도 frozen artifact 의 설계창 적합(baseline_pb).
      G3_reliability_report: Murphy(rel/res/unc) + 신뢰도 곡선(raw·iso) 보고 의무 — 판정 다리 아님
      G4_negative_control: 홀드아웃 y-block(ℓ=13) 순열, 모형 고정(재적합 없음), G1 통과율 <= 0.10
      pass_rule: 셀별 PASS = G1 AND G2 AND G4 (G3 보고). family P(k >= k_obs) <= 0.05 병기.
    hold_condition: C-1 결과 finalist 표가 비면(전 셀 HOLD) 소모하지 않는다 (외부 검토 §C-2 '보류가 옳은 경우').
    ledger_append: PASS/FAIL 무관 append — holdout_user_approval 원문 · approval_receipt_id · coefficients_sha256 · contract_hash · git_head
    wiring_eligibility: |
      PASS 셀만 (V13-D6). 홀드아웃 FAIL 셀은 배선 불가이며 라이브 카드에서도 숫자 대신 '홀드아웃 실패' 로
      페일클로즈(소모 후 적용). [P0 2026-09-09 강화] degeneracy_guard 의 episode_thin 셀은 PASS 여도 배선 불가.
    degeneracy_guard_applied: true    # 실행 시점 계산 — 사건 수 미달은 채점 제외, 국면 수 미달은 episode_thin 라벨
  sealed:
    window: ['2019-01-01', 'latest']
    requires_explicit_user_approval: true
    execution_path: absent_by_construction
  champion_action: champion 발견 시 루프 정지·사용자 질문(홀드아웃 자동 진입 금지)

prohibitions:
  automatic_holdout_consumption: true
  automatic_sealed_disclosure: true
  gate_threshold_relaxation: true
  outer_window_reuse_after_results: true
  null_redesign_after_results: true
  post_hoc_target_addition: true      # K·θ·h 는 이 문서로 고정, 사후 추가 금지
  p_permutation_null_as_negative_control: true   # T-A 에서 누수 확인 — 사용 금지
  secret_loading_in_loops: true
  backtest_of_llm_questions: true
  mutate_v8_v2: true
  push_without_success: true          # 성공(게이트 통과) 전 push 금지 (사용자 규율)
  # [V13-D2′ A5] 신설 3건
  champion_on_climatology_alone: true # D-2 자명 기준선 규칙 — 지속 계열 표적은 당일 수준 단독 기준선(PB) 대비 판정 없이 champion 선언 금지
  holdout_refit: true                 # 홀드아웃 verb 재적합 금지 — frozen artifact 만
  sealed_bytes_in_holdout_panel: true # 홀드아웃 패널에 2019+ 관측 미열람

known_limits:
  - design 창 GFC 지배 → early(2007-2010) 반이 위기, 전이 검정이 위기↔평온 성격(V10~V12 공통 한계).
  - RV theta=design 중앙값은 in-sample 기준 — 사전등록 고정이나 창 의존.
  - GARCH-t 적합은 수렴·초기값 의존 caveat.
  - 홀드아웃 2015-2018·봉인 2019+ 미열람(의도적 보존).
  - 80% 대역(band80)은 계수 불확실성(델타법)만 반영 — 보정 대역이 아니다. h63 셀 신뢰도 rel≈0.08(설계창) 오보정.
  - '[P0 2026-09-09] 9셀 중 6셀이 국면 가드 미달 — vix30 계열 후반창은 2011년 단일 변동성 국면에 얹혀 있다(vix30_h21·vix30_h63은 국면 1개). 사건 수(최소 27)는 전부 통과하므로 사건 수만 보면 이 취약성이 보이지 않는다. 깨끗한 셀은 vix25_h5·rv_h5·rv_h21 셋뿐.'

# ── [V13-D2′ 사전등록 개정 2026-09-08 — 홀드아웃 열람 전 · 완화 0 · 결과 전 커밋] ──
# 외부 검토(CAMPAIGN_REVIEW_NEXT_DESIGN_260908 §C-1·C-2·D-1~D-3) 채택. 원문 gate:(사전등록 형) 은 1바이트도 바꾸지 않는다.

# [A1] 자명 기준선 — 지속 계열 표적에는 기후 외에 '당일 수준 단독' 기준선을 필수 등록 (D-2)
baselines:
  persistence_pb:
    id: persistence_pb
    definition: logit(P | 당일 수준 단독) — vix 셀 = 표준화 VIX_t 1피처, rv 셀 = 표준화 RV21_t 1피처 (절편 포함).
    fitter: tools/v13_vol_run._logit_fit 동일 (zscore ddof0 · Newton 200 · l2 1e-3) — ewma_logit 과 같은 적합기.
    fit_window: research_train = 전이 방향별 fit 창(early 또는 late), 기후와 동일.
    nested_in: ewma_logit          # ewma_logit=[x_t, EWMA21(x_t)] ⊃ PB=[x_t]
    role: 자명 기준선 (D-2) — 지속 계열 표적은 기후 대비 통과만으로 champion 선언 금지.
    registered_before_results: true

# [A1] 개정기 추가 게이트 — 원문 gate: 은 무수정. 신규 키는 여기.
gates:
  armed: true                         # [V13-D4 2026-09-08] T2 진입 시 전환 — 게이트 산술·규칙 0바이트 변경(결과 후 임계 무변경)
  evaluated_candidates: 3             # rung-1 ewma_logit · rung-2 har_logistic · rung-3 persistence_pb (원장 3행 대사)
  design_evidence:
    ewma_logit:
      path: data/timeseries_v13/vol/ladder_ewma_logit.json
      sha256: bf91a1d3cd4a8d9ef6d84a9e658293cf5fe9cbbd3f2d5fd5b870d90431ed1ab0
      ledger_content_hash: 89259485da66b488755dd85dd041148af990ff09d018ac712341207fe1e798b3
      verdict: 기후 대비 9/9 양방향 CI90 하한>0 · 건전 y-block 귀무 0.000~0.017
    har_logistic:
      path: data/timeseries_v13/vol/ladder_har_logit.json
      sha256: 23f0209c1fd0c2d3746fed5d1d239ab252133e1108a0a55b8a380f764486cf3a
      ledger_content_hash: 8e721d6d0daba1d72d2216fd1268c42c6be3a2b4ca9d98ed5969d82230822c6a
      verdict: 기후 대비 9/9 통과하나 EWMA 대비 증분 0/9 — 스킬은 지속성 지배
    persistence_pb:                   # [C-1 결과 기록 2026-09-08 — 규칙 무변경, 값만 기입]
      path: data/timeseries_v13/vol/ladder_pb_baseline.json
      sha256: 71c92648af96fa8d37a8e1f5a0a47e1aa470ce245534b1b558fe7d64dc65c973
      ledger_content_hash: b95b919eab5396262e3e16e5400559be2c48191eeb543a8f393c496f37ddc234
      verdict: PB 기후 대비 9/9 양방향 CI90 하한>0 · 귀무 0.000~0.033. EWMA 는 PB 대비 양방향 우세 0/9(h63 두 셀 한 방향 유의 열위) → G2 (b) champion=persistence_pb 전 9셀. h63 isotonic 은 fallback(raw)
  G2_champion_vs_persistence_pb:
    metric: 쌍대 Brier 손실차 d_t = BS_PB,t − BS_EWMA,t (양수 = EWMA 우세)
    directions: [early_to_late, late_to_early]
    uncertainty: gate.uncertainty 동일 (stationary block ℓ=13 · B=2000 · seed 20260907 · [5,95])
    rule: |
      셀별 판정.
      (a) ewma_beats_pb: 두 방향 모두 CI90 하한 > 0 (엄격) AND 증분 y-block 귀무 통과율 <= 0.10 → champion = ewma_logit.
      (b) 아니면 PB 가 gate.primary(기후 대비 CI90 하한 > 0 양방향) AND PB y-block 귀무 <= 0.10 → champion = persistence_pb (더 단순한 모형 우선).
      (c) 아니면 HOLD — 정보가 '자명'을 넘지 못함. HOLD 셀은 finalist 표에서 제외.
    why_this_form: |
      중첩 모형(PB ⊂ EWMA)이라 동률은 단순 모형의 것이다. 비열화 마진 δ>0 은 임계 magnitude(gate 주석 '임계 magnitude 아닌 CI 형태' 위반)이고
      δ=MDE 는 CI90 하한 > −1.645·se ⇔ 점추정 > 0 으로 퇴화(부호검정)한다. 설계창 champion 선택은 '우월-아니면-단순-아니면-HOLD' CI 형으로만 한다.
      외부 검토 §C-1 '못 이기면 PB=champion' 과 일치. 홀드아웃의 '비열화'(stopping_points.holdout.gate.G2_not_inferior_to_pb) 는 별도 정의(CI90 상단 >= 0).
    negative_control: y-block(ℓ=13) 순열 — (a) 는 EWMA-vs-PB 증분 양방향 채택률, (b) 는 PB-vs-기후 양방향 채택률. 임계 0.10 (gate.negative_control 승계).
    multiplicity: family P(k >= k_obs) 병기 (binomial(9, 0.05) 참고값 — 셀 종속 caveat).
    evaluation_budget: 1              # rung-3 → evaluations_spent 2→3
    backtest_windows_opened: 0        # 설계창 원장 재분석만 — 새 창 0
  champion:                           # [C-1 결과 기록 2026-09-08] G2 규칙 (b) 기계 적용 — EWMA 양방향 우세 0/9, PB 기후 통과 9/9
    decided_at: '2026-09-08'
    decided_by_rule: gates.G2_champion_vs_persistence_pb (b) — 결과 전 고정, 사후 변경 0
    source_content_hash: b95b919eab5396262e3e16e5400559be2c48191eeb543a8f393c496f37ddc234   # vol_experiments.jsonl 행 V13VOL_pb_baseline
    cells:
      vix25_h5: persistence_pb
      vix25_h21: persistence_pb
      vix25_h63: persistence_pb
      vix30_h5: persistence_pb
      vix30_h21: persistence_pb
      vix30_h63: persistence_pb
      rv_h5: persistence_pb
      rv_h21: persistence_pb
      rv_h63: persistence_pb
    hold_cells: []
    finalist_id: V13VOL_champion_aec80c65038b
    skill_label: 당일 변동성 수준의 지속 (persistence of the same-day level) — EWMA 평활 증분 없음
    h63_derived_layer: {vix25_h63: raw, vix30_h63: raw, rv_h63: raw}   # isotonic 사전등록 fallback 발동(iso 유의 열위)

# [P0 2026-09-09] 퇴화·국면 가드 — 유효 표본의 정직한 척도. 사전등록 게이트를 바꾸지 않는다.
degeneracy_guard:
  registered: '2026-09-09'
  measured_by: tools/v13_guard_mde.py → data/timeseries_v13/vol/guard_mde_design.json
  provenance: |
    임계 min_episodes=5 는 설계창을 실측한 뒤 정한 값이다 — 숨기지 않고 공시한다. 그래서 이 값의 사용처를
    엄격히 제한한다: (a) 이미 실행된 rung 판정과 gate.primary·stopping_points.holdout.gate 는 소급 변경하지
    않는다(결과 후 문턱 교체 금지), (b) 홀드아웃 창에서 '채점 자체가 불가능한 셀'의 제외와 (c) 표시·배선
    자격 제한에만 쓴다. 즉 게이트를 느슨하게 하는 방향으로는 절대 쓰이지 않는다.
  rules:
    min_events_per_half_per_class: 20        # 필요조건 — 설계창은 9/9 통과(최소 27)라 구속력이 없었다
    min_episodes_per_half_per_class: 5       # 실질 구속 — 설계창 6/9 실패
    episode_definition: |
      라벨의 연속 구간(run) 수. 라벨은 h영업일 전방창으로 만들어 이웃 원점이 강하게 겹치므로 사건 '개수'는
      유효 표본을 과대평가한다. 독립 국면 수가 진짜 자유도다.
  applied_at:
    design_window: 공시 전용 (소급 판정 변경 없음)
    holdout_window: |
      verb 실행 시점에 계산한다 — 사전 점검은 홀드아웃 미열람 위반이다. 사건 수 미달 셀은
      untestable_by_construction 으로 원장에 기록하고 채점·family 분모에서 제외한다(페일클로즈).
      국면 수 미달 셀은 채점하되 episode_thin 라벨을 붙인다.
  consequences:
    display: episode_thin 셀은 라이브 카드에 '국면 표본 얇음' 마커 상시 (h63 '보정 약함'과 같은 층위)
    wiring: episode_thin 셀은 홀드아웃 PASS 여도 V13-D6 배선 불가 — wiring_eligibility 강화
  design_window_result:
    counts_failures: []
    episode_failures: [vix25_h21, vix25_h63, vix30_h5, vix30_h21, vix30_h63, rv_h63]
    worst_cases: |
      vix30_h21 후반창 사건 109개 = 1국면(2011-07-06~2011-12-07) · vix30_h63 후반창 151개 = 1국면
      (2011-05-05~2011-12-07) · vix30_h5 후반창 = 2 run(같은 2011 국면) · rv_h63 전반창 비사건 27개 = 1구간.
      즉 vix30 계열의 후반창 판정은 '2011년 미국 신용등급 강등·유로 위기'라는 단일 사건에 얹혀 있다.
    clean_cells: [vix25_h5, rv_h5, rv_h21]

# [P4 사전등록 2026-09-09 — 결과 전 커밋] 봉인 아카이브 내 신규 피처블록 (rung-4)
# 새 데이터 적재 0·비용 0·라이선스 위험 0. 표적(K·θ·h)은 그대로 — post_hoc_target_addition 금지 준수.
rung4_macro_blocks:
  registered: '2026-09-09'
  rationale: |
    V9 가 이 계열들을 시험했으나 표적이 '가격 분포(CRPS)'였다. 여기 표적은 '변동성 사건(Brier)'이며 손실함수도
    다르므로 미시험 조합이다. 다만 V9 의 무효익은 약한 부정 사전확률을 준다 — 기대 부정 종료 75%.
  series_added_for_this_rung: [DGS2, DGS10, DTWEXBGS, FED_EBP]   # 전부 봉인 V2 아카이브 보유. 적재·수집 0
  cells: 전체 9셀 — 홀드아웃 결과로 셀을 고르지 않는다(홀드아웃 정보가 새 설계창 시험에 새면 다음 홀드아웃이 오염된다)
  baseline: persistence_pb (현 champion). 후보 = logit[PB 피처 + β·F_k] — 피처당 파라미터 1개 추가
  blocks:
    F1_term_spread:
      definition: DGS10 − DGS2 (수준), 관측일 기준
      pit_grade: archive_verified          # 과거 행의 available_at 이 당일 22:00 UTC = H.15 발행 후. 실측 확인
      lag_sessions: 0
    F2_dollar:
      definition: DTWEXBGS 21세션 로그변화율
      pit_grade: assumed_lag               # available_at 이 2026 수집 시각이라 PIT 증거 없음
      lag_sessions: 10                     # 실측 발행 간격(약 2주)을 덮는 보수적 지연. 채택 시 PIT 확인 후에만 배선
    F3_ebp:
      definition: FED_EBP 수준(월간)
      pit_grade: assumed_lag
      lag_sessions: 42                     # 약 2개월 — 월간 발행 + 공표 지연을 덮는 보수적 지연
  gate:
    per_cell: 쌍대 Brier(PB − 후보) 양방향 CI90 하한 > 0 (엄격) AND 증분 y-block(ℓ=13) 귀무 통과율 <= 0.10
    family: binomial P(k >= k_obs | n=27, p=0.05) <= 0.05 병기 — 셀 종속 caveat 유지
    uncertainty: gate.uncertainty 동일 (stationary block ℓ=13 · B=2000 · seed 20260907 · [5,95])
    degeneracy: degeneracy_guard 적용 — 국면 미달 셀의 채택은 episode_thin 라벨을 달고 배선 불가
  evaluation_budget: 1                     # evaluations_spent 3→4 (최대 8)
  backtest_windows_opened: 0               # 설계창 재분석만 — 홀드아웃·봉인 미열람
  result: 27검정 전부 measured_zero — 채택 0건, family P(k>=0|n=27)=1.0000 (2026-09-09). 무료 정보집합 소진
  stopping: 전 셀 '측정된 영'(MDE 미만) 이면 정상 종료. 채택 셀이 나오면 champion 재판정은 별도 결정
  prereg_commit: 0ce8569b                  # 결과 전 커밋 (병렬 세션의 브랜치 전환으로 원커밋 7a868424 를 clean 브랜치에 cherry-pick — 내용 동일)

# [A2] h63 오보정 셀의 파생 확률층 — 게이트 판정은 raw 확률로, 파생층만 보정. V8 무접촉.
reliability:
  cross_fit_isotonic_h63:
    applies_to: [vix25_h63, vix30_h63, rv_h63]     # 설계창 rel≈0.08 셀만. h5/h21 은 raw 유지(rel≈0.002)
    layer: derived_probability_only                 # G2·기후 게이트는 raw 확률로 판정
    method: |
      fit 창을 시간순 k=5 연속 블록으로 나눈다. fold j 의 OOF 확률 = 나머지 블록으로 적합한 로짓의 예측.
      경계 embargo = h origins 양측(라벨 지평 중첩 누수 차단). PAV(비감소 step, 가중=빈도) 를 (p_oof, y) 에 적합.
      적용 = fit 창 전체 적합 모형의 eval 예측에 step map, clip [1e-6, 1−1e-6].
    report: Murphy(rel/res/unc) raw vs iso · 신뢰도 곡선 · 쌍대 Brier(raw − iso) 양방향 CI90.
    fallback_rule_preregistered: 설계창 어느 방향이든 (BS_raw − BS_iso) CI90 상단 < 0 (iso 유의 열위) 이면 그 셀 파생층은 raw 유지. 그 외 iso.
    gate_bridge: false

# [A7] 라이브 표시 계층 사전등록 — 표시 설계서 docs/design/v13_vol_live_card_display_design_260908.md §3 승계 + 정정 2건
live_display:
  pointer: data/timeseries_v13/vol/vol_latest.json      # 라이브 CLI 가 쓰는 커밋 포인터 (V8 multivariate_v8_latest.json 패턴)
  ledger: data/timeseries_v13/ledgers/vol_live.jsonl
  read_model_key: timeseries_v13_vol                     # 전용 키 — 'timeseries' 슬롯 재사용 금지
  payload_budget_bytes: 24000
  freshness:
    rule: nyse_trading_calendar                          # 정정: 설계서 '1영업일 초과' 를 거래일 달력으로 구체화 (주말·연휴·화~토 refresh 정직 처리)
    max_missing_sessions: 1
  band80:
    method: delta_method_block_bootstrap_cov             # 정정: 사다리 json 의 se 는 손실차 se — P 의 se 가 아니므로 사용 금지
