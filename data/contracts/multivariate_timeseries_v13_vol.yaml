  episode_thin_cells: [vix25_h21, vix25_h63, vix30_h5, vix30_h21, vix30_h63, rv_h63]   # degeneracy_guard 실측 — '▲ 국면 표본 얇음' 마커
  reference_question: {id: vix-25-90d, horizon_calendar_days: 90, cell: vix25_h63, divergence_threshold_pp: 15, action: display_only}
  x1_name_collision_rule: 표시 설계서 §1.2 6항 — 명칭·출처 배지·지평 단위·caveat lead·역할 관계·결합 금지

# [A7] 동결 계수 — Phase C(champion 확정 뒤) 에서 채운다. 이름 정정: 설계서 §3 'ewma_logit_coefficients.json' → champion 중립 이름(셀별 champion 이 다를 수 있음)
frozen_coefficients:
  path: data/timeseries_v13/vol/champion_coefficients.json
  sha256: 1a85785056738775f732531dc442616908e20ca0f356187eb5fd1adb614b3ac1
  content_hash: 1fdeb1364ea7eba01a1f420eebba0ad53c8339ae8be4c877c9affe0bd91e23f4
  finalist_id: V13VOL_champion_aec80c65038b                    # gates.champion.finalist_id 와 일치해야 한다
  refit_prohibited: true
  fit_window: ['2007-01-01', '2014-12-31']               # 설계창 전체 1회 적합 (반창 재적합 대사 ≤1e-6 필수)

# 표시 사다리 위치 — T2/T3 전환은 이 한 줄 + amendment 로만 (코드 변경 0). T4 는 값 자체가 없다.
publication:
  display_tier: t3_live_card                             # [V13-D5 2026-09-08] T3 라이브 카드 — T2 X1 6항 검수(1400/620/375) 통과 뒤 전환. 홀드아웃 전이라 caveat 굵게(읽기모델 가드 강제)
  display_tiers_allowed: [t0_internal, t2_hidden_panel, t3_live_card]
