# V14 조건부 전이 트랙 — 사전등록 계약 초안 (draft)
#
# 이 파일은 draft 다. 개시는 사용자 결정(V14-D0)이며 계약 자체가 승인이 아니다.
# 검정 0회·라벨 계산 0회로 작성됐다 — 홀드아웃(2015-2018)·봉인(2019+) 바이트 미열람,
# 설계창(2007-2014)의 조건부 국면 수·기저율도 측정하지 않았다(V14 설계도 §7-5: 측정 후
# 창·문턱 선택 금지 — P0 실측은 track_open 승인 뒤).
#
# 계보: V13-VOL(`multivariate_timeseries_v13_vol.yaml`)의 자식 트랙. V13 계약·원장·동결
# 계수는 1바이트도 수정하지 않는다. 골격은 블루프린트 §4(신규 트랙 계약 골격)를 복사하되
# '[정정]' 주석을 전부 준수했다(campaign_prior_tests 단위 명시·family_p_binomial·PIT 등급·
# 라이선스 pending 시 공개 payload 금지·미구현 도구 미기재).
#
# 모든 산출은 참고 의견이며 매매 신호가 아니다. P3 게이트(해소 50문항+ · Brier < 0.18) 전에는
# 어떤 값도 실전 자금 결정의 단독 근거가 아니다. 결정론 수치 모델의 설계창 적합은 CLAUDE.md
# 5원칙 명문화 예외(dualdb §8 · DECISIONS 8-6)에 해당하나, 하이퍼파라미터(문턱·창·분할)가
# 정점 지식을 간접 내포할 수 있다는 caveat 를 이 계약 전체에 유지한다.

