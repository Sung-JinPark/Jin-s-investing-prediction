character: |
  CLAUDE.md 1차 목표(EXIT 트리거 이벤트 확률화)의 조기경보 층위. V13-VOL 81검정(rung-2~6)이
  "후보 열이 무엇이든 당일 변동성 수준의 재측정" 이라는 공통 실패 양식을 보인 뒤, 정보집합이 아니라
  **표적의 형태**를 바꾸는 유일한 근거 있는 축(V14 설계도 §4.4 C1)이다. 무조건부 P(VIX≥25 in h) 대신
  "지금 조용한데(VIX_t<20) h 안에 하드룰 25 가 발동할 확률" 을 묻는다. 조건부 부분집합 안에서는
  당일 수준의 분산이 크게 줄어 `persistence_pb` 가 자명성을 잃으므로, 처음으로 "지속성 말고 무엇이
  있는가" 가 실제 질문이 된다. 새 데이터·새 창·봉인 개방·구매를 전부 요구하지 않는다.

