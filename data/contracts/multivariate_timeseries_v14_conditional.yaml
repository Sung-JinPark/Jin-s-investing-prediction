      A1-1: status draft_prereg→prereg · development_protocol.track_open false→true · ledgers_created true · 레지스트리 등록. (전환)
      A1-2: decisions_pending D0..D9 → decisions_resolved (초안이 값으로 미리 넣은 권고안이 그대로 효력을 얻는다 — 값 변경 0). (해소)
      A1-3: 파일명 .draft 제거. (개명)
