# 표적 — V8 과 같다. 판정 basis 만 XNAS 로 고정한다(모든 팔·A0 공통).
target:
  series_id: NASDAQCOM
  asset: NASDAQ Composite
  transform: daily_log_return
  probability_space: v8_log_return_h
  horizons_sessions: [1, 5, 21, 63]
  verdict_horizons_sessions: [5, 21, 63]
  h1_policy: 보고만 — V8 발행 구조상 h1 목표 세션이 발행 전에 실현된다(12/12 post_dated). A5 가 발행 시점을 바꾼 뒤에도 h1 은 판정 가족에 넣지 않는다.
  label_basis: xnas_v1
  label_definition: y = ln(P_{s_h}/P_o), s_h = 원점 o 다음 h번째 XNAS 세션, P = NASDAQCOM 종가(최신 개정, XNAS 세션 행만)
  calendar_source: ai_fc.mts_research.sessions (exchange_calendars XNAS) — 아카이브 날짜를 달력으로 쓰지 않는다
  grid: 200분위 (V8 저장 grid 규약 그대로)
  score: CRPS = mean|X−y| − ½·mean|X−X′| (저장소 sample_crps, 저장 grid 에 그대로 적용)
  origin_frequency: weekly — 동결 V8 섀도와 같은 원점(같은 주의 마지막 완료 세션)

