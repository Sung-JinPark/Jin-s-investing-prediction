# 팔 — 축마다 단일 변경. 각 팔은 A0 대비 정확히 한 축만 바꾼다. 결합 팔은 없다.
arms:
  A0:
    name: v8_identity_control
    change: none
    formula: V8 비트 동일 — 같은 원점에서 동결 V8 섀도 grid 와 |Δ| ≤ 1e-12
    identity_tolerance: 1.0e-12
    on_identity_failure: 트랙 정지 — 어떤 팔도 채점하지 않는다
    defect_ref: []
  A1:
    name: fresh_vol
    change: 원점일 수익을 포함한 분산으로 투영
    formula: σ²_{T+1|T} = λ·σ²_{T|T−1} + (1−λ)·e_T² (VARX 잔차·FHS 수익 모두)
    defect_ref: [D4]
    priority: 1
  A2:
    name: lambda_mix
    change: λ argmin 선택 제거
    variants:
      A2a:
        formula: σ² = ½·σ²_{λ=0.94} + ½·σ²_{λ=0.97} (고정 동일가중 — 학습 아님)
      A2b:
        formula: 공통 난수(CRN) 후보 평가 + 히스테리시스(1·2위 마진 > 1 MC SD 일 때만 전환, 아니면 직전 설정 유지)
    variant_choice: 등록 전 사용자 결정(U3) — 하나만 등록하면 가족 크기가 줄어든다
    defect_ref: [D5]
    priority: 1
  A3:
    name: xnas_label
    change: 학습·라벨을 XNAS 달력으로 — dropna(how=any) 금지, 금리·달러 휴장일은 0변화 이월하고 플래그
    formula: y = ln(P_{s_h}/P_o)
    defect_ref: [D1, D3]
    priority: 1
  A4:
    name: vix_align
    change: VIX 를 XNAS 세션으로 거른 뒤 차분
    formula: vix_change_t = ln VIX_t − ln VIX_{prev XNAS session} (교집합 세션)
    defect_ref: [D6]
    priority: 1
  A5:
    name: issuance
    change: 발행 시점 — DTWEXBGS as-of 캐리, 금요일 원점을 월 09:30 ET 전에 발행, F04 발행 마감 강제(mts_research artifacts.assert 경로)
    formula: 모델 수식 무변경, 입력 as-of·발행 시각만 변경
    defect_ref: [D2, D3]
    priority: 2
  A6:
    name: b4_variant
    change: B4 PIT 재보정 변형
    formula: u*(q) = q + s·[(Q̂(q) − Q̂(0.5)) − (q − 0.5)]
    variants:
      A6a: {description: B4 off (s=0)}
      A6b: {description: 롤링 260원점 맵}
      A6c: {description: 폭 전용(위치 성분 제거)}
    variant_choice: 등록 전 사용자 결정(U3)
    defect_ref: [D7]
    priority: 3
    unverified_hypothesis: "'B4 가 h21 열세의 2/3 를 설명' 은 미검증 가설이다(하락 에피소드 1개, n_eff≈3). 이 팔의 근거로 인용하지 않는다."
  A7:
    name: h1_h5_location_neutral
    change: h1/h5 위치를 μ̂·h 로 중립화, 형태 유지(B2 omega>0)
    formula: grid − q50 + μ̂·h
    defect_ref: [D7]
    priority: 3

priority_order: [[A1, A3, A4, A2], [A5], [A6, A7]]

combination:
  allowed: false
  rule: 팔끼리, 또는 팔과 V8 을 산술 결합(평균·가중)하지 않는다. 승격 후보도 단일 팔이다.

# 판정 규칙 — 등록 시 고정. 결과를 본 뒤 바꾸지 않는다(바꾸면 새 계약).
verdict_rule:
  basis: xnas_v1 (모든 팔·A0 공통). grid basis 와 한 평균에 섞지 않는다.
  statistic: 원점별 쌍대 차 d_o = CRPS_arm(o) − CRPS_A0(o), 지평별 평균 d̄_h = Σ_o d_o / n_h (절대 CRPS 단위)
  pairing:
    common_random_numbers: required
    rule: 모든 팔은 같은 원점에서 A0 와 같은 RNG 스트림(같은 시드 유도·같은 추첨 수·같은 추첨 순서)을 쓴다. MC 잡음이 d_o 에 들어가지 않게 하려는 것이다(CRN 부재 자체가 결함 D5). A2b 의 후보 평가도 이 스트림을 공유한다.
    on_violation: 그 팔의 모든 비교는 insufficient — 채점하지 않는다
  # 지평별 최소 원점 — n_h ≥ max(26, 3·ℓ_h). 3·ℓ_h 는 서로 겹치지 않는 블록이 최소 3개 나오게 하는 하한이다.
  # 26원점에서 h63(ℓ=13)은 floor(26/13)=2 블록뿐이라 독립 에피소드 ≥ 3 을 원천적으로 못 채우므로 39 로 둔다.
  minimum_matured_origins_by_horizon: {'5': 26, '21': 26, '63': 39}
  minimum_rule: n_h ≥ max(26, 3·ℓ_h) 이고 K_h = floor(n_h/ℓ_h) ≥ 3
  n_to_block_ratio_at_minimum: {'5': 13, '21': 5, '63': 3}
  bootstrap:
    kind: moving_block_over_origins
    block_length_origins_by_horizon: {'5': 2, '21': 5, '63': 13}
    block_length_rule: ℓ_h = max(2, ceil(h/5)) — 겹치는 목표 창(주간 원점)을 덮는다
    resample_rule: 시작 위치를 {1, …, n_h−ℓ_h+1} 에서 균등 복원추출해 b_h = ceil(n_h/ℓ_h) 개 블록을 원점 순서대로 이어 붙이고 앞에서 n_h 개로 자른다. 재표본 평균 d̄*_b = 자른 n_h 개 d 의 평균
    shared_indices: 한 지평 안에서 모든 (팔 또는 변형) 비교는 같은 재표본 색인 행렬을 쓴다(쌍대 비교 간 일관)
    replicates: 5000
    seed: 20261111
    rng: numpy.random.default_rng([20261111, h]) — 지평마다 하나, 팔 순서와 무관
    ci_method: percentile — 90% CI = d̄* 의 5·95 백분위(numpy.quantile, method='linear'). 기존 P1 진단 요약(v8_xnas_label_summary bootstrap.method=percentile, cluster=origin)과 같은 계열이다
    p_value_rule: 단측 p = (1 + #{b: d̄*_b ≥ 0}) / (B + 1) — 귀무 '팔이 A0 보다 낫지 않다(d̄ ≥ 0)'. percentile CI 와 같은 분포에서 읽는다
    ties: d̄*_b 가 정확히 0 이면 ≥ 0 으로 센다(보수 쪽)
    p_floor: 1/(B+1) = 1/5001 ≈ 2.0e-4
    p_floor_check: 가족 최대 크기 28(아래 family.size_upper_bound)에서 Holm 최소 문턱 0.05/28 ≈ 1.79e-3 이 p_floor 의 약 9배다 — 재표본 수가 판정을 막지 않는다
    distinct_resample_floor: 1000
    distinct_resample_rule: 서로 다른 블록 다중집합 수 C(n_h−ℓ_h+b_h, b_h) 가 1000 미만이면 CI·p 를 내지 않고 insufficient (최소 원점에서 h63 은 C(29,3)=3654, h21 은 C(27,6)=296010, h5 는 C(37,13); 26원점 h63 이었다면 C(15,2)=105 로 미달 — 데이터와 무관한 조합 산술)
  pass_requires_all:
  - n_matured_origins_h ≥ minimum_matured_origins_by_horizon[h] 이고 K_h ≥ 3
  - 블록 부트스트랩 90% percentile CI 상한 < 0 (팔이 A0 보다 CRPS 가 낮음)
  - Holm 보정 후 단측 p < 0.05 (가족 전체, p 는 위 p_value_rule)
  - 독립 에피소드 — 첫 판정 원점부터 길이 ℓ_h 의 서로 겹치지 않는 연속 블록 K_h = floor(n_h/ℓ_h) 개(나머지 원점은 에피소드 수에서만 빼고 보고)를 만들고, d̄_block < 0 인 블록 수 ≥ max(3, floor(K_h/2)+1) (과반이면서 3 이상), 그리고 d̄_block 이 가장 작은(가장 유리한) 블록 하나의 원점을 빼고 다시 낸 d̄ < 0
  episode_requirement_at_minimum: {'5': '13블록 중 7', '21': '5블록 중 3', '63': '3블록 중 3'}
  family:
    definition: 등록된 (팔 또는 변형) × 그 팔의 affected_horizons ∩ verdict_horizons_sessions 의 모든 비교. 팔이 구조상 A0 와 같은 출력을 내는 지평은 가족에 넣지 않는다(검정력만 깎는다)
    affected_horizons:
      A1: [5, 21, 63]
      A2: [5, 21, 63]
      A3: [5, 21, 63]
      A4: [5, 21, 63]
      A5: [5, 21, 63]
      A6: null
      A7: [5]
    affected_horizons_rule: A7 은 h1/h5 위치만 바꾸므로 판정 지평은 h5 하나다. A6 는 B4 가 실제로 적용되는 지평만 넣으며, 등록 전 MDE 설계창 재생에서 전 원점 |Δ| ≤ 1e-12 로 A0 와 같은 지평을 확인해 고정한다(그 전까지 null). 다른 팔도 같은 재생에서 구조적 동일 지평이 확인되면 등록 전에 빼고 그 사실을 개정 커밋에 남긴다
    size: null
    size_upper_bound: 28
    size_upper_bound_note: A2 변형 2개·A6 변형 3개를 모두 등록하고 A6 가 세 지평 모두에 걸릴 때 — (A1·A2a·A2b·A3·A4·A5·A6a·A6b·A6c) 9 × 3 + A7 × 1 = 28
    size_note: A2·A6 변형 선택(U3)과 A6 affected_horizons 확정 뒤 확정한다. 변형을 모두 등록하면 비교 수가 늘어 Holm 문턱이 엄격해진다.
    correction: holm
    alpha: 0.05
  outcome_labels: [pass, fail, insufficient]
  insufficient_when: 어떤 지평이든 n_matured_origins_h < minimum_matured_origins_by_horizon[h], K_h < 3, 서로 다른 재표본 다중집합 < 1000, CRN 위반, 또는 독립 에피소드 조건 미달
  verdict_timing: 가족 판정은 1회 — 가족의 모든 (팔, 지평)이 지평별 최소 원점에 도달한 첫 시점(h63 의 39원점 성숙이 구속 조건)에 Holm 을 한 번에 적용한다
  no_early_stopping: 지평별 최소 원점 도달 전 중간 판정·조기 채택 금지(중간 표시는 insufficient 로만). 먼저 도달한 지평만 떼어 판정하지 않는다

# MDE — 개시 전에 설계창 결정론 재생으로 계산해 채운다. 지금은 계산 전이다.
mde:
  status: not_computed
  values_by_horizon:
    '5': null
    '21': null
    '63': null
  per_arm: null
  unit: 상대 CRPS 차 Δ_rel = Σ_o d_o / Σ_o CRPS_A0(o) = ΣCRPS_arm/ΣCRPS_A0 − 1 (비율의 합 규약 — skill = 1 − ΣCRPS_model/ΣCRPS_baseline 과 같은 꼴, 음수가 팔 우세). 절대 단위 d̄ 는 Δ_rel × mean CRPS_A0 로 함께 적는다
  method: 설계창(2007-01-01~2014-12-31) 결정론 재생에서 A0 대비 쌍대 차의 블록 부트스트랩 분포로, 지평별 최소 원점 수(minimum_matured_origins_by_horizon)·위 verdict_rule(CRN·percentile·p_value_rule·Holm 을 family.size_upper_bound 로 가정) 그대로 90% 검정력을 내는 최소 |Δ_rel| 을 지평별로 산출
  must_be_filled_before: gates.armed
  numeric_model_exception:
    basis: CLAUDE.md 5대 원칙 5 명문화된 예외(dualdb 스펙 v1.0 §8, DECISIONS 8-6)
    caveats:
    - 산출물은 MDE·base rate 참조이지 캘리브레이션 표본도, 팔 채택 근거도 아니다.
    - 블록 길이·창 선택 등 하이퍼파라미터가 이후 시점 지식을 간접 내포할 수 있다.
    - LLM 이 개입하는 어떤 평가에도 적용하지 않는다.
  reference_only: 감사 시 V8 n=12 탐지 가능 최소 열세 약 −8% (봉인 2019+ 롤링 q05 기반, skill 단위). 이 계약의 MDE 가 아니다.

data_policy:
  calendar: XNAS (exchange_calendars) — NASDAQCOM 2019-04-19·VIX 휴장일 행 등 아카이브 비세션 행은 무시하고 목록으로만 보고
  intraday_values: forbidden
  missing_close: 행을 만들지 않는다(pending)
  holiday_carry: A3 에서만 금리·달러 0변화 이월 + 플래그. 다른 팔은 V8 그대로
  network_in_tests: forbidden

# 오염 공시 — 이 설계는 라이브 결함을 본 뒤에 만들었다.
contamination:
  designed_after_live_observation: true
  observed_before_design:
  - V8 섀도 12원점·해소 29행(2026-08-14~11-06 원점), daily6m 해소 132행, V13 해소 189행, 2026-11-05 충격(나스닥 −5.68% 로그, VIX 16.61→28.18)
  - 팔의 축(A1~A7)은 이 라이브 결함에서 골랐다. 축 선택 자체가 라이브 정보에 조건부다.
  holdout_2015_2018: V8 이 1회 소모했다 — 이 트랙에서 재사용하지 않는다(바이트도 새로 열지 않는다)
  sealed_2019_plus: 준청정(V2 2019+ 점수 공개) — 판정에 쓰지 않는다
  design_window_2007_2014: 반복 열람됐다 — MDE 참조에만 쓴다
  live_window_through_audit: 2026-11-10 까지의 원점은 판정에서 제외한다 — 판정 원점은 track_open 이후 첫 원점부터
  mitigations:
  - 판정 basis·검정·가족·Holm·블록 길이·시드를 결과 전에 고정
  - 팔당 단일 변경, 결합 금지
  - 2026-11-10 이전 원점 소급 채점 금지
  - 단일 에피소드 가드(겹치지 않는 블록 과반·3 이상 음수, 최유리 블록 제거 후에도 유지, 지평별 최소 원점 ≥ 3·ℓ_h)
  - 공통 난수(CRN) 강제 — MC 잡음을 쌍대 차에서 뺀다

