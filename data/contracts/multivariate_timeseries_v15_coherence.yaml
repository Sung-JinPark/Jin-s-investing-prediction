    각 행 literal_template_match:false, approval_form:delegated_bundle_instruction, template_text(받았어야 할 결정별 리터럴 템플릿 요약 — V14 2026-10-22 선례).
    approved_at 은 도구 기록 상한 "2026-11-11T18:03:44+09:00" (= 2026-11-11T09:03:44Z). 철회 시 r2(철회) 행 append 후 계약 되돌림.
