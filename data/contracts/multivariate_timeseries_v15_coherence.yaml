combination:
  allowed: false
  rule: 팔끼리, 또는 팔과 V8 을 산술 결합(평균·가중)하지 않는다. 승격 후보도 단일 팔이다.

live:
  first_origin_not_before: '2026-11-13'      # r3 기입 — 규칙: revision_control.first_origin_not_before_rule (테스트 P17)
  pairing:
    origin: A0~A4 = V8 섀도 행 origin 그대로(번들 dates ≤ origin 절단, dates[-1]==origin 단언). A5 = 자체 원점, 같은 ISO 주 V8 원점과 같을 때만 쌍(아니면 origin_mismatch 제외)
    knowledge_cutoff: A0~A4 = V8 행 knowledge_cutoff. A5 = 발행 실행 시각
    data_snapshot: A0~A4 = `git rev-list -1 --first-parent --before=<V8 knowledge_cutoff> origin/main` 의 worktree 를 data_root 로(계약·원장·코드는 main). A5 = 실행 시 main
    seed: deterministic_seed('shadow.mf_dfm_varx_calibrated_v8', 8, origin) — 모든 팔 공통(CRN)
    label_basis: xnas_v1 — 모든 팔·A0
  catch_up_window_v8_origins: 2
  issuance_timestamps: issued_at = 원장 append 시각(UTC). A0~A4 는 V8 처럼 h1 post-dated(보고만), 입력은 V8 cutoff 고정이라 정보 누수 없음
  exclusions_outcome_blind: [a0_identity_fail, a0_missing, crn_violation, kernel_hash_drift, calendar_drift, origin_mismatch, a5_deadline_missed, gap_outside_catchup]
  catch_up_dispatch_rule: 직전 원점 따라잡기는 schedule·workflow_run 이벤트에서만. workflow_dispatch(auto)는 최신 V8 원점만
  compute_failure_retry_limit: 같은 (V8 행, 팔) 의 compute_failed attempts 2회 이상이면 더 계산하지 않는다
  run_diagnostics_recorded: [runtime_manifest, exchange_calendars_version, snapshot_method, v8_run_head_sha]
  calendar_hash_window: XNAS 세션·종가 [1995-01-01, origin + 100일] — 예측·해소 행이 각각 기록, 다르면 그 쌍은 calendar_drift 제외(health 경고만)

priority_note: 우선순위는 보고 순서일 뿐 판정 가족·α 와 무관하다.

# 판정 규칙 — r2 잠금(rule_hash_r2). 결과를 본 뒤 바꾸지 않는다(바꾸면 새 계약).
verdict_rule:
  basis: xnas_v1 (모든 팔·A0 공통). grid basis 와 한 평균에 섞지 않는다.
  statistic: 원점별 쌍대 차 d_o = CRPS_arm(o) − CRPS_A0(o), 지평별 평균 d̄_h = Σ_o d_o / n_h (절대 CRPS 단위)
  pairing:
    common_random_numbers: required
    rule: 모든 팔은 같은 원점에서 A0 와 같은 RNG 스트림(같은 시드 유도·같은 추첨 수·같은 추첨 순서)을 쓴다. MC 잡음이 d_o 에 들어가지 않게 하려는 것이다(CRN 부재 자체가 결함 D5).
    on_violation: 그 팔의 모든 비교는 insufficient — 채점하지 않는다
  minimum_matured_origins_by_horizon: {'5': 26, '21': 26, '63': 39}
  minimum_rule: n_h ≥ max(26, 3·ℓ_h) 이고 K_h = floor(n_h/ℓ_h) ≥ 3
  n_to_block_ratio_at_minimum: {'5': 13, '21': 5, '63': 3}
  bootstrap:
    kind: moving_block_over_origins
    block_length_origins_by_horizon: {'5': 2, '21': 5, '63': 13}
    block_length_rule: ℓ_h = max(2, ceil(h/5)) — 겹치는 목표 창(주간 원점)을 덮는다
    resample_rule: 시작 위치를 {1, …, n_h−ℓ_h+1} 에서 균등 복원추출해 b_h = ceil(n_h/ℓ_h) 개 블록을 원점 순서대로 이어 붙이고 앞에서 n_h 개로 자른다. 재표본 평균 d̄*_b = 자른 n_h 개 d 의 평균
    resample_clarification_r2: r1 '원점 순서대로 이어 붙이고' = 블록 내부의 원점 순서. 블록은 뽑힌 순서대로 연결 후 앞 n_h 개로 자른다(Künsch 표준) — 결과 전 명확화. 시작점 색인 = default_rng([20261111, h]).integers(0, n_h−ℓ_h+1, size=(B, b_h))
    shared_indices: 한 지평 안에서 모든 비교(두 가족 모두)는 같은 재표본 색인 행렬을 쓴다 — 색인은 (h, n_h) 의 결정론 함수라 n_h 가 같은 비교는 같은 행렬
    replicates: 5000
    seed: 20261111
    rng: numpy.random.default_rng([20261111, h]) — 지평마다 하나, 팔 순서와 무관
    ci_method: percentile — 90% CI = d̄* 의 5·95 백분위(numpy.quantile, method='linear'). 기존 P1 진단 요약(v8_xnas_label_summary bootstrap.method=percentile, cluster=origin)과 같은 계열이다
    p_value_rule: '단측 p = (1 + #{b: d̄*_b ≥ 0}) / (B + 1) — 귀무 "팔이 A0 보다 낫지 않다(d̄ ≥ 0)"'
    ties: d̄*_b 가 정확히 0 이면 ≥ 0 으로 센다(보수 쪽)
    p_floor: 1/(B+1) = 1/5001 ≈ 2.0e-4
    p_floor_check: 우월성 가족 m=12 에서 Holm 최소 문턱 0.05/12 ≈ 4.17e-3 = p_floor(≈2.0e-4)의 약 21배. NI 가족 m=3 문턱 0.0167
    distinct_resample_floor: 1000
    distinct_resample_rule: 서로 다른 블록 다중집합 수 C(n_h−ℓ_h+b_h, b_h) 가 1000 미만이면 CI·p 를 내지 않고 insufficient (최소 원점에서 h63 은 C(29,3)=3654, h21 은 C(27,6)=296010, h5 는 C(37,13); 26원점 h63 이었다면 C(15,2)=105 로 미달 — 데이터와 무관한 조합 산술)
  frozen_verdict_code_hash: '6a9526073ad0347d166ea4f9f9202dbc14196d7883dda126b42bdc53000d0eb8'
  frozen_verdict_code_hash_definition: src/ai_fc/timeseries_v15/verdict.py 한 파일의 길이접두 sha256 — 판정 행에 기록·대조, 불일치 시 판정 거부
  pair_ordering: 쌍 벡터는 원점 날짜 오름차순 정렬 후 사용(원장 추출 순서 무관). 정정 행은 컷 이내 마지막 값
  pass_requires_all:
  - n_matured_origins_h ≥ minimum_matured_origins_by_horizon[h] 이고 K_h ≥ 3
  - 블록 부트스트랩 90% percentile CI 상한 < 0 (팔이 A0 보다 CRPS 가 낮음)
  - Holm 보정 후 단측 p < 0.05 (가족 전체, p 는 위 p_value_rule)
  - 독립 에피소드 — 첫 판정 원점부터 길이 ℓ_h 의 서로 겹치지 않는 연속 블록 K_h = floor(n_h/ℓ_h) 개(나머지 원점은 에피소드 수에서만 빼고 보고)를 만들고, d̄_block < 0 인 블록 수 ≥ max(3, floor(K_h/2)+1), 그리고 d̄_block 이 가장 작은(가장 유리한) 블록 하나의 원점을 빼고 다시 낸 d̄ < 0
  episode_requirement_at_minimum: {'5': '13블록 중 7', '21': '5블록 중 3', '63': '3블록 중 3'}
  episode_blocks: 정렬 벡터의 첫 원점부터 길이 ℓ_h 의 겹치지 않는 블록 K_h 개, 꼬리 n_h − K_h·ℓ_h 원점은 에피소드 수에서만 제외(평균·부트스트랩에는 포함)·건수 보고
  label_order:
  - 'insufficient(data): n_h < 최소 원점, K_h < 3, distinct floor 미달, CRN 위반'
  - 'fail: CI 상한 ≥ 0(NI: ≥ 0.01) 또는 Holm 후 기각 실패'
  - 'insufficient(single_episode): CI·Holm 통과 뒤 에피소드 조건 미달 (우월성만 — r1 insufficient_when 승계)'
  - 'pass: 그 밖'
  holm_insufficient_rule: m 은 가족 크기로 고정. insufficient(data) 항목은 p=1(비기각)로 Holm 단계에 포함 — m 을 줄이지 않는다
  family:
    affected_horizons_rule: abolished_r2
    affected_horizons_rule_note: 초안의 설계창 재생 기반 가지치기 폐지 — 설계창 구조적 동일은 라이브 구조와 무관(A4 설계 1행 vs 라이브 33행). 크기는 아래로 고정
    superiority:
      members: '{A1,A2,A3,A4} × {5,21,63}'
      member_pairs: [[A1, 5], [A1, 21], [A1, 63], [A2, 5], [A2, 21], [A2, 63], [A3, 5], [A3, 21], [A3, 63], [A4, 5], [A4, 21], [A4, 63]]
      size: 12
      correction: holm
      alpha: 0.05
    noninferiority:
      members: '{A5} × {5,21,63}'
      member_pairs: [[A5, 5], [A5, 21], [A5, 63]]
      size: 3
      correction: holm
      alpha: 0.05
      statistic: Δ_rel = Σ_o d_o / Σ_o CRPS_A0(o); 재표본 Δ*_b = Σ d[I_b] / Σ c[I_b] (같은 색인 행렬)
      margin_rel: 0.01
      p_value_rule: 'p_NI = (1 + #{b: Δ*_b ≥ 0.01}) / (B + 1)'
      pass_requires_all: [n_h ≥ 최소 원점·K_h ≥ 3, 90% percentile CI 상한 < 0.01, Holm 후 p_NI < α, distinct_resample_floor]
      episode_requirement: 적용 안 함
      margin_rationale: A5 는 원점 주 ≤5세션 달러 정보를 포기하는 대가로 h1 을 prospective 로 만든다. 1% 상대 CRPS 는 감사 시 V8 12원점 탐지 가능 열세(약 8%)의 1/8 — 결과 전 고정
      informativeness_note: h21·h63 은 FHS(나스닥 수익만) 비중이 커 A5 와 A0 의 차이가 λ 선택 경로뿐인 원점이 많다(d≈0) — NI pass 는 정보량이 작고, 발행 시점 교정의 이득 근거로 해석하지 않는다
      rejected_alternative: 기각 시 대안은 A5 를 우월성 가족에 넣고 m=15 (0.05/15=3.3e-3 도 p_floor 의 16배) — V15-D3
    size_upper_bound: 15
    familywise_note: 두 가족 각 α=0.05 — 트랙 전체 FWER 최대 약 0.10. 다른 질문(우월 vs 비열등)이라 α 를 나누지 않고 공시(KNOWN_LIMITS 61)
  outcome_labels: [pass, fail, insufficient]
  verdict_cut:
    rule: 가족 F 별 T*_F = 해소 원장을 resolved_at 오름차순으로 훑어 F 의 모든 (팔,지평)이 data 조건(최소 원점·K≥3·distinct floor)을 처음 동시에 충족하는 해소 행의 resolved_at
    pairs_used: 쌍의 두 해소 행이 모두 resolved_at ≤ T*_F
    families_independent: true
    families_independent_note: 우월성은 A1~A4 만, NI 는 A5 만 기다린다
    deadline_cut_utc: '2028-06-30T23:59:59Z'
    deadline_rule: T*_F 미정이면 이 시각이 컷 — 도달 항목은 컷 이내 쌍으로 판정, 미도달은 insufficient
    execution_time_invariance: 판정 JSON = f(원장, 계약, verdict_code_hash). T*_F 뒤 행 추가는 결과를 바꾸지 않는다 — 판정 행의 원장 머리 해시도 컷 이내 마지막 행 기준
  verdict_timing: 가족당 1회 — 사람이 timeseries-v15-verdict --family <F> --append (T*_F 확정 또는 마감 컷 뒤에만 허용, 두 번째 append 거부). 중간 출력은 insufficient·건수·T*만(화장 수준 — 해소 원장 CRPS 는 공개, 조기 중단 방지는 T* 기계 컷이 담당)
  verdict_deadline: '2028-06-30'
  no_early_stopping: 지평별 최소 원점 도달 전 중간 판정·조기 채택 금지(중간 표시는 insufficient 로만). 먼저 도달한 지평만 떼어 판정하지 않는다

