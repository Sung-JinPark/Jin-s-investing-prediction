  expected_flags: {A4: 'design_non_representative — VIX 비XNAS 행 설계 학습구간 1개(2004-06-11) vs 라이브 34개(2022-05 이후 33)'}
  artifacts:
    replays: data/timeseries_v15/prereg/mde_replay_{A0..A5}.json
    summary: data/timeseries_v15/prereg/mde_v1.json
    summary_sha256: '06df90745a88c3b211a17dccae2f8111dee19e9e859e688e5960764bf50353bb'
    write_rule: 7파일 원자(전부 또는 없음) — 하나라도 있으면 거부
  numeric_model_exception:
    basis: CLAUDE.md 5대 원칙 5 명문화된 예외(dualdb 스펙 v1.0 §8, DECISIONS 8-6)
    caveats:
    - 산출물은 MDE·base rate 참조이지 캘리브레이션 표본도, 팔 채택 근거도 아니다.
    - 블록 길이·창 선택 등 하이퍼파라미터가 이후 시점 지식을 간접 내포할 수 있다.
    - LLM 이 개입하는 어떤 평가에도 적용하지 않는다.
    - 설계창은 GFC 포함 — 절대 MDE 과대, 상대 MDE 근사.
    - A4 는 산출 불가(설계 비대표), proxy 는 참고 — 실제 검정력을 과대 표기할 수 있다.
