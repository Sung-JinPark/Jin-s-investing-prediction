data_policy:
  calendar: XNAS (exchange_calendars) — NASDAQCOM 2019-04-19·VIX 휴장일 행 등 아카이브 비세션 행은 무시하고 목록으로만 보고
  intraday_values: forbidden
  missing_close: 행을 만들지 않는다(pending)
  holiday_carry: A3 에서만 금리·달러 0변화 이월 + 플래그. 다른 팔은 V8 그대로
  network_in_tests: forbidden

# 오염 공시 — 이 설계는 라이브 결함을 본 뒤에 만들었다.
contamination:
  designed_after_live_observation: true
  observed_before_design:
  - V8 섀도 12원점·해소 29행(2026-08-14~11-06 원점), daily6m 해소 132행, V13 해소 189행, 2026-11-05 충격(나스닥 −5.68% 로그, VIX 16.61→28.18)
  - 팔의 축(A1~A7)은 이 라이브 결함에서 골랐다. 축 선택 자체가 라이브 정보에 조건부다.
  holdout_2015_2018: V8 이 1회 소모했다 — 이 트랙에서 재사용하지 않는다(바이트도 새로 열지 않는다)
  sealed_2019_plus: 준청정(V2 2019+ 점수 공개) — 판정에 쓰지 않는다
  design_window_2007_2014: 반복 열람됐다 — MDE 참조에만 쓴다
  live_window_through_audit: 2026-11-10 까지의 원점은 판정에서 제외한다 — 판정 원점은 track_open 이후 첫 원점부터
  mitigations:
  - 판정 basis·검정·가족·Holm·블록 길이·시드를 결과 전에 고정
  - 팔당 단일 변경, 결합 금지
  - 2026-11-10 이전 원점 소급 채점 금지
  - 단일 에피소드 가드(겹치지 않는 블록 과반·3 이상 음수, 최유리 블록 제거 후에도 유지, 지평별 최소 원점 ≥ 3·ℓ_h)
  - 공통 난수(CRN) 강제 — MC 잡음을 쌍대 차에서 뺀다
  known_limits: [55, 56, 57, 58, 59, 60, 61, 62]

revision_control:
  rule_hash_scope: frozen_hash 대상 − r3_allowlist
  r3_allowlist: [mde.status, mde.values_by_horizon, mde.per_arm, mde.artifacts.summary_sha256, live.first_origin_not_before, development_protocol.track_open, gates.armed, provenance.revisions(끝 1항 추가)]
  any_other_change_after_r2: 새 계약(v16 등)과 공개 사유가 필요하다 — 설계창 MDE 재생 결과를 본 뒤의 규칙 변경을 막는다
  first_origin_not_before_rule: V8 섀도 행 knowledge_cutoff > r3 커밋 시각(UTC, committer date of the r3 merge on main) 인 첫 V8 행의 origin
  kernel_defect_after_r2: kernel 수정은 frozen_kernel_code_hash 를 바꾸고 rule_hash·MDE(write-once)를 무효화한다 — 이 계약은 status void 로 폐기하고 새 contract_id 로 재사전등록(라이브 행 0 이라 결과 전)

development_protocol:
  track_open: true
  track_open_note: r3 에서 true (영수증 V15-D0, 조건 — MDE 기입 + 가장 최근 a0_live_identity 시도 PASS)
  fork_created: true
  ledgers_created: true
  ledgers_note: approvals.jsonl 만 r2 에서 생성, 나머지는 첫 append 때
  evaluated_arms: 0
  evaluations_before_track_open: forbidden (MDE 설계창 재생은 평가가 아니다 — 판정에 쓰지 않음)
  approvals_ledger: data/timeseries_v15/ledgers/approvals.jsonl

gates:
  armed: true
  armed_note: r3 에서 true — 조건 mde 기입·가장 최근 a0_live_identity 시도 PASS·family size 확정(완료)·영수증
  armed_requires:
  - mde.status computed
  - 가장 최근 prereg/a0_live_identity_*_a<N>.json status PASS (FAIL 시도 전부 DECISIONS 공시)
  - approvals V15-D0..D4
  - rule_hash == rule_hash_r2

automation:
  cli_verbs: [timeseries-v15-plan, timeseries-v15-forecast, timeseries-v15-collect, timeseries-v15-resolve, timeseries-v15-status, timeseries-v15-verify, timeseries-v15-health, timeseries-v15-mde-replay, timeseries-v15-mde-summary, timeseries-v15-a0-identity, timeseries-v15-verdict]
  health: 커밋 뒤 별도 잡 — identity 연속 실패만 run 실패로 표면화(verify 와 분리)
  workflow: .github/workflows/v15-coherence-shadow.yml
  scheduled_task: none (로컬 예약 없음 — GitHub Actions 만)
  execution_path: present — 단 track_open false 동안 plan 은 mde_replay·a0_identity 디스패치만 허용
  verdict_automation: none — verdict verb 는 워크플로에서 호출하지 않는다
  note: 감시기(coherence-monitor·v8-live-monitor) 경보는 이 트랙의 실행·판정을 트리거하지 않는다.

promotion:
  automatic_champion: false
  inherits_from_parent: data/contracts/multivariate_timeseries_v8.yaml promotion
  minimum_shadow_sessions: 126
  explicit_owner_approval: required
  research_twins_as_evidence: forbidden — 감사 연구 쌍둥이(B4 전·위치 중립) 성적은 승격 근거가 아니다

publication:
  site_surface: none
  display_status: scoring_excluded_from_official
  notice: 참고 의견, 매매 신호 아님
  requires: 별도 표시 계약(U1 계약 mts_display_diagnostics_v1 은 V15 를 포함하지 않는다)
  metadata_exposure: 신뢰 페이지 원장 감사(ledger_registry 등록)에 V15 원장 이름·행 수·정체 상태만 노출 — CRPS·d̄·판정은 사이트에 노출하지 않는다(원장 파일 자체는 공개 저장소에 있다)

