# 팔 — 축마다 단일 변경. 각 팔은 A0 대비 정확히 한 축만 바꾼다. 결합 팔은 없다.
arms:
  A0:
    name: v8_identity_control
    change: none
    vol_mode: v8
    frame_mode: v8
    issuance_mode: v8_snapshot
    identity_tolerance: 1.0e-12
    identity_fields: [quantile_grid, baseline_quantile_grid, ensemble_weights(tol), block_length(exact), ewma_lambda(exact), recalibrated(exact), matured_pit_count(exact)]
    on_identity_failure: 그 원점의 모든 팔 excluded(a0_identity_fail) — 행은 커밋. 가장 최근 3개 V8 원점이 모두 실패하면 커밋 뒤 health 가 run 실패(ops 경보)·사람 ack, PASS 1회로 자동 해제. verify 는 무관(무결성만)
    defect_ref: []
  A1:
    name: fresh_vol
    vol_mode: fresh
    frame_mode: v8
    issuance_mode: v8_snapshot
    formula: σ²_{T+1|T} = λ·σ²_{T|T−1} + (1−λ)·e_T² — VARX 잔차 scale(latest) 와 FHS v_now
    defect_ref: [D4]
  A2:
    name: lambda_mix_fixed_half
    vol_mode: lambda_mix
    frame_mode: v8
    issuance_mode: v8_snapshot
    formula: σ²_t = ½·σ²_{t,λ=.94} + ½·σ²_{t,λ=.97} (scale 분자·분모·FHS 모두) — 선택된 λ 무시, 블록은 A0 선택 그대로
    learned: false
    defect_ref: [D5]
  A3:
    name: xnas_label
    vol_mode: v8
    frame_mode: xnas_label
    issuance_mode: v8_snapshot
    formula: 행 = XNAS 세션 ∩ NASDAQCOM 종가; 금리·달러 as-of 레벨 캐리(휴장일 0 변화, carried 플래그); dropna(how=any) 금지; 비XNAS 나스닥 행 무시(목록 보고); y = ln(P_{s_h}/P_o)
    defect_ref: [D1, D3]
  A4:
    name: vix_align
    vol_mode: v8
    frame_mode: vix_align
    issuance_mode: v8_snapshot
    formula: vix_change_t = ln VIX_t − ln VIX_{직전 XNAS 세션} (VIX 를 XNAS 세션 행으로 거른 뒤 차분); 행 집합은 A0 와 동일
    defect_ref: [D6]
  A5:
    name: issuance
    vol_mode: v8
    frame_mode: v8_dollar_tail_asof
    issuance_mode: next_open_asof
    formula: 모델 수식 무변경. knowledge_cutoff = 발행 실행 시각(월 03:40Z~), 원점 = 그 시각 마지막 완결 공통 세션, 원점 ISO 주 dollar_change = 0 (구조 규칙 apply_issuance_tail, 모든 내부 원점에 동일 적용), 발행 마감 = 원점 다음 XNAS 세션 open_utc − 300s (F04)
    defect_ref: [D2, D3]
    judged_by: noninferiority

