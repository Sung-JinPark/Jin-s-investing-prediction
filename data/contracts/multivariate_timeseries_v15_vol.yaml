v14_overlap:                       # V14 계약 무수정, V14-D10 비선점
  identical_conditioning: |
    R3·cond 의 국면 정의(vix 셀 VIX_t<20 엄격, rv 셀 RV21_t<=θ 0.1694)와 설계창(2007-2014)은 V14 조건부 기저율의
    조건(V14 계약 98·427행)·창(V14 M3)과 같다. 차이: V15 는 반창 분리 없이 pooled 빈도 하나를 쓴다.
  decision: V15VOL-D1(b) — 'U5 cond 기준선 = V14 조건부 기저율 정의'는 이 명세가 고른 것(메모 U5 는 '국면 기저율'만 정함)이며 위임 영수증 범위 안의 명시적 결정이다.
  not_v14: 이 트랙은 V14 의 estimator·champion·verb·원장을 만들지 않고 V14 모듈을 import 하지 않으며 V14-D10 을 선점하지 않는다.
  pre_observation_of_v14_live: |
    V15 라이브 cond·R3 결과는 V14 라이브 전진의 사전 관측이다. V14-D10(라이브 포인터 champion·verb) 결정 시
    이 오염을 승계 공시해야 한다 — V14 쪽 설계는 'V15 cond 라이브 성적 관측 후'가 된다.
  thin_estimate: vix25_h5 calm 기저율 0.009964 는 calm 1104 원점 중 사건 11개 — V14 가 하드룰 셀 cvix25_h5 를 설계창 검정 불가(반창 사건 6·5)로 판정한 바로 그 얇은 추정치다. R3 vix25_h5 는 이를 ½ 가중으로 쓴다.

