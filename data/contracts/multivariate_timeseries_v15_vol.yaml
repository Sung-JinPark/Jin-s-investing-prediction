character: |
  V13 변동성 사건 확률(champion persistence_pb)의 대안 추정 3팔을 같은 원점·같은 라벨에서 섀도로만 채점한다.
  가치는 EXIT 트리거(하드룰 VIX 25+) 조기경보 base rate 의 보정 개선 가능성 측정이지 가격 방향 예측이 아니다.
  결정론 수치모델의 설계창 적합(CLAUDE.md 원칙 5 명문화 예외) — 산출은 base rate 참조이지 캘리브레이션 표본이 아니며,
  하이퍼파라미터가 정점 지식을 간접 내포할 수 있다. LLM 개입 평가에는 이 예외를 쓰지 않는다.
  모든 출력은 참고 의견이며 매매 신호가 아니다.
authority_order:
  - CLAUDE.md (하드 게이트·ML 게이트·원칙 5 예외 범위)
  - data/contracts/multivariate_timeseries_v13_vol.yaml (부모 — 어떤 좌표도 완화하지 않는다)
  - V14 조건부 계약 (data/contracts 의 V14 conditional YAML — 오염 공시 M1·홀드아웃 불허 C3 승계. 경로 문자열은 계획 §3.0-8 로 적지 않는다)
  - 이 계약. 충돌 시 위가 이긴다.

