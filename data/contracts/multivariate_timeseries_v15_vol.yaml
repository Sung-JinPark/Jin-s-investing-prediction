arms:
  R1_platt:
    formula: p1 = sigmoid(a0_c + b0_c · logit(p_PB))       # p clip [1e-6, 1-1e-6]
    fit: |
      설계창 2007-2014 반창 교차전이 OOF(early→late, late→early; V13 rung-3 _dir_preds 와 같은 적합기, 분할 직전 h 원점 embargo/purge).
      방향 층화 Platt: logit p' = a_e2l·1[e2l] + a_l2e·1[l2e] + b·logit p (기울기 공통, 무정규 Newton). a0 = (a_e2l + a_l2e)/2 (단순 평균, 결과 전 고정), b0 = b.
      방향별 단독 (a,b) 는 공시용(수렴 플래그). 층화 적합 비수렴이면 동결 거부.
    cells: all_9
    constants: frozen_constants.R1
    disclosure: |
      방향 절편 부호 반대 8/9셀(GFC↔평온 기저율 전이) — a0 는 국면 중립 평균이라 라이브 국면에 따라 절편 편향이 남을 수 있다.
      b0>1(7/9셀)은 동결 PB l2(1e-3, 평균손실) 축소 해제 성분을 포함한다 — 설계창 표본 내 Platt 기울기 = 무정규/정규 기울기비
      (vix25_h5 1.2966 · vix25_h21 1.0765 · vix30_h5 1.2903 · rv_h5 1.6149 · rv_h21 1.1326 · rv_h63 1.1714 · vix25_h63 1.0616 · vix30_h21 1.0535 · vix30_h63 1.0345).
      vix25_h5/h21 b0(1.32/1.06)는 홀드아웃 진단 Cox 기울기(0.73/0.67)와 반대 방향 — R1 은 축소된 PB 를 더 샤프하게 미는 팔이다. 홀드아웃 기울기 사용 금지.
      vix30_h63 의 l2e 방향 단독 Platt 는 분리로 수렴하지 않는다(공시) — 상수는 층화 적합에서만 나온다(층화는 9/9 수렴).
      r1 의 pooled 단일 적합은 Simpson 인공물(rv_h63 b 0.331 < 방향별 0.92·2.42)로 폐기했다.
  R2_calm_jump:
    formula: 'p2 = 1 − (1 − p_PB)(1 − λ5),  λ5 = 1 − (1 − λ1)^5 if VIX_t < 20 else 0,  λ1 = (#{j ∈ jump_tail : j ≥ ln(K/VIX_t)} + 0.5)/(n_calm + 1)'
    jump_sample: 설계창 VIX_t < 20 세션의 1일 로그변화(n_calm=1108), 꼬리 = ln(25/20) 이상 11개 (최대 0.496008, 2007-02-27)
    cells: [vix25_h5, vix30_h5]
    cells_rule: 1일 해저드의 h 복리는 h=5 에서만 수준 고정 근사 — h21/h63 은 구조적 과대, rv 표적은 수준 터치가 아니다(결과 전 구조 사유)
    base: p_PB (R1 출력 아님 — 팔당 단일 변경)
    disclosure: |
      효과는 상태의존이다 — 평균은 작고(11-04 VIX 16.61: vix25_h5 0.0158 → 0.0224), VIX 19~20 구간에서 +4%p 대
      (11-09 VIX 19.92: 0.0992 → 0.1410), VIX=20 에서 0 으로 떨어지는 불연속(평온 정의의 경계).
      vix30_h5 는 설계창 MDE ≈1e-5 로 PB 와 거의 같은 예보 — 가족 한 슬롯을 사실상 소모(등록 유지).
      PB 가 이미 학습한 설계창 점프를 다시 더하는 이중계상 성분이 있다(설계창 d −0.00023 이 그 흔적).
  R3_regime_mix:
    formula: p3 = 0.5 · p_PB + 0.5 · c_c(state_t)
    state: {vix: 'VIX_t < 20 → calm', rv: 'RV21_t <= 0.1694 → calm'}     # V14 M5 운영 문턱 · V13 θ — 통계로 고르지 않음
    rates: 설계창 라벨 유한 행의 상태별 빈도(pooled 2007-2014)
    weights_fixed: [0.5, 0.5]       # 학습 아님(ML 게이트 200+ 비저촉)
    cells: all_9

baselines:                          # 셋 다 필수 보고
  climatology: V13 동결 아티팩트 clim_base_rate (V13 resolve.climatology_map 정본 규칙)
  conditional_base_rate: R3 의 c_c(state_t) 그대로
  persistence_pb: V13 발행 p (원장 행 cells[c].p)
scoring: {primary: brier, co_reported: [log_score, murphy_reliability, calibration_in_the_large, bss_vs_each_baseline]}

