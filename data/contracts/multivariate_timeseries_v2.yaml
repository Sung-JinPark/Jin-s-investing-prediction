schema_version: 2
contract_id: multivariate_timeseries_v2
model_id: shadow.mf_dfm_ridge_varx_v2
model_version: 2
status: preregistered_shadow_only
target:
  series_id: NASDAQCOM
  asset: NASDAQ Composite
  transform: daily_log_return
  stored_return_unit: fraction
  display_price_unit: index
  horizons_sessions: [1, 5, 21, 63]
probability_contract:
  stored_unit: fraction
  bounds: [0.0, 1.0]
  space: research_timeseries_v2_conditional
  combine_with_official_forecasts: false
  combine_with_scenario_v5_2: false
data_policy:
  grades: [native_pit, reconstructed_market_archive, captured_forward]
  macro_required_grade: native_pit
  market_archive_grade: reconstructed_market_archive
  reconstructed_archive_is_native_pit: false
  raw_before_fact: true
  append_only_facts: true
  private_raw_locator_allowed: true
  required_fact_fields:
    [source_id, series_id, observation_time, value, unit, available_at,
     data_grade, vintage_start, vintage_end, raw_sha256, receipt_id, supersedes]
sources:
  market_required:
    NASDAQCOM:
      provider: Nasdaq_or_FRED
      source_family: official_market_archive
      transform: log_change
    VIX:
      provider: Cboe
      source_family: official_market_archive
      transform: log_change
    DGS2:
      provider: US_Treasury
      source_family: official_market_archive
      transform: first_difference_bps
    T10Y2Y:
      provider: US_Treasury
      source_family: official_market_archive
      transform: ten_year_minus_two_year_then_first_difference_bps
    DTWEXBGS:
      provider: Federal_Reserve_H10
      source_family: official_market_archive
      transform: log_change
  macro_native_pit:
    growth: [PAYEMS, UNRATE, INDPRO, RSAFS, HOUST, GDPC1]
    inflation: [CPIAUCSL, CPILFESL, PCEPI, PCEPILFE]
    financial: [NFCI, DFF]
    liquidity: [M2SL, WALCL, WTREGEN, RRPONTSYD]
  optional_credit:
    series: [FED_EBP, FED_CMDI]
    required_for_core: false
    failure_action: candidate_C4_unavailable
  excluded_required_sources:
    BAMLH0A0HYM2:
      reason: FRED public history is restricted to recent years and cannot support the sealed sample
  event_optional: [NFP_CONSENSUS, CPI_CONSENSUS, FED_RATE_PROBABILITY]
  event_minimum_for_varx: 60
  event_minimum_for_overlay: 10
  future_actual_surprise_allowed: false
transforms:
  NASDAQCOM: log_change
  VIX: log_change
  DTWEXBGS: log_change
  DGS2: first_difference_bps
  T10Y2Y: first_difference_bps
  PAYEMS: log_change
  INDPRO: log_change
  RSAFS: log_change
  HOUST: log_change
  M2SL: log_change
  UNRATE: [level, first_difference]
  NFCI: [level, first_difference]
  CPIAUCSL: [year_over_year_log_change, three_month_annualized_log_change]
  CPILFESL: [year_over_year_log_change, three_month_annualized_log_change]
  PCEPI: [year_over_year_log_change, three_month_annualized_log_change]
  PCEPILFE: [year_over_year_log_change, three_month_annualized_log_change]
  WALCL: individual_change_no_net_liquidity_composite
  WTREGEN: individual_change_no_net_liquidity_composite
  RRPONTSYD: individual_change_no_net_liquidity_composite
alignment:
  calendar: NASDAQ_completed_sessions
  information_time: available_at
  observation_period_backfill: prohibited
  release_state_carry_forward: allowed_from_available_at_only
  include_age_since_release: true
model:
  family: origin_pit_dfm_plus_ridge_varx
  dynamic_factor:
    factors: [growth, inflation]
    factor_order: 1
    idiosyncratic_ar1: true
    em_tolerance: 0.00001
    em_cold_max_iterations: 300
    em_warm_max_iterations: 300
    convergence_requires_finite_state_and_parameters: true
    log_likelihood_decrease_allowed: false
    cache_key: [contract_hash, cutoff, input_hash]
    origin_link: latest_cache_cutoff_not_after_origin
    parameter_pit: origin_specific_refit_required
  candidates:
    C1: [core_market, growth_factor, inflation_factor]
    C2: [C1, NFCI, DFF]
    C3: [C1, M2SL, WALCL, WTREGEN, RRPONTSYD]
    C4: [C1, FED_EBP_or_CMDI]
    C5: [selected_core, jobs_consensus_and_rate_probability_overlay]
  candidate_inventory_frozen_at_run_start: true
  varx:
    endogenous: [nasdaq_return, vix_change, dgs2_change_bps, curve_change_bps, dollar_change]
    lag_candidates: [1, 2, 5]
    ridge_alpha_candidates: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
    standardization: training_window_robust_median_iqr
    outlier_clipping: prohibited
  windows:
    warmup: [1996-01-01, 2006-12-31]
    development: [2007-01-01, 2018-12-31]
    sealed: [2019-01-01, latest]
    rolling_sessions: 2520
  sealed_evaluation:
    maximum_disclosures_per_model_version: 1
    retune_after_failure: prohibited
  ensemble:
    scoring_window_origins: 52
    minimum_weight: 0.25
    maximum_weight: 0.75
    insufficient_history_weights: {expanding: 0.5, rolling_10y: 0.5}
  distribution:
    path_count: 20000
    block_length_candidates: [5, 10, 21]
    ewma_lambda_candidates: [0.94, 0.97]
    quantiles: [0.10, 0.25, 0.50, 0.75, 0.90]
    seed_rule: sha256_model_version_and_as_of
event_overlay:
  minimum_pit_observations_for_varx: 60
  minimum_pit_observations_for_overlay: 10
  below_minimum_role: research_path_reweighting_only
  calibration: expanding_ridge_on_event_signal
  ridge_alpha: 1.0
  target_path_sessions: 5
  maximum_absolute_shift_sigma: 2.0
  future_actual_surprise_allowed: false
  consensus_gap_rule: model_nowcast_minus_consensus_before_release
  coefficient_promotion_requires: [minimum_60_pit_events, ablation_pass, walkforward_gate_pass]
evaluation:
  outer_start: 2007-01-01
  origin_frequency: weekly_last_completed_session
  purge_sessions: 63
  embargo_sessions: 5
  minimum_origins: 250
  required_regimes: [great_financial_crisis_2008, pandemic_2020, tightening_2022]
  baselines: [random_walk, drift_random_walk, ar1, gbm, historical_simulation, block_bootstrap]
publication_gate:
  pit_leakage_count: 0
  market_common_start_not_after: 2007-01-03
  receipt_linkage: 1.0
  short_horizon_crps_max_underperformance: 0.02
  long_horizon_mean_crps_min_improvement: 0.02
  long_horizon_stationary_bootstrap_ci_upper: 0.0
  p10_p90_coverage: [0.76, 0.84]
  p25_p75_coverage: [0.45, 0.55]
  regime_p10_p90_minimum: 0.70
  failure_surface: validation_pending_without_numbers
operational_gate:
  required_market_max_age_hours: 48
  required_market_groups:
    - [NASDAQCOM]
    - [VIX]
    - [DGS2]
    - [DGS10]
    - [DTWEXBGS, DTWEXB]
  recent_origins: 26
  crps_max_underperformance: 0.05
  coverage_must_remain_in_publication_contract: true
  failure_action: hide_new_numbers_validation_pending
ralph:
  local_only: true
  branch_prefix: codex/timeseries-ralph-
  maximum_iterations: 50
  maximum_hours: 24
  same_blocker_limit: 3
  agent_sandbox: workspace-write
  secret_isolation: [FRED_API_KEY, GH_TOKEN, GITHUB_TOKEN, .secrets]
  frozen_coordinates:
    [model_id, candidates, windows, evaluation, publication_gate, operational_gate, probability_contract]
  editable_scopes:
    - data/contracts/multivariate_timeseries_v2.yaml
    - src/ai_fc/timeseries_v2/
    - src/tests/test_multivariate_timeseries_v2.py
    - src/tests/test_ralph_timeseries.py
    - tools/ralph_timeseries.py
    - .github/workflows/timeseries-v2-refresh.yml
    - src/ai_fc/cli.py
    - src/ai_fc/dashboard.py
    - src/ai_fc/read_model_contract.py
    - src/ai_fc/dashboard_parts/dashboard.js
    - src/ai_fc/dashboard_parts/dashboard.css
    - data/timeseries_v2/
    - outputs/timeseries_v2/
  protected_mutation_action: discard_iteration_and_stop
  sealed_failure_action: stop_without_main_change
promotion:
  automatic_champion: false
  minimum_shadow_sessions: 126
  explicit_owner_approval: required
prohibitions:
  direct_index_level_training: true
  forced_endpoint: true
  future_actual_exogenous: true
  silent_feature_drop: true
  silent_normalization: true
  official_ledger_write: true
  scenario_v5_2_mutation: true
  automatic_main_self_modification_in_production: true
