  numbers_visible_rule: integrity_and_research_and_operational_all_pass
  gate_threshold_change_after_outer_result: prohibited

atlas_contract:
  task_state_store: postgresql_task_queue
  local_ci_mirror: sqlite_typed_tables
  task_states: [pending, leased, running, validating, succeeded, retry, blocked, hold, failed, cancelled]
  lease_required: true
  heartbeat_required: true
  checkpoint_required_for_long_tasks: true
  one_codex_task_per_invocation: true
  same_blocker_stop_count: 3
  automatic_model_retuning_after_gate: prohibited
  worker_capabilities:
    collector: [provider_secret_read, raw_object_write, receipt_write]
    materializer: [typed_data_read, snapshot_write, parquet_write]
    trainer_cpu: [immutable_snapshot_read, fit_write]
    trainer_gpu: [immutable_snapshot_read, fit_write, gpu_use]
    evaluator: [fit_read, score_write, gate_proposal_write]
    codex: [isolated_worktree_write, allowlisted_code_test_write]
    reviewer: [evidence_read, decision_proposal_write]
  budgets: [wall_clock, cpu, gpu, api, storage, experiment_count]

