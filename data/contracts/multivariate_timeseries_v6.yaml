    corporate_earnings: {class: challenger_until_pit_proven}
    events: {class: zero_weight_until_minimum_history}
    market_implied: {class: prospective_or_licensed}

candidate_contract:
  freeze_task_id: V6-P0-005
  frozen_before_outer_evaluation: true
  canonical_json_sort_keys: true
  runtime_parameter_binding_required: true
  estimator_get_params_receipt_required: true
  experiment_bundle_limit: 12
  outer_result_retuning: prohibited
  candidates:
    - id: E0
      family: exact_fixed_anchor
      role: mandatory_comparator_and_ensemble_constituent
      horizons: [1, 5, 21, 63]
      parameters:
        representation_priority: [exact_samples, dense_cdf_grid, exact_parametric]
        approximation_from_p10_p90: prohibited
        deterministic_identity_tolerance: 1.0e-12
    - id: E1
      family: direct_quantile_elastic_net
      role: core_challenger
      horizons: [1, 5, 21, 63]
      parameters:
        objective: pinball
        quantiles: [0.01, 0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95, 0.99]
        alpha_grid: [0.0001, 0.001, 0.01, 0.1]
        l1_ratio_grid: [0.1, 0.5, 0.9]
        max_iter: 10000
        tolerance: 1.0e-7
    - id: E2
      family: student_t_location_scale
      role: core_challenger
      horizons: [1, 5, 21, 63]
      parameters:
        location_objective: robust_negative_log_likelihood
        log_scale_objective: student_t_negative_log_likelihood
        degrees_of_freedom_grid: [4, 6, 8, 12]
        ridge_alpha_grid: [0.01, 0.1, 1.0]
        scale_floor: 1.0e-6
    - id: E3
      family: contract_driven_quantile_boosting
      role: core_challenger
      horizons: [1, 5, 21, 63]
      parameters:
        objective: quantile
        quantiles: [0.01, 0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95, 0.99]
        learning_rate_grid: [0.03, 0.07]
        max_leaf_nodes_grid: [7, 15]
        max_iter_grid: [100, 300]
        l2_regularization_grid: [0.0, 1.0]
        min_samples_leaf_grid: [20, 50]
    - id: E4
      family: bayesian_dynamic_linear_model
      role: challenger
      horizons: [1, 5, 21, 63]
      parameters:
        observation_family: gaussian
        state_discount_grid: [0.98, 0.995]
        prior_variance_grid: [1.0, 10.0]
        filtered_state_only: true
    - id: E5
      family: learned_soft_regime_partial_pooling
      role: challenger
      horizons: [1, 5, 21, 63]
      parameters:
        regime_count: 3
        gate_family: multinomial_logistic
        minimum_effective_sample_size: 50
        global_shrinkage_grid: [0.25, 0.50, 0.75]
        future_regime_label: prohibited
    - id: E6
      family: asymmetric_evt_tail
      role: tail_challenger
      horizons: [5, 21, 63]
      parameters:
        lower_upper_fit_separate: true
        threshold_quantile_grid: [0.90, 0.95]
        minimum_exceedances_per_tail: 40
        shape_bounds: [-0.45, 0.45]
        shrinkage_to_global: required
    - id: E7
      family: pit_analog_trajectory
      role: path_challenger
      horizons: [21, 63]
      parameters:
        distance: robust_mahalanobis
        neighbor_count_grid: [10, 20, 40]
        minimum_temporal_spacing_sessions: 126
        future_outcome_in_distance: prohibited
    - id: E8
      family: event_local_projection
      role: zero_weight_until_eligible
      horizons: [1, 5, 21, 63]
      parameters:
        minimum_independent_resolved_events: 60
        pre_event_snapshot_required: true
        future_actual_surprise: prohibited
    - id: E9
      family: market_implied_physical_calibration
      role: prospective_or_licensed_challenger
      horizons: [1, 5, 21, 63]
      parameters:
        risk_neutral_to_physical_calibration: required
        forward_capture_only_without_history: true
    - id: E10
      family: foundation_model_challenger
      role: isolated_zero_weight
      horizons: [1, 5, 21, 63]
      parameters:
        default_weight: 0.0
        frozen_checkpoint_hash_required: true
        license_receipt_required: true

validation_contract:
  history_roles:
    initial_training: {start: "1996-01-01", end: "2006-12-31"}
    research_development: {start: "2007-01-01", end: "2018-12-31"}
    sealed_research_evaluation: {start: "2019-01-01", end: "2026-08-21"}
  canonical_origin_frequency: weekly_last_completed_xnas_session
  robustness_origin_frequency: monthly_nonoverlapping
  fold_roles:
    - research_train
    - inner_candidate_selection
    - inner_stacking
    - inner_calibration
    - outer_test
    - qualification
    - prospective
  label_maturity_required: true
  purge_sessions: 63
  embargo_sessions: 5
  selection_stacking_calibration_disjoint: true
  comparator_id: E0
  comparator_identity_exact: true
  metrics:
    - CRPS
    - WIS
    - pinball
    - tail_weighted_CRPS
    - direction_accuracy
    - brier_first_touch_minus_10pct
    - log_score_when_valid
  dependence_aware_inference:
    primary: paired_stationary_bootstrap
    robustness: HAC_and_nonoverlapping_origins
    confidence_level: 0.90

ensemble_contract:
  horizon_specific: true
  nonnegative_convex: true
  anchor_floor: {1: 0.20, 5: 0.25, 21: 0.40, 63: 0.50}
  unavailable_or_stale_weight: 0.0
  rowwise_oracle: prohibited
  weight_turnover_penalty: required
  complexity_penalty: required
  calibration:
    cross_fitted: true
    matured_errors_only: true
    location_scale_tail_separate: true
    shrink_to_zero: true
    quantile_rearrangement: required
    sequential_conformal: challenger_only_until_nested_oos_pass

path_contract:
  deterministic_endpoint_interpolation: prohibited
  joint_endpoint_sampler_required: true
  trajectory_sources:
    - pit_analog_paths
    - stationary_or_regime_block_paths
  endpoint_reconciliation_required: true
  sample_count: 20000
  deterministic_seed_components: [model_id, contract_hash, dataset_snapshot_id, origin_id]
  path_metrics:
    - drawdown_depth
    - drawdown_duration
    - first_touch
    - realized_volatility
    - event_window_response

