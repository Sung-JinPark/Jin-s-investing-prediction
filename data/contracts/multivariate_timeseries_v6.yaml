    - reconstructed_official_archive
    - captured_forward
    - licensed_reference_only
    - quarantined
  official_archive_not_native_pit: true
  local_ci_storage_mode: content_addressed_files_plus_sqlite_typed_mirror
  production_control_plane: postgresql_typed_tables
  production_object_store: s3_or_r2_content_addressed
  analytics_store: partitioned_parquet_snapshot
  generic_jsonb_core_entity_writes: prohibited

