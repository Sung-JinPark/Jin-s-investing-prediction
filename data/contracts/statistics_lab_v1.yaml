schema_version: 1
contract_id: dotcom_statistics_lab_v1
status: active_reference_only
probability_space: reference_only
model_use: prohibited
official_forecast_input: false
description: Public-source statistical comparisons between the dot-com cycle and the current AI cycle.

cycle_alignment:
  dotcom_start: 1995-01-01
  dotcom_end: 1999-12-31
  current_start: 2023-01-01
  current_axis_end: 2027-12-31
  comparison_months: 59
  rule: elapsed_calendar_month
  endpoint_forcing: false
  forecast_extension: false
  current_line_policy: actual_observations_only_no_forecast_extension
  interpretation: Descriptive alignment only; not a forecast or probability.

sources:
  fred:
    endpoint: https://api.stlouisfed.org/fred/series/observations
    provider: Federal Reserve Bank of St. Louis
    series:
      M2SL: {native_frequency: monthly, unit: billions_usd, aggregation: last}
      MMMFFAQ027S: {native_frequency: quarterly_end_of_period, unit: millions_usd, aggregation: last, role: total_US_money_market_fund_assets}
      CDCABSHNO: {native_frequency: quarterly_end_of_period, unit: millions_usd, aggregation: last, role: household_checkable_deposits_and_currency}
      TSDABSHNO: {native_frequency: quarterly_end_of_period, unit: millions_usd, aggregation: last, role: household_time_and_savings_deposits}
      FGDSLAQ027S: {native_frequency: quarterly_end_of_period, unit: millions_usd, aggregation: last, role: federal_government_treasury_securities_outstanding}
      BOGZ1FL153064235Q: {native_frequency: quarterly_end_of_period, unit: millions_usd, aggregation: last, role: household_bond_mutual_fund_shares}
      IQ12260: {native_frequency: monthly, unit: index_dec_2024_100, aggregation: last, role: official_nonmonetary_gold_price_direction_proxy}
      DABSHNO: {native_frequency: quarterly_end_of_period, unit: millions_usd, aggregation: last, role: household_currency_deposits_and_money_market_fund_shares}
      BOGZ1LM153064475Q: {native_frequency: quarterly_end_of_period, unit: millions_usd, aggregation: last, role: household_direct_and_indirect_corporate_equity_value}
      BOGZ1FL154022375A: {native_frequency: annual_end_of_period, unit: millions_usd, aggregation: last, role: household_direct_and_indirect_debt_securities_assets}
      NASDAQCOM: {native_frequency: daily_close, unit: index, aggregation: last}
      T10Y2Y: {native_frequency: daily, unit: percent, aggregation: mean}
      FEDFUNDS: {native_frequency: monthly, unit: percent, aggregation: last}
      TOTALSL: {native_frequency: monthly, unit: millions_usd, aggregation: last}
      TDSP: {native_frequency: quarterly, unit: percent, aggregation: last}
      BOGZ1FL010000346Q: {native_frequency: quarterly, unit: percent, aggregation: last}
      DRTSCILM: {native_frequency: quarterly, unit: percent, aggregation: last}
      NCBEILQ027S: {native_frequency: quarterly, unit: millions_usd, aggregation: last}
      CPATAX: {native_frequency: quarterly, unit: billions_usd_saar, aggregation: last}
      UNRATE: {native_frequency: monthly, unit: percent, aggregation: last}
      CPIAUCSL: {native_frequency: monthly, unit: index_1982_1984_100, aggregation: last}
      NFCI: {native_frequency: weekly, unit: standard_deviation_index, aggregation: mean}
      BOGZ1LM893064105Q: {native_frequency: quarterly, unit: millions_usd, aggregation: last, role: total_us_corporate_equity_market_value_denominator}
      HQMCB10YR: {native_frequency: monthly, unit: percent, aggregation: last, role: high_quality_corporate_bond_yield}
      GS10: {native_frequency: monthly, unit: percent, aggregation: last, role: corporate_spread_treasury_reference}
      DCOILWTICO: {native_frequency: daily, unit: dollars_per_barrel, aggregation: mean, role: inflation_leading_indicator}
      WPU10260314: {native_frequency: monthly, unit: index_1982_100, aggregation: last, role: copper_inflation_leading_indicator}
      GACDFSA066MSFRBPHI: {native_frequency: monthly, unit: diffusion_index, aggregation: last, role: public_manufacturing_diffusion_proxy_not_ISM_PMI}
      SP500: {native_frequency: daily_close, unit: index, aggregation: last, role: broad_market_index_reference}
      CBBTCUSD: {native_frequency: daily_close, unit: dollars, aggregation: last, role: crypto_risk_appetite_reference}
      NASDAQSOX: {native_frequency: daily_close, unit: index, aggregation: last, role: us_semiconductor_index_reference}
      SPASTT01KRM661N: {native_frequency: monthly, unit: index_2015_100, aggregation: last, role: korea_share_price_reference}
      SPASTT01USM661N: {native_frequency: monthly, unit: index_2015_100, aggregation: last, role: us_share_price_full_history_sp_family_monthly_average}
      GFDEBTN: {native_frequency: quarterly, unit: millions_usd, aggregation: last, role: federal_total_public_debt_denominator}
      HOUST: {native_frequency: monthly, unit: thousands_saar, aggregation: last, role: housing_starts_cycle_reference}
      GDP: {native_frequency: quarterly, unit: billions_usd_saar, aggregation: last, role: investment_share_denominator}
      Y034RC1Q027SBEA: {native_frequency: quarterly, unit: billions_usd_saar, aggregation: last, role: information_processing_equipment_investment}
      Y001RC1Q027SBEA: {native_frequency: quarterly, unit: billions_usd_saar, aggregation: last, role: intellectual_property_products_investment}
  federal_reserve_z1:
    endpoint: https://www.federalreserve.gov/releases/z1/current/z1_csv_files.zip
    provider: Board of Governors of the Federal Reserve System
    note: one quarterly archive, one raw receipt, multiple declared series
    series:
      FL663067003: {member: csv/F4_6_s.csv, native_frequency: quarterly, unit: millions_usd, aggregation: last, role: household_margin_loan_proxy_not_FINRA}
      FL103163005: {member: csv/S11_1_s.csv, native_frequency: quarterly, unit: millions_usd, aggregation: last, role: nonfinancial_corporate_debt_securities_outstanding}
      FA103163005: {member: csv/S11_1_t.csv, native_frequency: quarterly, unit: millions_usd_saar, aggregation: last, role: nonfinancial_corporate_debt_securities_net_issuance}
  census_c30:
    endpoint: https://www.census.gov/construction/c30/xls/privtime.xlsx
    provider: U.S. Census Bureau
    note: value of private construction put in place, not seasonally adjusted; one workbook, one raw receipt, multiple declared columns
    series:
      C30_MFG_COMPUTER_ELECTRONIC: {column: Computer/ electronic/ electrical, native_frequency: monthly, unit: millions_usd, aggregation: last, role: chip_fab_structures_buildout}
      C30_POWER: {column: Power (inc. Gas and Oil), native_frequency: monthly, unit: millions_usd, aggregation: last, role: power_structures_buildout}
      C30_COMMUNICATION: {column: Communication, native_frequency: monthly, unit: millions_usd, aggregation: last, role: communication_structures_buildout}
      C30_OFFICE_TOTAL: {column: Office, native_frequency: monthly, unit: millions_usd, aggregation: last, role: data_centre_share_denominator}
      C30_OFFICE_DATA_CENTER: {column: Data center, native_frequency: monthly, unit: millions_usd, aggregation: last, role: data_centre_structures, history: begins_2014_01_no_dotcom_counterpart}
    label: Household margin loans and other receivables due to brokers
    unit: millions_usd
    role: margin_credit_proxy_not_finra_margin_debt
  university_of_florida_ipo_initiative:
    technology_tables: https://site.warrington.ufl.edu/ritter/files/IPOs-Tech.pdf
    internet_registry: https://site.warrington.ufl.edu/ritter/files/IPO-age.xlsx
    native_frequency: annual
    reviewed_through: 2025-12-31
    role: comparable_technology_ipo_market_series
  sec_edgar:
    endpoint: https://www.sec.gov/Archives/edgar/data/
    forms: [424B4]
    native_frequency: event
    role: reviewed_ai_core_ipo_minimum_cohort
    reviewed_through: 2026-08-12
  renaissance_capital_ai_research:
    tracker: https://www.renaissancecapital.com/IPO-Center/AI-IPOs-Tracker
    dependency_method: https://www.renaissancecapital.com/IPO-Center/News/111245/Looking-for-AI-IPOs-Introducing-IPO-Pros-new-AI-Screen
    native_frequency: event_and_continuous_research
    role: broad_market_recognized_ai_ipo_cohort
    reviewed_through: 2026-08-12
  accel_globalscape:
    report: https://www.accel.com/globalscape
    native_frequency: annual_research
    role: named_software_ai_ipo_cohort
    reviewed_through: 2025-12-31
  nahb_hmi:
    page: https://www.nahb.org/news-and-economics/housing-economics/indices/housing-market-index
    snapshot_path: data/statistics/reference/nahb_hmi_history_v1.json
    native_frequency: monthly
    role: housing_recession_warning_component
  sec_ipo_statistics:
    endpoint: https://www.sec.gov/data-research/statistics-data-visualizations/initial-public-offerings-ipos
    discovery: newest_sec-stats-ipos-YYYYMMDD_xlsx_link_on_official_page
    native_frequency: quarterly
    role: us_ipo_issuer_type_counts_and_proceeds
  wilmerhale_1999_internet_ipo_review:
    page: https://www.wilmerhale.com/en/insights/publications/internet-ipos-conclude-a-sensational-year-in-1999-december-1999
    native_frequency: historical_research
    role: 1999_internet_ipo_breadth_age_revenue_and_first_day_context

qualitative_ipo_policy:
  completed_ipo_numerator: aggregate_post_issue_market_value_at_first_closing_price
  market_denominator: BOGZ1LM893064105Q_total_us_corporate_equities_market_value
  private_frontier_watchlist: separate_non_ipo_reference_point_never_added_to_completed_ipo_series
  reported_ipo_valuation_sensitivity: separate_headline_scenario_never_added_to_completed_ipo_or_private_valuation_actuals
  valuation_vs_proceeds_guard: market_valuation_must_not_be_labeled_as_cash_raised; gross_float_sensitivity_must_disclose_primary_secondary_split_is_unknown
  listed_ai_beneficiary_watchlist: completed_Nasdaq_ADS_listing_events_outside_Ritter_definition_may_enter_only_the_influence_inclusive_diagnostic
  influence_inclusive_count: actual_US_AI_related_traditional_IPOs_plus_explicit_Nasdaq_ADS_listing_events_not_a_Ritter_IPO_count
  nasdaq_memory_market_events: verified_listing_context_including_Montage_MONT_2013_and_SK_hynix_SKHY_2026_never_backfilled_into_incompatible_cycle_counts
  global_ai_chip_completed_ipos: separate_china_and_hong_kong_watchlist_never_added_to_us_ritter_series
  cross_market_value_policy: preserve_local_currency_and_do_not_sum_without_a_common_point_in_time_fx_and_market_denominator
  small_issuer_definition: inflation_adjusted_LTM_sales_below_USD_100m_in_2024_purchasing_power
  completed_ipo_exclusions: [OpenAI_private_company, Anthropic_private_company, SK_hynix_ADR_outside_Ritter_traditional_IPO_definition]
  qualitative_inclusions:
    nasdaq_ads_listing_event: [SK_hynix_SKHY]
    historical_china_memory_nasdaq_context: [Montage_Technology_MONT]
    completed_china_hong_kong_ai_chip_ipos: [Horizon_Robotics, Black_Sesame_International, Moore_Threads, MetaX_Integrated_Circuits]

reference_statistics_policy:
  placement: below_authoritative_statistics
  official_numeric_ledger: false
  official_forecast_input: false
  active_charts:
    - internet_vs_ai_core_ipos
    - technology_ipo_count
    - technology_ipo_first_day_return
    - technology_ipo_price_to_sales
    - technology_ipo_profitable_share
    - all_ipo_negative_earnings_share
    - dotcom_internet_ipo_breadth
  batch_update:
    cadence: weekly_after_authoritative_SEC_refresh
    mutable_scope: current_era_rows_only
    historical_scope: frozen_cited_publication_vintage
    academic_source_watch: compare_remote_content_hash_then_require_review_before_current_row_change
    edgar_source_watch: discover_and_review_completed_424B4_events
    forecast_extension: prohibited
  current_overlay:
    cohort: strict_AI_core_completed_US_traditional_IPOs
    numerator_evidence: SEC_424B4_final_prospectuses
    count_denominator: SEC_IPO_QUARTERLY_corporate_count_four_quarter_sum
    proceeds_denominator: SEC_IPO_QUARTERLY_corporate_proceeds_mn_four_quarter_sum
    refresh: weekly_official_ledger_projection
  static_reference:
    1999_profile: WilmerHale_historical_research
    first_day_return: Ritter_individual_IPO_reference
    alternative_2025_denominator: Ritter_90_IPOs_and_38_970bn_audit_context_only
  guard: static_research_values_must_not_enter_authoritative_chart_sources_or_official_forecast_inputs

macro_warning_policy:
  first_cut_alignment: {dotcom_event: 1995-07-01, current_event: 2024-09-01, output: change_from_pre_cut_month}
  corporate_credit: HQMCB10YR_and_HQMCB10YR_minus_GS10
  inflation_leads: {oil: DCOILWTICO_yoy_at_observed_date, copper: WPU10260314_yoy_at_observed_date, cpi: CPI_yoy_date_shifted_minus_2_months_for_alignment, semantics: descriptive_leading_alignment_not_forecast}
  recession_panel: {housing: HOUST_yoy_percent, manufacturing: Philadelphia_Fed_diffusion_index, PMI_disclosure: public_proxy_not_ISM_PMI, probability_output: prohibited, axis_note: units_differ_direction_comparison_only}
  household_balance_sheet_trend_gap:
    series: [BOGZ1LM153064475Q, DABSHNO, BOGZ1FL154022375A]
    baseline: separate_log_linear_trend_fitted_on_observations_from_2009-01-01_through_2019-12-31
    training_observations: {corporate_equities_quarterly: 44, currency_deposits_money_market_funds_quarterly: 44, debt_securities_annual: 11}
    output: percent_above_or_below_own_trend
    interpretation: descriptive_not_fair_value_or_forecast
customer_chart_contract:
  required_fields: [insight, conclusion, caveat, source_ids, scope_note]
  conclusion_semantics: one_sentence_current_state_judgment_not_probability_or_trading_advice
  scope_note:
    placement: chart_bottom_right
    content: short_country_or_market_boundary_only
    prohibited: [provider_name, source_url, series_id, update_frequency]
  log_scale_charts: [m2_nasdaq]
  liquidity_position_map:
    chart_type: liquidity_bars
    card_span: full_statistics_grid_width
    size_panel: [BOGZ1LM893064105Q_trillions_usd, FGDSLAQ027S_trillions_usd, TSDABSHNO_trillions_usd, CDCABSHNO_trillions_usd, M2SL_trillions_usd, MMMFFAQ027S_trillions_usd, BOGZ1FL153064235Q_trillions_usd]
    momentum_panel: [SP500_12m_change, NASDAQCOM_12m_change, CBBTCUSD_12m_change, IQ12260_12m_change, FGDSLAQ027S_12m_change, TSDABSHNO_12m_change, CDCABSHNO_12m_change, MMMFFAQ027S_12m_change, BOGZ1FL153064235Q_12m_change]
    momentum_axis: symmetric_zero_centered
    aggregation: prohibited
    interpretation: balances_and_price_changes_have_different_units_and_overlapping_pools_so_they_are_never_summed_or_presented_as_market_shares
  sec_ipo_issuer_mix_h1:
    chart_type: stacked_bar
    measure: issuer_count
    categories: [operating_company, SPAC, fund]
    proceeds: detail_only_never_plotted_on_count_axis
    ai_only_claim: prohibited
