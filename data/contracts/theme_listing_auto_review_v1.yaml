version: 2026-10-26.v1
contract_id: theme_listing_auto_review_v1
status: preregistered_before_agreement_measurement
decided_by: user                      # 2026-10-26 "새 상장 검수도 자동화해서 업데이트"
rules_fixed_at: "2026-10-26T02:27:14Z" # 판정 규칙을 전수조사 라벨과의 일치도 측정 전에 고정했다
scope: dotcom_overheat_index_v5 indicator ipo_count_operating_12m — theme listings after the v5 census
probability_space: reference_only
fitting: none                         # 가중치·임계 학습 없음. 일치도는 측정해 공시만 한다

# 무엇을 자동화하나
# 전수조사(v5, 2026-10-22 상장분까지) 이후 감시(theme_listing_watch)가 모은 상장마다 아래 절차를 결정론으로
# 적용해 판정을 기록한다 — 테마면 theme_listing_additions.csv 에 행 추가, 아니면 theme_listing_reviews.csv 에
# 결정·이유·출처. 자동 판정 행은 reviewer=auto_rule_v1 로 사람 판정과 구분된다. 사람이 이미 남긴 판정은
# 덮어쓰지 않는다. 판정 근거 텍스트는 거래소·공시 원천의 사업 설명만 쓴다(회사명은 보조).
#
# 왜 LLM 이 아니라 규칙인가
# 새 상장사는 모델 학습 시점 이후라 모델이 회사를 모른다 — 결국 같은 사업 설명 텍스트를 읽어야 하고, 그러면
# 고정 규칙이 재현 가능하고 비용이 없다. 무인 예약 실행에서 LLM 판정은 매 실행 결과가 달라질 수 있다.

text_sources:
  cn_a: [eastmoney_ipo.MAIN_BUSINESS, eastmoney_ipo.INDUSTRY_NAME, eastmoney_f10.EM2016, eastmoney_f10.MAIN_BUSINESS]
  hk_main: [eastmoney_hk_f10.BELONG_INDUSTRY, eastmoney_hk_f10.MAIN_BUSINESS, eastmoney_hk_f10.ORG_PROFILE]
  kr: [kind.industry, kind.main_products]
  jp: [jpx_outline_en.business]
  tw_twse: [mops_t05st03.industryCategory, mops_t05st03.mainBusiness]
  tw_tpex: [mops_t05st03.industryCategory, mops_t05st03.mainBusiness]

procedure:                            # 위에서부터 처음 걸리는 단계가 판정이다
  - step: event_rule
    rule: 감시가 이미 기계 제외한 상장(SPAC·공모 없음·시장 이전·2차 상장·KONEX)은 그대로 둔다
  - step: second_listing
    rule: >-
      홍콩 H주인데 같은 법인(정식 명칭)이 그 전에 A주에 상장돼 있으면, A주인데 같은 법인이 그 전에 홍콩에
      상장돼 있으면 not_first_listing. 일본 개요의 Current Listed Market 이 N/A 가 아니면 not_first_listing.
      대만 이름에 投控·投資控股(지주사 전환 상장)가 있으면 no_offering.
  - step: pipeline
    rule: 상장 대기 목록(theme_listing_pipeline.csv)의 회사와 이름이 맞으면 counted(대기 목록이 이미 출처 있는 테마 판정)
    then: 대기 목록에서 그 행을 지운다(상장된 회사가 대기에 남으면 로더가 거부한다)
  - step: text_required
    rule: 사업 설명을 하나도 못 얻으면 판정하지 않고 다음 실행에 다시 시도한다(pending, 사유 no_text)
  - step: semiconductor
    rule: >-
      industry_semiconductor 가 맞거나, semiconductor_terms 가 사업 설명에 있으면 semiconductor.
      단 semiconductor_exclusions 가 있고 semiconductor_core 가 없으면 not_theme(디스플레이·PCB·수동부품·
      태양광·커넥터·케이블·광모듈 — 계약 theme_rule 의 반도체 아님).
  - step: ai
    rule: >-
      ai_terms 가 사업 설명에 있으면 ai. 단 응용처를 나열하는 절(application_markers 가 있는 절)에 나온 AI 는
      세지 않는다 — "AI 서버에 쓰이는 전원" 처럼 AI 가 제품이 아니라 고객 산업인 경우.
  - step: default
    rule: not_theme

