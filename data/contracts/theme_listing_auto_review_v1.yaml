known_limits:
  - 사업 설명이 짧은 시장(KIND 주요제품은 제품명만 나오기도 한다)에서는 AI 회사를 놓칠 수 있다 — 일치도 측정에 시장별로 공시.
  - 규칙은 '사업 설명에 무엇이 쓰였나' 를 본다. 전수조사의 '주력 사업' 판단과 같지 않다 — 경계 사례는 규칙이 정한다.
  - 미포함 시장(홍콩 GEM·동남아·인도 본시장·유럽·TSX·ASX·TASE·미국 ADR)은 감시 원천이 없어 이 절차 밖이다.
