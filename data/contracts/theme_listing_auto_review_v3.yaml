version: 2026-10-27.v3
contract_id: theme_listing_auto_review_v3
supersedes: theme_listing_auto_review_v2   # v1·v2 파일은 기록으로 그대로 둔다
status: preregistered_before_new_validation_segment
decided_by: user                      # 2026-10-27 "수기로 하지 않고 규칙이자 새버전 새 검증 구간 만들어서 자동업데이트"
rules_fixed_at: "2026-10-27T09:34:42Z" # 새 검증 구간(아래 validation) 측정 전에 고정
scope: dotcom_overheat_index_v5 indicator ipo_count_operating_12m — theme listings after the v5 census
probability_space: reference_only
fitting: none                         # 가중치·임계 학습 없음. 용어 목록과 절차는 사람이 정한 고정 규칙이다

validation:
  segment: new_venues_census_period   # v1·v2 가 한 번도 보지 않은 시장 — 이번 확장으로 처음 감시하는 곳
  venues: [euronext, lse, us_adr]
  window: ["2022-02-01", "2026-10-22"] # v5 전수조사 라벨이 있는 구간
  labels: theme_listing_additions.csv (v5 전수조사, 사람 판정)
  measured_once: true                 # 이 구간 결과로 v3 규칙(용어·절차)을 고치지 않는다 — 고치려면 v4 + 새 구간
  regression_report: 기존 6개 시장(이미 v2 홀드아웃으로 본 구간)은 v3 변경의 영향만 함께 공시
  first_measurement:                  # 2026-10-27T10:2xZ — 독립 측정(이 구간을 처음 봤다)
    {n: 754, TP: 6, FN: 7, FP: 2, TN: 682, no_text: 57, recall: 0.462, precision: 0.750, agreement: 0.987, count_ratio: 0.615}
  implementation_fixes_after_first_measurement:   # 규칙(용어·절차)이 아니라 계약을 코드가 못 따른 결함만 고쳤다
    - ADS 표지 문구 변형('initial public offering, or the offering, of … ADSs'·'price of the ADSs is …'·'no public market for the ADSs or our shares')을 못 읽음
    - 투자설명서 요약 첫 문장 추출이 앞 문장 꼬리를 붙임('…General Motors. WeRide is …')
    - 계약 text_sources 가 Euronext·LSE 는 회사명도 근거라고 했는데 코드가 이름만 있는 행을 no_text 로 멈춤
    - 공모가 '51.00.'(문장 끝 마침표) 숫자 변환 실패, 같은 티커의 IPO·후속 공모 424B4 가 한 키로 겹침
  result:                             # 구현 수정 후 같은 구간 재측정 — 독립 검증이 아니다(공시용 운영 수치)
    n: 754
    TP: 9
    FN: 6
    FP: 3
    TN: 734
    no_text: 2
    recall: 0.600
    precision: 0.750
    agreement: 0.988
    count_ratio: 0.800                # 새 시장은 전수조사보다 덜 센다 — 업종 분류·회사명만으로는 AI 회사를 놓친다
    basis: after_implementation_fix_same_segment_not_independent
    sample_note: 양성 15건뿐이라 시장별 수치는 불안정하다
  regression_on_old_venues:           # v2 홀드아웃 구간(이미 본 구간) — v3 용어 추가(robotaxi 등)의 영향
