text_sources:
  cn_a: [eastmoney_ipo.MAIN_BUSINESS, eastmoney_ipo.INDUSTRY_NAME, eastmoney_f10.EM2016, eastmoney_f10.MAIN_BUSINESS]
  hk_main: [eastmoney_hk_f10.BELONG_INDUSTRY, eastmoney_hk_f10.MAIN_BUSINESS, eastmoney_hk_f10.ORG_PROFILE]
  kr: [kind.industry, kind.main_products]
  jp: [jpx_outline_en.business]
  tw_twse: [mops_t05st03.industryCategory, mops_t05st03.mainBusiness]
  tw_tpex: [mops_t05st03.industryCategory, mops_t05st03.mainBusiness]
  euronext: [euronext_detail.icb, company_name]          # 사업 설명 문장 없음 — 업종 분류와 회사명만
  lse: [lse_new_issues.ftse_industry_sector_subsector, company_name]
  us_adr: [sec_424b4.prospectus_summary_first_sentence, sec_submissions.sicDescription]
  us_ipo: [nasdaq_calendar.company_name]                  # 상장 대기 회사 일치에만 쓴다

procedure:                            # 위에서부터 처음 걸리는 단계가 판정이다
  - step: event_rule
    rule: 감시가 이미 기계 제외한 상장(SPAC·공모 없음·시장 이전·2차 상장·KONEX)은 그대로 둔다
  - step: second_listing
    rule: >-
      홍콩 H주인데 같은 법인(정식 명칭)이 그 전에 A주에 상장돼 있으면, A주인데 같은 법인이 그 전에 홍콩에
      상장돼 있으면 not_first_listing(실제 숫자 코드와 상장일이 있는 상장만). 일본 개요의 Current Listed Market 이
      N/A 가 아니면 not_first_listing. 대만 이름에 投控·投資控股(지주사 전환 상장)가 있으면 no_offering.
  - step: event_rules_new_venues
    rule: >-
      Euronext — IPO 유형이 technical·transfer·direct listing·admission 이면 첫 공모 아님, 시장이 Euronext Access 면
      초소형 시장 제외. LSE — 'LSE IPO' 가 IPO 가 아니면 발행 유형(Introduction=공모 없음, Transfer·Reverse takeover=
      첫 상장 아님), 펀드 시장(SFM) 제외. 미국 ADS — 표지에 'This is an initial public offering of American depositary
      shares' 와 'Prior to this offering, there has been no public market for the ADSs' 가 둘 다 있어야 첫 공모,
      공모가 $5 미만이면 below_price_floor. 미국 보통주(us_ipo) — 상장 대기 회사 일치만 보고, 일치하면
      us_ordinary_ritter(명단에 더하지 않고 대기 목록에서 지운다 — Ritter net·Nasdaq 잠정이 센다).
  - step: pipeline
    rule: 상장 대기 목록(theme_listing_pipeline.csv)의 회사와 이름이 맞으면 counted(대기 목록이 이미 출처 있는 테마 판정)
    then: 대기 목록에서 그 행을 지운다(상장된 회사가 대기에 남으면 로더가 거부한다)
  - step: text_required
    rule: 사업 설명을 하나도 못 얻으면 판정하지 않고 다음 실행에 다시 시도한다(pending, 사유 no_text)
  - step: lead_text
    rule: >-
      사업 설명 필드마다 첫 문장만 쓴다(문장 경계 sentence_breaks). 그 문장에서 secondary_markers 뒤는 버린다.
      남은 글을 절(clause_breaks)로 나눈다.
  - step: item_rule
    rule: >-
      각 절에서 verb_chain(동사가 둘 이상 이어진 '研发、生产和销售' 류)을 지우고 item_breaks 로 항목을 나눠 첫 항목만
      아래 용어 검사에 쓴다 — 나열의 뒤쪽 항목은 부업이다.
  - step: semiconductor
    rule: >-
      lead_text 나 산업 분류에 service_exclusions 가 있으면 not_theme(반도체 고객 대상 서비스·유통).
      industry_semiconductor 가 맞거나 어떤 절의 첫 항목에 semiconductor_terms 가 있으면 semiconductor 후보. 그 절에
      application_markers 가 있으면 semiconductor_supply_nouns 가 함께 있을 때만 인정(반도체 고객에 장비·소재·부품·
      소프트웨어를 대는 공급망은 반도체, 그 밖의 고객 산업 언급은 아님). 후보가 있어도 lead_text 에
      semiconductor_exclusions 가 있고 semiconductor_core 가 없으면 not_theme.
  - step: ai
    rule: >-
      어떤 절의 첫 항목에 ai_terms 가 있고, 그 절에 application_markers·enabling_tech·ai_hardware_exclusions 가 없으면 ai.
  - step: default
    rule: not_theme

sentence_breaks: ["。", "；", ";", "！", "\n", "2.", "2、", ". "]
clause_breaks: ["，", ",", "：", ":"]
secondary_markers: ["以及", "此外", "另外", "同时", "并且", "並且", "as well as", "또한"]
item_breaks: ["、", "及", "和", "与", "與"]
verb_chain_terms: ["研发", "研究", "开发", "開發", "设计", "設計", "生产", "生產", "制造", "製造", "销售", "銷售",
                   "研製", "运营", "運營", "服务", "服務", "研發"]

industry_semiconductor:               # 거래소·공시가 붙인 산업 분류(부분 일치)
  - 半導體業
  - 半导体
  - 반도체 제조업
