# MTS 표시 진단 계약 v1 — 감시 결과(연구 계층 derived)를 V8 카드 라벨로 싣는 유일한 경로 (U1).
# 결과(첫 배지 렌더·첫 예약 실행) 전에 커밋한다. 수정은 v2 신규 등록으로만 하고 v1 은 보존한다.
schema_version: 1
contract_id: mts_display_diagnostics_v1
status: registered
