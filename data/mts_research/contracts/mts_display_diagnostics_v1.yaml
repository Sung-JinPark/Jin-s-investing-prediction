  numbers_changed: false          # V8·V13·daily6m 확률·분위수·성적 숫자 무변경
  auto_reforecast: false
  auto_retrain: false
  gate_effect: none               # V8 operational_gate·V13 live_forward_gate·T7·승격·숨김과 연결 없음
  scoring_effect: none            # 공식 해소 basis(grid) 무변경 (U7)
  notice: '참고 의견, 매매 신호 아님'
relationship:
  research_contract: data/mts_research/contracts/mts_research_v1.draft.yaml
  research_contract_unchanged: true
