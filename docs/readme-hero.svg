<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Jin's Investing Prediction</title>
  <desc id="desc">Public data flows through validation and independent scenario engines into a visual market outlook and audit trail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.58" stop-color="#12151c"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d00"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4d00" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="28" fill="url(#grid)"/>
  <circle cx="1040" cy="80" r="310" fill="url(#glow)"/>

  <g transform="translate(74 66)">
    <rect width="14" height="14" rx="3" fill="#ff3d00"/>
    <rect x="17" width="14" height="14" rx="3" fill="#ff8700"/>
    <rect y="17" width="14" height="14" rx="3" fill="#d8003f"/>
    <rect x="17" y="17" width="14" height="14" rx="3" fill="#ffb000"/>
    <text x="48" y="12" fill="#aeb5c2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">OPEN MARKET RESEARCH SYSTEM</text>
  </g>

  <text x="74" y="170" fill="#ffffff" font-family="Inter, Pretendard, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">JIN'S INVESTING</text>
  <text x="74" y="231" fill="#ffffff" font-family="Inter, Pretendard, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">PREDICTION</text>
  <rect x="75" y="260" width="422" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="74" y="306" fill="#b7bdc8" font-family="Inter, Pretendard, Arial, sans-serif" font-size="20">Evidence-conditioned market outlook · three independent scenarios</text>

  <g transform="translate(74 365)" filter="url(#shadow)">
    <g>
      <rect width="228" height="112" rx="15" fill="#171b23" stroke="#363d4b"/>
      <text x="20" y="31" fill="#ff8a4c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">01 · INGEST</text>
      <text x="20" y="62" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">PUBLIC DATA</text>
      <text x="20" y="87" fill="#8e96a5" font-family="Inter, Arial, sans-serif" font-size="13">Market · Macro · Events</text>
    </g>
    <path d="M 236 56 H 267" stroke="#596170" stroke-width="2"/>
    <path d="M 259 49 L 267 56 259 63" fill="none" stroke="#596170" stroke-width="2"/>

    <g transform="translate(275)">
      <rect width="228" height="112" rx="15" fill="#171b23" stroke="#363d4b"/>
      <text x="20" y="31" fill="#ff8a4c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">02 · VERIFY</text>
      <text x="20" y="62" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">POINT IN TIME</text>
      <text x="20" y="87" fill="#8e96a5" font-family="Inter, Arial, sans-serif" font-size="13">Source · Vintage · Unit</text>
    </g>
    <path d="M 511 56 H 542" stroke="#596170" stroke-width="2"/>
    <path d="M 534 49 L 542 56 534 63" fill="none" stroke="#596170" stroke-width="2"/>

    <g transform="translate(550)">
      <rect width="228" height="112" rx="15" fill="#171b23" stroke="#ff6b2c" stroke-opacity=".8"/>
      <text x="20" y="31" fill="#ff8a4c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">03 · MODEL</text>
      <text x="20" y="62" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">S1 · S2 · S3</text>
      <text x="20" y="87" fill="#8e96a5" font-family="Inter, Arial, sans-serif" font-size="13">Independent DB layers</text>
    </g>
    <path d="M 786 56 H 817" stroke="#596170" stroke-width="2"/>
    <path d="M 809 49 L 817 56 809 63" fill="none" stroke="#596170" stroke-width="2"/>

    <g transform="translate(825)">
      <rect width="228" height="112" rx="15" fill="#171b23" stroke="#363d4b"/>
      <text x="20" y="31" fill="#ff8a4c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">04 · EXPLAIN</text>
      <text x="20" y="62" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">VISUAL AUDIT</text>
      <text x="20" y="87" fill="#8e96a5" font-family="Inter, Arial, sans-serif" font-size="13">Outlook · Evidence · Record</text>
    </g>
  </g>

  <g transform="translate(874 78)">
    <rect width="250" height="166" rx="20" fill="#151922" stroke="#353b48"/>
    <text x="22" y="31" fill="#858d9b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1">SCENARIO PATHS</text>
    <path d="M 22 124 C 60 116, 76 70, 112 76 S 168 45, 225 27" fill="none" stroke="#ff4b20" stroke-width="4"/>
    <path d="M 22 124 C 66 118, 93 128, 126 114 S 182 121, 225 105" fill="none" stroke="#ffac1c" stroke-width="4"/>
    <path d="M 22 124 C 62 130, 84 151, 119 142 S 172 157, 225 151" fill="none" stroke="#cf104a" stroke-width="4"/>
    <line x1="22" y1="124" x2="225" y2="124" stroke="#ffffff" stroke-opacity=".15" stroke-dasharray="4 5"/>
  </g>
</svg>
