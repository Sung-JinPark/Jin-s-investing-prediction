name: ipo-edgar-watch

on:
  schedule:
    # 토요일 01:40 UTC (10:40 KST). statistics-refresh(00:20)와 시간대를 분리한다.
    - cron: "40 1 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investing-data-writer
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Decide whether this fortnight is due
        id: gate
        shell: bash
        run: |
          # 짝수 ISO 주차만 실행 = 격주. `date +%V`는 "08"/"09"처럼 0으로 채워져
          # 오는데 bash 산술은 그것을 8진수로 읽어 8·9주차에 터진다. 10# 강제.
          week="$(date -u +%V)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "수동 실행 — 격주 게이트를 건너뛴다."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ $(( 10#$week % 2 )) -eq 0 ]; then
            echo "ISO week $week 짝수 — 실행."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "ISO week $week 홀수 — 이번 주는 건너뛴다."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install statistics pipeline
        if: steps.gate.outputs.run == 'true'
        run: pip install -e "." pytest
      - name: Sweep EDGAR 424B4 for AI IPO review candidates
        if: steps.gate.outputs.run == 'true'
        run: python -m ai_fc ipo-edgar-watch
      - name: Validate the watch contract
        if: steps.gate.outputs.run == 'true'
        run: pytest -q src/tests/test_ipo_edgar_watch.py
      - name: Commit the review queue
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/statistics/ipo/edgar_candidates.json
          unexpected="$(git diff --cached --name-only | grep -Ev '^data/statistics/ipo/edgar_candidates\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected or protected path staged by the EDGAR watch:"
            echo "$unexpected"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No new EDGAR candidates to commit."
            exit 0
          fi
          git commit -m "data: biweekly EDGAR 424B4 IPO review queue $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report the review queue
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          queue = pathlib.Path("data/statistics/ipo/edgar_candidates.json")
          rows = json.loads(queue.read_text(encoding="utf-8"))
          print(f"## EDGAR 424B4 review queue — {rows['status']}")
          print(f"- window: `{rows['window_start']}` → `{rows['window_end']}`"
                f" (reviewed through `{rows['reviewed_through']}`)")
          print(f"- counts: `{rows['counts']}`")
          if rows["errors"]:
              print(f"- errors: `{rows['errors']}`")
          print("")
          print("| filed | company | keywords | filing |")
          print("| --- | --- | --- | --- |")
          for row in rows["candidates"]:
              if row["already_in_cohort"]:
                  continue
              keywords = ", ".join(row["matched_keywords"])
              print(f"| {row['filed_at']} | {row['company']} | {keywords} "
                    f"| [{row['accession']}]({row['filing_url']}) |")
          print("")
          print("Published counts are never changed by this watch. Merging a candidate "
                "into ai_broad_cohort is a manual review of the final prospectus.")
          PY
