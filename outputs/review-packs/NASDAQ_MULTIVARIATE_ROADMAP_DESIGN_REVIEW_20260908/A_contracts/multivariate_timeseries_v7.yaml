model_id: shadow.nasdaq_pit_hierarchical_distribution_v7
model_version: 7
probability_space: research_timeseries_v7_conditional
probability_unit: fraction

immutable_predecessor:
  model_id: shadow.nasdaq_pit_hierarchical_distribution_v6
  run_id: tsv6-sealed-46d58750db2abe8b40cec159
  status: shadow_gate_hold
  may_modify: false
