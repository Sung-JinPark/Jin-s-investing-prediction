    last_origin_63_session_label_matured: true
    active_regime_binding_minimum_origins: 20
    absent_regime_policy: not_applicable
    thresholds_frozen_before_first_forecast: true
    overlap_aware_ci: true
    non_overlapping_robustness: true

publication:
