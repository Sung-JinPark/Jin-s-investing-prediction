# ai-fc 루트 프로젝트 선언 (v2 구조 개편 2026-07-20 — HF/업계 벤치마킹 기반)
# 원칙: 파일 이동 0건 — src/ai_fc·dualdb/dualdb 현 위치 그대로 선언만 추가.
# 기존 실행 경로(cd src && python -m ai_fc)와 uv run ai-fc 병존.
# 주의: 휠(비-editable) 배포 금지 — config.py의 __file__ 루트 앵커가 파손됨 (벤치마킹 B-1).

[project]
name = "ai-fc"
version = "0.2.0"
description = "AI Superforecaster — 시장 이벤트 확률화 엔진 (P1, 참고 의견 — P3 게이트 전)"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "anthropic",
    "openai>=1.68",
    "pydantic>=2",
    "pyyaml",
    "python-frontmatter",
    "numpy",
    "scipy",
    "Pillow>=10",
    # Windows does not ship the IANA zoneinfo database used by Asia/Seoul.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# 오픈웨이트 추론 레이어 (ai_fc ml) — 추론 전용, 학습 금지 (CLAUDE.md ML 게이트)
ml = [
    "torch",
    "transformers",
    "chronos-forecasting",
]
pit = [
    "duckdb>=1.3",
    "pyarrow>=18",
]
timeseries = [
    "pandas>=2.2,<3",
    "statsmodels==0.14.6",
]
timeseries-v5 = [
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "exchange-calendars>=4.6,<5",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
    "pyarrow>=18",
    "duckdb>=1.3",
]
screenshot = [
    "playwright>=1.48,<2",
]
# 죽은 코드 탐지 전용 — 런타임 의존성 아님 (CI는 설치하지 않는다)
dev = [
    "ruff>=0.6,<1",
]

[project.scripts]
ai-fc = "ai_fc.cli:main"

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"          # 기본 module-root="src" → src/ai_fc 무이동 인식

[tool.uv.workspace]
members = ["dualdb"]

[tool.pytest.ini_options]
testpaths = ["src/tests", "dualdb/tests"]

# 죽은 코드 탐지 설정. exclude는 바이트 봉인·V7 보호·감사 증거 스냅샷 —
# 이 경로들은 소스 바이트가 곧 검증 계보이므로 린트 대상이 아니다
# (docs/DEAD_CODE_CLEANUP_PROMPT.md의 RED-LINE과 동일 집합).
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "src/ai_fc/timeseries",
    "src/ai_fc/timeseries_v1",
    "src/ai_fc/timeseries_v2",
    "src/ai_fc/timeseries_v3",
    "src/ai_fc/timeseries_v4",
    "src/ai_fc/timeseries_v5",
    "src/ai_fc/timeseries_v6",
    "src/ai_fc/timeseries_v7",
    "src/ai_fc/timeseries_v8",
    "src/ai_fc/scenario_v5",
    "src/ai_fc/scenario_v5_2",
    "src/ai_fc/scenario.py",
    "src/ai_fc/scenario_structure.py",
    "src/ai_fc/scenario_v4_shadow.py",
    "src/tests/timeseries_v5",
    "src/tests/timeseries_v6",
    "src/tests/test_multivariate_timeseries*.py",
    "src/tests/test_scenario*.py",
    "src/tests/test_ralph_timeseries.py",
    "src/tests/timeseries_v7/test_v6_gate_audit.py",
    "tools/*timeseries*",
    "tools/*scenario*",
    "tools/*v6*",
    "tools/atlas*.py",
    "reports",
    "docs",
    "outputs",
]

[tool.ruff.lint]
select = ["F401", "F811", "F841", "ARG"]
