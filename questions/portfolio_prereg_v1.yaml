# C5 질문 포트폴리오 사전등록 v1 — 결과 전 커밋 (Q2)
#
# 지위: 이 파일은 C5 캘리브레이션 프로그램(docs/design/c5_calibration_program_blueprint_v1_260909.md)
#       §6.5의 사전등록 정본이다. 신규 질문은 이 규칙을 통과해야만 registry.yaml 에 등록된다.
#
# 불변 규율:
#   - 이 파일은 **결과를 보기 전에** 커밋됐다. 개정은 개정 커밋 + 사용자 재승인으로만 한다.
#   - P3 게이트 산술(50문항·Brier 0.18)은 CLAUDE.md 소관이며 이 파일이 바꾸지 않는다.
#   - 예산을 맞추려 해소가능성을 희생하지 않는다 — 충돌 시 해소가능성이 이긴다(설계도 §5 Q3 정지 규칙).

schema_version: 1
prereg_id: C5_PORTFOLIO_V1
committed_before_results: true
drafted: '2026-09-09'
approved: '2026-09-09'
approval_channel: user_chat_verbatim
approval_text: "다 승인이야. 월예산도 40불로 늘려. 그리고 둘다 단계별로 진행해."
approval_received_at: '2026-09-09T05:45:30+00:00'   # 도구 호출 기록 기준 (KST 2026-09-09 14:45:30)
decision_record: docs/DECISIONS.md#2026-09-09-c5-a1-a2-a3
blueprint: docs/design/c5_calibration_program_blueprint_v1_260909.md

# ── 착수 시점 실측 (결과 전 고정 — 이후 진도는 이 기준선에서 잰다) ────────────
baseline_at_prereg:
  measured_on: '2026-09-09'
  gate_view: v_gate_status          # src/ai_fc/db/schema.sql:433 — 판정 정본
  n_questions_primary: 5
  n_rows_primary: 8
  brier_primary: 0.1273
  registry_active: 34
  registry_resolved: 6
  registry_void: 3
  structural_ceiling: 39            # 5 + 34 < 50 — 신규 신설이 산술적으로 강제됨
  # 예리도 실측 (설계도 §3 D2). 게이트 Brier 는 행 평균이므로 행 기준이 정본.
  sharpness_rows: {n: 51, mean_pq: 0.1841, deficit: -0.2075}
  sharpness_latest_round: {n: 33, mean_pq: 0.1874}
  sharpness_reforecast_effect: {n: 13, first: 0.1845, latest: 0.1636, delta: -0.0209}

# ── 예리도 예산 ───────────────────────────────────────────────────────────
# p(1-p) = 완전 캘리브레이션 하의 기대 Brier. 이 값이 임계를 넘으면 실력과 무관하게 탈락.
sharpness_budget:
  threshold: 0.18                   # P3 임계 — 변경 불가
  target_mean_pq_new: 0.15          # 신규 20문항 목표 평균 (전형 확률 ~18% / ~82%)
  per_question_cap: 0.21            # 개별 상한 (p ~30%~70% 구간 배제)
  exception_slots: 3                # 전략적으로 중요하나 예리하지 않은 질문용
  reconciliation:
    estimate_before_first_forecast: true   # 예상 확률대를 첫 예측 전에 기입 (사후 합리화 차단)
    record_estimate_error: true            # 예상 vs 실제 첫 확률 15%p+ 괴리는 기록
    recompute_on_actual: true              # 예산 대사는 실제 첫 예측 확률로 재계산

# ── 분산 규칙 (독립성 — 설계도 §3 D3) ─────────────────────────────────────
diversification:
  max_driver_share: 0.40            # 현재 ai-capex-cycle 19/40 = 48% (이미 위반 상태)
  max_same_deadline: 3              # 현재 2026-12-31 에 7문항
  min_domains: 4
  min_short_horizon_share: 0.50     # 신규의 50%+ 는 90일 이내 마감 (처리량 D4)
  drivers_tag_required: true        # 신규는 drivers 태그 필수 — ESS 계산 가능성

# ── 조합 (승인된 20문항) ──────────────────────────────────────────────────
composition:
  policy_decision:                  # D군 — FOMC 등. 예산 흑자 최대
    count: 4
    target_pq: 0.09
  macro_threshold:                  # C군 — 임계 설계로 예리도 조절 가능
    count: 6
    target_pq: 0.15
  volatility_event:                 # E군 — EXIT 트리거 직결. §6.6 특별 규율 적용
    count: 4
    target_pq: 0.13
  corporate_event:                  # F군 — IPO/인수 등
    count: 3
    target_pq: 0.16
  exception:                        # 전략 중요 · 예산 무관 슬롯
    count: 3
    target_pq: 0.22
projected:
  new_questions: 20
  assumed_rounds_per_question: 2
  new_rows: 40
  new_mean_pq: 0.1425
  combined_row_mean_pq: 0.1658      # (51*0.1841 + 40*0.1425) / 91
  headroom_to_threshold: 0.0142     # 관측 잡음(~0.015~0.02)과 같은 크기 — 얇다
  note: 재예측 예리화(-0.02급)는 예산에 미리 반영하지 않는다 (보수).

# ── 금지 질문형 (설계도 §6.4) ─────────────────────────────────────────────
prohibited_forms:
  - coin_flip              # 예상 확률 40~60% 가 base rate 상 불가피한 질문 (일간 등락 등)
  - near_certain           # 예상 확률 < 3% 또는 > 97% — 정보가치 0, 패딩
  - ambiguous_resolution   # 1·2차 출처가 다른 숫자를 낼 것이 예견되는 질문
  - self_referential       # 우리 시스템 출력에 의존하는 질문
  - retrospective          # 과거 사건 (CLAUDE.md 5원칙 5)

# ── E군 특별 규율 (V13-D6 승계 — 설계도 §6.6) ────────────────────────────
volatility_event_rules:
  do_not_justify_v13_wiring: true   # C5 표본 목적. V13 배선(V13-D6) 근거로 쓰지 않는다
  avoid_v13_passed_cells: true      # rv_h5 / rv_h21 / vix25_h21 과 임계·지평 겹침 회피 우선
  disclose_overlap_if_unavoidable: true
  cite_v13_if_used_as_anchor: true  # V13 카드 숫자를 앵커로 쓰면 예측 파일에 계보 명기

# ── 게이트 대면 시 필수 공시 (부수 증명서 — 설계도 §8) ────────────────────
certificate_required_at_gate:
  - n_questions            # v_gate_status 정본
  - brier_primary
  - bss_vs_anchor          # 패딩 면역 실력 측정. <= 0 이면 자동 활성화하지 않는다 (C5-A4)
  - murphy_rel_res_unc
  - ess_cluster            # 하한으로만 보고 (클러스터 내 완전 상관 가정)
  - bootstrap_ci90         # 클러스터 단위 리샘플링
  - production_path_split  # CLI vs Claude Code 경로별 n·Brier (계측 공백 정직 표기)

# ── 중간 정지 조건 (설계도 §12) ───────────────────────────────────────────
stopping_rules:
  interim_review_at_questions: [20, 30]
  abort_if: 문항 30 시점 클러스터 부트스트랩 CI90 하한 > 0.20 이면 50 까지 가지 않고 부정 결과 선언
  never: [gate_arithmetic_change, post_hoc_failed_tagging, stop_at_49_and_cherry_pick]
