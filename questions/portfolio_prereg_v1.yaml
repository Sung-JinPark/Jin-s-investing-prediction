# 질문 포트폴리오 사전등록 v1 — 2026-09-10
#
# ## 왜 이 계약이 있는가
#
# P3 게이트(해소 50문항 ∧ 행 평균 Brier < 0.18)에서 우리가 통제할 수 있는 것은
# **예측을 잘하는 방법이 아니라 채점될 수 있는 질문을 고르는 방법**이다.
#
# 근거(팩 §4·§13, 2026-09-10 재현):
#   · 완전 캘리브레이션 하의 기대 Brier = E[p(1−p)]. 즉 질문을 고르는 순간 기대 성적의
#     바닥이 정해진다. p=0.5 짜리 질문만 모으면 실력과 무관하게 0.25 에 수렴한다.
#   · 현 원장의 행 기준 예리도는 0.16214, 문항 기준은 0.18563. 후자는 이미 문턱 위다.
#   · 게이트 여유는 0.33 SE — 통계적으로 **미결**이다.
#
# ## 이 파일의 지위
#
# **결과를 보기 전에 커밋된다.** 아래 규칙은 등록 시점에 적용되며, 등록 이후 성적을 보고
# 바꾸지 않는다. 규칙 변경은 새 버전 파일(v2)로만 가능하고 기존 등록분에 소급하지 않는다.
#
# 이 파일이 커밋되기 전에는 **어떤 신규 질문 등록도, 어떤 r2 재예측도 실행하지 않는다.**

schema_version: 1
registered: "2026-09-10"
registered_before_results: true
supersedes: null
authority: |
  이 계약은 **등록 정책**이다. 게이트 판정 산술(db/schema.sql v_gate_status)은 건드리지 않는다.
  게이트는 여전히 DISTINCT 50 ∧ AVG(brier) < 0.18 이고 이 파일은 그 분모에 들어갈 질문을
  고르는 규칙만 정한다.

# ────────────────────────────────────────────────────────────────────
# L1 — z 규율 (핵심)
# ────────────────────────────────────────────────────────────────────
z_rule:
  definition: "z = |임계 − 중심추정| / σ"
  sigma_source_order:
    - "T03 공급 σ (수치 모델 트랙이 제공하는 계열별 표준편차) — 있으면 최우선"
    - "참조클래스 표준편차 — 출처(파일·URL·기간·표본수)를 질문 파일에 필수 기재"
  sigma_must_be_recorded: true
  bands:
    accept: "z >= 1.0"
    exception_slot: "0.7 <= z < 1.0 — 예외 슬롯 최대 3건까지만 등록 가능"
    reject: "z < 0.7 — 등록 거부"
  exception_slot_max: 3
  rationale: |
    z 는 '임계에서 얼마나 멀리 떨어져 있는가'다. z 가 크면 정직한 확률이 0/1 에 가까워지고
    p(1−p) 가 작아져 기대 Brier 바닥이 내려간다. z=1.0 이면 정직 확률 약 0.16 또는 0.84 이고
    p(1−p) ≈ 0.134 로 문턱 0.18 아래다. z=0.7 이면 약 0.242/0.758 로 p(1−p) ≈ 0.183 —
    문턱 경계다. 그래서 0.7 이 거부선이다.
  required_fields_on_registration: [z, sigma, sigma_source, honest_probability_estimate]

# ────────────────────────────────────────────────────────────────────
# 사구간 — 등록해도 게이트에 도움이 되지 않는 확률대
# ────────────────────────────────────────────────────────────────────
dead_zone:
  band: [0.235, 0.765]
  reason: |
    p(1−p) 가 0.18 이상이 되는 구간이다(0.235 × 0.765 = 0.17978).
    이 구간에 정직 확률이 떨어지는 질문은 **완전 캘리브레이션이어도** 기대 Brier 가 문턱 위다.
    등록 자체를 막는다.
  per_question_expected_brier_cap: 0.21
  cap_exception_slots: 3
  cap_note: |
    0.18 이 아니라 0.21 을 문항 상한으로 두는 이유: 0.18 은 **포트폴리오 평균** 제약이지
    문항별 제약이 아니다. 낮은 문항들이 평균을 끌어내리므로 개별 문항은 약간의 여유를 갖는다.
    다만 0.21 을 넘는 문항은 예외 슬롯을 소모한다.

# ────────────────────────────────────────────────────────────────────
# 도메인 믹스
# ────────────────────────────────────────────────────────────────────
domain_mix:
  earnings_like_properties:
    - "임계 원거리 — 컨센서스와 임계 사이 거리가 σ 대비 크다"
    - "비개정 판정 — 판정 근거가 사후 개정되지 않는다(발표 수치 확정)"
    - "발행자 예보 존재 — 회사 가이던스·컨센서스 같은 공개 중심추정이 있다"
  priority: "위 세 성질을 모두 충족하는 질문을 우선 등록한다. 셋 중 둘만 충족해도 z 규율을 통과하면 가능."
  market_daily:
    status: permanently_excluded
    reason: coin_flip
    evidence: "원장 실측 Brier 0.2708 (n=2) — 구조적 사구간. 일간 방향은 z 가 원리적으로 0 에 가깝다."
  macro:
    status: conditional
    conditions:
      - "공개 컨센서스가 존재할 것"
      - "정직 확률이 사구간 [0.235, 0.765] 밖일 것"
    note: "컨센서스가 없으면 σ 를 세울 수 없고 z 규율이 성립하지 않는다 — L3 유예 대상."

# ────────────────────────────────────────────────────────────────────
# 신규 등록 계획
# ────────────────────────────────────────────────────────────────────
new_registration:
  target_count: 12
  deadline_cap: "2027-01-15"
  expected_void_rate: 0.149
  expected_survivors: 10.2
  selection_procedure:
    - "후보 20건 초안을 먼저 작성한다"
    - "각 후보에 z·σ·σ출처·정직확률 추정을 기재한다"
    - "z 규율로 12건을 선택한다"
    - "탈락 8건은 사유와 함께 파일로 남긴다 — 선택되지 않은 것도 기록한다"
  user_approval_required: true
  approval_note: "최종 12건 목록은 사용자 승인 후에만 registry.yaml 에 등록한다."
  registration_blocked_until: "이 파일 커밋 + 사용자 12건 승인"

# ────────────────────────────────────────────────────────────────────
# L3 / L4 — 표본 선택 위험이 있으므로 발동조건을 결과 전에 고정한다
# ────────────────────────────────────────────────────────────────────
L3_defer_r1_if_no_consensus:
  status: registered
  trigger: "공개 컨센서스 검색 결과가 NOT FOUND 이고 σ 를 세울 참조클래스도 없을 때"
  scope: "이 계약 등록일(2026-09-10) 이후 신규 등록 질문만. 기존 질문에 소급 적용 금지."
  action: "r1 을 유예한다. 유예는 예측 부재이지 예측 철회가 아니다."
  non_selection_log_required: true
  non_selection_log_path: "calibration/deferral_log.csv"
  log_fields: [question_id, deferred_at, trigger, searched_sources, next_attempt_after]
  prohibition: |
    유예를 **결과를 보고 나서** 발동하는 것은 표본 선택이며 프로그램 중단 사유다.
    유예 판단은 예측 실행 전에만 가능하고, 유예된 회차도 반드시 로그에 남는다.

L4_research_depth_floor:
  status: registered
  trigger: "리서치 검색 성공 건수 < k (k=2) 이거나 데블스 애드버킷 섹션 생성 실패"
  scope: "이 계약 등록일 이후 신규 등록 질문만. 소급 금지."
  action: "예측을 생산하지 않고 유예한다. 이미 생산된 예측을 사후에 failed 로 재분류하지 않는다."
  non_selection_log_required: true
  non_selection_log_path: "calibration/deferral_log.csv"
  prohibition: "사후 failed 태깅 금지 — 성적을 본 뒤 표본을 빼는 것과 구별되지 않는다."

# ────────────────────────────────────────────────────────────────────
# 정지 규칙
# ────────────────────────────────────────────────────────────────────
stopping_rules:
  interim_review_at_questions: [20, 30]
  negative_declaration:
    at_questions: 30
    condition: "문항 클러스터 부트스트랩 CI90 하한 > 0.20"
    action: "게이트 부정 선언 — 트랙 종결 판정서 작성, 자금 결정 경로 영구 차단 유지"
  never:
    - stop_at_49_and_cherry_pick
    - post_hoc_failed_tagging
    - gate_arithmetic_change
  never_note: |
    특히 49문항에서 멈춰 좋은 질문만 골라 50번째를 채우는 것은 게이트 조작이다.
    50 도달은 등록 순서대로이며 성적을 보고 순서를 바꾸지 않는다.

# ────────────────────────────────────────────────────────────────────
# 게이트 상태 표현
# ────────────────────────────────────────────────────────────────────
status_wording:
  current: "미결 (0.33 SE)"
  forbidden_words: ["통과"]
  note: "행 평균이 문턱 아래여도 SE 여유가 0.33 이면 통계적으로 미결이다. 표시·보고 어디에도 '통과'를 쓰지 않는다."
