  title: ADBE FQ4 2026 — non-GAAP EPS가 컨센서스를 4% 이상 상회
  question: Adobe가 FQ4 2026 실적에서 보고하는 non-GAAP 희석 EPS가, 발표 직전 스냅샷된 컨센서스의 1.04배 이상일 확률은?
  deadline: '2026-12-18'
  resolution: 'YES = A >= C x 1.04. A = 회사가 해당 분기 최초 실적 공시(8-K Ex-99.1 또는 이에 상당하는 최초 공시)에서 자사 조정(non-GAAP) 기준으로 제시한 희석 주당순이익.
