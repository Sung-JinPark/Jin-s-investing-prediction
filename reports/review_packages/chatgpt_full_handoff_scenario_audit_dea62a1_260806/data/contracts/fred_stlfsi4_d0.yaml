point_in_time:
  observation_period: week_ending_friday
  available_at: Actual St. Louis Fed or FRED publication timestamp, normally the following Wednesday; never the Friday observation date
  revision_vintage: native_release_capture_after_activation
  historical_use: Current-vintage history must be labelled reconstructed and must not be represented as native PIT history.

license:
  status: copyrighted_citation_required_activation_review
  fred_terms_url: https://fred.stlouisfed.org/legal/terms/
  owner_terms_url: https://www.stlouisfed.org/about-us/legal-information
  redistribution: citation_required_and_activation_review
  database_creation: prohibited_pending_source_specific_clarification
  automated_access: d0_ephemeral_probe_only_pending_activation_review
  predictive_analytics_use: prohibited_pending_source_specific_clarification
  attribution: Federal Reserve Bank of St. Louis, St. Louis Fed Financial Stress Index STLFSI4, retrieved via FRED.
  rationale: The series is labelled Copyrighted - Citation Required, while current FRED terms separately restrict storage and use in software or machine-learning systems; D0 may observe transport and release behavior but may not activate a collector or model use.

activation_gate:
  - Fourteen calendar days of ephemeral endpoint, schema, release, and revision monitoring through 2026-08-18 without committing raw payloads.
  - Written or authoritative source-specific clarification covering automated retrieval, local storage, public display, and intended predictive use.
  - Contract review and source-registry registration in a separately approved S1 change.
  - Collector, archive, receipt, PIT, attribution, and stale-state tests must ship together; model use remains off until then.
fallback: Keep STLFSI4 unavailable if rights remain unresolved; NFCI stays in legal review and no synthetic stress value is substituted.
